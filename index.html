/* 标题画面：三位武将立绘 + Pop 风 LOGO 牌 */
.title{align-content:end;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.tarts{position:absolute;left:0;right:0;top:6%;bottom:24%;pointer-events:none}
.ta{position:absolute;bottom:0;height:78%;width:auto;max-width:none;filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 10px 16px #000a)}
.ta.c{left:50%;height:100%;transform:translateX(-50%);animation:heroIn .6s ease-out}
.ta.l{left:-14%;opacity:.95;animation:heroIn .6s .1s ease-out backwards}
.ta.r{right:-14%;opacity:.95;transform:scaleX(-1);animation:heroInR .6s .1s ease-out backwards}
@keyframes heroInR{from{transform:scaleX(-1) translateX(-30px);opacity:0}}
.tlogo{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 26px 14px;border-radius:22px;background:linear-gradient(180deg,#ff8a95,var(--red-2) 55%,var(--red-3));border:4px solid var(--ink);box-shadow:inset 0 3px 0 #ffffff70,0 6px 0 var(--ink),0 0 40px #ff5a5f88;transform:rotate(-3deg);animation:pop .5s ease-out}
.tlogo .tl{font-size:64px;color:#fff;text-shadow:var(--ol),0 0 24px #fff59a99}
.tlogo .ts{font-size:15px;color:var(--yel-1)}
.title .tt{margin-top:28px}

/* 第三轮 */
.gd-max{grid-column:1/-1;display:grid;gap:2px;text-align:center;padding:8px;border-radius:14px;background:#ece6ff;border:3px solid var(--ink);font:900 16px/1.2 var(--font-pop);color:var(--text)}
.gd-max small{font:800 11px var(--font-ui);color:var(--muted)}
.lw .rar{margin-top:-10px;position:relative;z-index:1;font-size:10px;line-height:13px;padding:0 4px}
.lw.SR .wi,.lw.SSR .wi{box-shadow:inset 0 0 0 2px var(--rc),0 0 16px var(--rc),0 3px 0 var(--ink)}
.pact{padding-top:22px}

/* ---------- 11/04 装备精修：贴纸图标 + 稀有度底板（光芒、网点），SSR 扫光 ---------- */
.wc{background:radial-gradient(circle at 1.2px 1.2px,#ffffff30 1.1px,#fff0 1.3px) 0 0/7px 7px,radial-gradient(circle at 50% 46%,var(--wc1) 0,var(--wc2) 62%,color-mix(in srgb,var(--wc2) 55%,#231748) 100%);border-radius:9px}
.wc.N-c{--wc1:#f3f4f8;--wc2:#8d97a8}.wc.R-c{--wc1:#c9f0ff;--wc2:#2f86d8}.wc.SR-c{--wc1:#f4d6ff;--wc2:#8e44d8}.wc.SSR-c{--wc1:#fff6b8;--wc2:#f09a1c}
.wc.SR-c,.wc.SSR-c{background:repeating-conic-gradient(from 0deg at 50% 46%,#ffffff2a 0 8deg,#fff0 8deg 18deg),radial-gradient(circle at 50% 46%,var(--wc1) 0,var(--wc2) 62%,color-mix(in srgb,var(--wc2) 55%,#231748) 100%)}
.wc.SSR-c::after{content:"";position:absolute;inset:-40% auto -40% -60%;width:40%;background:linear-gradient(90deg,#fff0,#ffffffb0,#fff0);transform:rotate(20deg);animation:wshine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes wshine{0%,60%{left:-60%}100%{left:130%}}
.wc .ic{inset:2% 10%;filter:drop-shadow(0 3px 0 #23174870)}
.wc.sq .ic{inset:6%}
.wc.tall .ic{inset:16% 0 16%}
.wc .wr{right:4px;top:2px;padding:0 4px;border-radius:5px;background:#231748cc;font-size:10px;line-height:15px}
.wc.empty{background:radial-gradient(circle at 50% 50%,#ffffff12 0 30%,#fff0 31%),#1b1250;border:2.5px dashed #6d62a3;color:#a99fe0}
.wi{background-color:color-mix(in srgb,var(--rc,#ccc) 22%,#fff)}
.whead .wi{width:96px;height:96px;transform:rotate(-4deg)}

/* 功能没解锁：变灰 + 小锁（11/04 审查 P1-6 逐步解锁） */
.ulock{filter:grayscale(1) brightness(.8);position:relative}
.ulock::after{content:"";position:absolute;right:3px;top:9px;width:13px;height:10px;border-radius:3px;background:#231748;border:2px solid #fff;pointer-events:none;z-index:3}
.ulock::before{content:"";position:absolute;right:6px;top:2px;width:7px;height:8px;border:2px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;pointer-events:none;z-index:3}
.tab.ulock .tico{opacity:.7}
.lord.ulock{filter:none}.lord.ulock::before,.lord.ulock::after{display:none}

/* 每日任务 */
.daily{display:grid;gap:8px}
.dq{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:9px 10px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--text);box-shadow:0 3px 0 var(--ink)}
.dq.ok{background:#fff6c8}.dq.got{opacity:.6}.dq.all{background:linear-gradient(90deg,#ffe9a8,#ffd1ec)}
.dqt{display:grid;gap:4px;text-align:left}.dqt b{font:900 14px/1.2 var(--font-pop)}.dqt small{font-size:11px;font-weight:900;color:var(--muted)}
.dbar{height:8px;border-radius:6px;background:#0002;overflow:hidden;border:2px solid var(--ink)}.dbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5fa2,#ffd23f)}
.dr{font:900 13px/1 var(--font-pop);white-space:nowrap}.dq em{font-style:normal;font-weight:900;font-size:12px;color:var(--muted)}
.dq .btn{padding:6px 12px;font-size:13px;min-height:36px}
.pity{font:900 12px/1 var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-xs);text-align:center;margin-top:6px}

/* 扭蛋结果演出（11/04 审查 P1-8）：涂鸦墙背景 + 颜料扭蛋掉落开裂 + 翻开的 SR / SSR 卡背后炸一团颜料 */
.ov.gacha{background:radial-gradient(70% 45% at 50% 40%,#ffffff22,transparent 70%),linear-gradient(#231748cc,#231748ee),url(assets/lobby_bg.webp) center/cover,#231748}
.ov.gacha.r-SR{--burst:var(--r-sr)}.ov.gacha.r-SSR{--burst:var(--r-ssr)}.ov.gacha.r-R{--burst:var(--r-r)}
.gtitle{font:400 34px/1 var(--font-logo);margin:0;color:#fff;text-shadow:var(--ol),4px 4px 0 var(--burst);transform:rotate(-3deg);animation:pop .4s 1.1s both}
.gsum{display:flex;gap:6px;justify-content:center;animation:pop .35s 1.6s both}
.gsum b{font:900 13px/1 var(--font-pop);padding:5px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);color:var(--text)}
.gsum b.SSR{background:var(--r-ssr)}.gsum b.SR{background:var(--r-sr);color:#fff;text-shadow:var(--ol-xs)}.gsum b.nw{background:var(--red-2);color:#fff;text-shadow:var(--ol-xs)}
.gintro{position:absolute;inset:0;z-index:36;display:grid;place-items:center;cursor:pointer;pointer-events:auto;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff10 0 6deg,#fff0 6deg 12deg),radial-gradient(circle at 50% 50%,#4a35c8,#1a1038 75%);animation:gintroOut .25s 1.05s forwards}
.gintro>*{grid-area:1/1}
.gintro .cap{position:relative;width:156px;height:156px;animation:capDrop .45s cubic-bezier(.3,1.6,.6,1) both,capShake .3s .45s 2}
.gintro .cap i{position:absolute;left:0;right:0;border:4px solid var(--ink)}
.gintro .top{top:0;height:50%;border-radius:78px 78px 0 0;background:var(--capc,#49b6ff);animation:capTop .3s .85s forwards}
.gintro .bot{bottom:0;height:50%;border-radius:0 0 78px 78px;background:#fff;animation:capBot .3s .85s forwards}
.gintro .band{top:calc(50% - 8px);height:16px;background:#231748;border-radius:4px;animation:capTop .3s .85s forwards}
.gintro.r-SR{--capc:var(--r-sr)}.gintro.r-SSR{--capc:conic-gradient(#ff3d5a,#ffc23a,#55d47a,#4f95ff,#b27cff,#ff3d5a)}
.gintro.r-SSR .top{background:conic-gradient(#ff3d5a,#ffc23a,#55d47a,#4f95ff,#b27cff,#ff3d5a)}
.gburst{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--burst,#49b6ff) 19% 46%,transparent 47%),radial-gradient(circle at 20% 30%,var(--burst,#49b6ff) 0 9%,transparent 10%),radial-gradient(circle at 80% 25%,var(--burst,#49b6ff) 0 7%,transparent 8%),radial-gradient(circle at 75% 78%,var(--burst,#49b6ff) 0 10%,transparent 11%),radial-gradient(circle at 22% 80%,var(--burst,#49b6ff) 0 6%,transparent 7%);transform:scale(0);opacity:0;animation:burst .45s .85s ease-out forwards}
.gburst.b2{width:460px;height:460px;transform:scale(0) rotate(40deg);animation-delay:.9s;mix-blend-mode:screen}
.gintro.r-SSR .gburst{--burst:#ffcf3a}.gintro.r-SR .gburst{--burst:#c06bff}
@keyframes capDrop{from{transform:translateY(-120vh) rotate(-30deg)}}
@keyframes capShake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes capTop{to{transform:translate(-30px,-160px) rotate(-40deg);opacity:0}}
@keyframes capBot{to{transform:translate(30px,160px) rotate(30deg);opacity:0}}
@keyframes burst{0%{transform:scale(.2);opacity:1}70%{opacity:1}100%{transform:scale(1.25);opacity:.85}}
@keyframes gintroOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.gc{z-index:0}
.gc::before{content:"";position:absolute;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 50%,var(--rc) 0 34%,transparent 35%),radial-gradient(circle at 18% 30%,var(--rc) 0 9%,transparent 10%),radial-gradient(circle at 84% 22%,var(--rc) 0 7%,transparent 8%),radial-gradient(circle at 78% 80%,var(--rc) 0 11%,transparent 12%),radial-gradient(circle at 24% 84%,var(--rc) 0 6%,transparent 7%);transform:scale(0) rotate(-20deg);opacity:0}
.gc.SR.open::before,.gc.SSR.open::before{animation:cardSplat .5s ease-out forwards}
.gc.SSR.open::before{inset:-42%}
@keyframes cardSplat{0%{transform:scale(.2) rotate(-20deg);opacity:1}60%{transform:scale(1.05) rotate(4deg);opacity:.95}100%{transform:scale(1) rotate(0);opacity:.85}}
.gc.SSR.open .front{animation:ssrGlow 1.2s ease-in-out infinite alternate}
@keyframes ssrGlow{from{box-shadow:inset 0 0 0 3px #ffcf3a,inset 4px 4px 0 #ffffff55,0 0 0 2px var(--r-ssr),0 0 14px var(--r-ssr)}to{box-shadow:inset 0 0 0 3px #ffcf3a,inset 4px 4px 0 #ffffff55,0 0 0 3px #fff,0 0 30px var(--r-ssr)}}   /* 11/06 带上内框，闪光时框不消失 */

/* 街区地图 */
.chnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}.chnav b{font:900 15px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.smap{position:relative;margin:0 4px;border-radius:18px;border:3px solid var(--ink);background:linear-gradient(#231748aa,#231748cc),url(assets/lobby_bg.webp) center/cover;overflow:hidden}
.sroad{position:absolute;inset:0;width:100%;height:100%}
.sroad polyline{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sroad .r0{stroke:#ffffff55;stroke-width:14;stroke-dasharray:2 18}
.sroad .r1{stroke:#ff5fa2;stroke-width:12;filter:drop-shadow(0 0 6px #ff5fa2)}
.snode{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:4px solid var(--ink);background:var(--ec);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);padding:0}
.snode b{font:900 20px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.snode.big{width:72px;height:72px;background:conic-gradient(from 0deg,var(--ec),#fff6,var(--ec))}.snode.big b{font-size:28px;color:#ffd23f}
.snode .bn{position:absolute;top:100%;margin-top:6px;white-space:nowrap;font:900 11px/1 var(--font-pop);color:#fff;background:var(--red-2);border:2px solid var(--ink);border-radius:6px;padding:2px 6px}
.snode .st{position:absolute;bottom:-14px;font-style:normal;font-size:12px;color:#ffd23f;text-shadow:var(--ol-xs);letter-spacing:-1px}
.snode.lock{filter:grayscale(.9) brightness(.6)}
.snode.now{animation:nodeBob 1s ease-in-out infinite alternate}
.snode .me{position:absolute;bottom:100%;margin-bottom:8px;font-style:normal;font:900 11px/1 var(--font-pop);background:#ffd23f;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 8px;white-space:nowrap}
.snode.sel{outline:4px solid #fff;outline-offset:3px}
@keyframes nodeBob{to{transform:translate(-50%,calc(-50% - 6px))}}
.ssel{position:sticky;bottom:0;padding:8px 2px 2px;z-index:2}
.soonline{text-align:center;font-size:12px;font-weight:900;color:#d9d0ff;margin-top:10px}

.ov h1.logo{line-height:0}.ov h1.logo img{width:min(78vw,330px);height:auto;filter:drop-shadow(0 6px 0 #231748)}

/* 据点讨伐（11/04，碧蓝幻想的马格纳副本） */
.raid-tip{margin:0 0 10px;color:#e6deff !important;font-weight:800}
.raids{display:grid;gap:12px}
.raid{position:relative;padding:10px 12px 12px;border-radius:18px;border:3px solid var(--ink);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#fff8ea),var(--cream) 55%);box-shadow:0 4px 0 var(--ink);color:var(--text)}
.raid.lock{filter:grayscale(.85);opacity:.75}
.raid .rh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.raid .rh b{font:900 22px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.raid .rh small{font-size:11px;font-weight:900;color:var(--muted)}
.raid .rdrop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.raid .rn{display:grid;justify-items:center;gap:2px;text-align:center}
.raid .rn .wi{width:46px;height:46px}
.raid .rn small{font-size:10px;font-weight:900;line-height:1.2}
.raid .rn em{font-style:normal;font-size:10px;font-weight:900;color:var(--red-2)}
.raid .rn.off .wi{filter:grayscale(1) brightness(.8);opacity:.6}
.raid .rn.off em{color:var(--muted)}
.raid .rtiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.raid .rt{position:relative;display:grid;gap:2px;padding:8px 4px}
.raid .rt b{font-size:15px}
.raid .rt small{font-size:10px}
.raid .rfirst{position:absolute;right:-4px;top:-10px;font-style:normal;font-size:9.5px;font-weight:900;color:#fff;background:var(--red-2);border:2px solid var(--ink);border-radius:8px;padding:1px 5px;transform:rotate(4deg)}
.raid .rlock{font-size:12px;font-weight:800}
.scard .sum-frag{color:var(--red-2);font-weight:900}

/* 武器上限解放星（11/05） */
.wc .wst,.wi .wst{position:absolute;left:3px;bottom:1px;font:900 10px/1 var(--font-pop);color:#ffd23f;text-shadow:var(--ol-xs);letter-spacing:-1px}
.wskills .affix.lock{opacity:.5}
.wskills .affix small{display:block;font-size:10px;color:var(--muted);font-weight:800}
/* 11/05 第 3 步：扭蛋卡上的「+专属武器」、壁画兽的系别标签 */
.gc .front .gwep{position:absolute;top:22px;left:3px;font:900 9px/1.3 var(--font-pop);color:var(--ink);background:var(--yel-1);border:2px solid var(--ink);border-radius:5px;padding:0 3px;white-space:nowrap}
.skind{font:900 10px/1.4 var(--font-pop);padding:0 5px;border:2px solid var(--ink);border-radius:5px;background:#fff;color:var(--ink)}
.skind.gacha{background:var(--yel-1)}
/* 11/05 制作人：底部菜单栏太小 → 放大到主流手游尺寸；矮屏收一点 */
@media (max-height:700px){.tab{min-height:62px}.tab .tico{width:50px;height:50px;border-radius:14px}.tab .tico .uic{width:54px;height:54px}.tab.mid .tico{width:66px;height:66px;margin-top:-26px}.tab.mid .tico .uic{width:64px;height:64px}.tico .th{width:40px;height:40px}.tab span{font-size:13px}}
/* ---------- 11/05 详情页（武器 / 涂鸦手 / 壁画兽）：整页，顶栏 → 大图 → 数值 → 分页签 → 说明卡 + 主按钮 → 底部固定操作 ---------- */
.scrim.full{align-items:stretch;background:#120a32}
.sheet.dp{height:100%;max-height:100%;display:flex;flex-direction:column;padding:0;border:0;border-radius:0;overflow:hidden;animation:dpIn .2s ease-out}
@keyframes dpIn{from{transform:translateX(24px);opacity:0}}
.dp-top{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;background:#231748;border-bottom:3px solid var(--ink);color:#fff}
.dp-top b{flex:1;min-width:0;font:900 20px/1 var(--font-pop);text-shadow:var(--ol-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-back{flex:none;width:44px;height:40px;border-radius:12px;border:3px solid var(--ink);font:900 28px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:linear-gradient(180deg,var(--blu-1),var(--blu-2) 55%,var(--blu-3));box-shadow:0 3px 0 #000}
.dp-mini{flex:none;min-height:40px;padding:2px 10px;border-radius:10px;border:2.5px solid #ffffff55;background:#ffffff14;color:#e6deff;font:900 12px/1.2 var(--font-pop)}
.dp-mini small{display:block;font:700 9px/1.2 var(--font-ui);color:#b9aee8}
.dp-mini:disabled{opacity:.4}
.dp-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 12px 14px}
.dp-scroll::-webkit-scrollbar{display:none}
.dp-hero{position:relative;margin:0 -12px;height:clamp(190px,32vh,280px);overflow:hidden;border-bottom:3px solid var(--ink)}
.dp-hero.wh,.dp-hero.sh{display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--ec) 70%,#fff) 0,var(--ec) 30%,#231748 72%)}
.dp-burst{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,#ffffff22 0 8deg,#fff0 8deg 20deg);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.dp-hero.wh .wi{position:relative;width:min(46vw,190px);height:min(46vw,190px);transform:rotate(-4deg);filter:drop-shadow(0 6px 0 #0006)}
.dp-hero.sh img{position:relative;height:96%;max-width:96%;object-fit:contain;filter:drop-shadow(0 6px 0 #0006)}
.dp-hero.off img{filter:grayscale(1) brightness(.5)}
.dp-plate{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 20px);padding:5px 10px;border-radius:12px;background:#231748e6;border:2.5px solid var(--ink);color:#fff}
.dp-plate small{font-size:11px;font-weight:900;color:var(--yel-1)}
.dp-plate .stars{font-size:15px;color:var(--yel-2)}
.dpg .gd-hero{height:clamp(200px,30vh,270px)}
.dp-stats{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;margin:10px 0}
.dp-stats div{display:grid;gap:1px;min-width:0;padding:6px 9px;border-radius:12px;background:linear-gradient(180deg,#3a2b78,#231748);border:3px solid var(--ink);color:#fff;box-shadow:0 3px 0 var(--ink)}
.dp-stats span{font-size:10.5px;font-weight:900;color:#d9d0ff}
.dp-stats b{font:900 21px/1.05 var(--font-pop);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-stats b small{font-size:12px;color:#d9d0ff}
.dp-stats .atk b{color:#ffb44a}.dp-stats .crit b{color:#8dff9a}
.dp-tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:0 -12px 12px;background:#231748;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.dp-tabs button{position:relative;min-height:46px;border:0;background:none;font:900 16px/1 var(--font-pop);color:#b9aee8;letter-spacing:.06em}
.dp-tabs button[aria-pressed="true"]{color:#fff;text-shadow:var(--ol-xs);background:#ffffff12}
.dp-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:4px;height:5px;border-radius:3px;background:var(--yel-2)}
.dp-tabs .dot{position:absolute;top:7px;right:14%;width:11px;height:11px;border-radius:50%;background:var(--red-2);border:2px solid var(--ink)}
.dp-card{margin-bottom:12px;padding:12px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--text)}
.dp-card h4{margin:0 0 4px;font:900 17px/1.2 var(--font-pop);color:var(--text)}
.dp-card>p{margin:0 0 10px;font-size:12px;font-weight:700;line-height:1.55;color:#4a3f78}
.dp-ba{display:grid;gap:6px;margin:0 0 12px}
.dp-ba div{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:#f2ecff;border:2px solid #d6caff}
.dp-ba span{flex:1;font-size:12px;font-weight:900;color:var(--muted)}
.dp-ba b{font:900 17px/1 var(--font-pop);color:var(--text);font-variant-numeric:tabular-nums}
.dp-ba i{font-style:normal;font-weight:900;color:var(--muted)}
.dp-ba em{font:900 19px/1 var(--font-pop);font-style:normal;color:#e0322a;font-variant-numeric:tabular-nums}
.dp-ba .cc-bt,.dp-ba .off{font-size:14px}
.dp-acts{display:grid;grid-template-columns:1.4fr 1fr;gap:9px}
.dp-acts.one{grid-template-columns:1fr}
.dp-acts .btn{min-height:56px}
.dp-note{margin:10px 0 0;font-size:10.5px;font-weight:700;color:var(--muted)}
.dp-card .wskills{margin-bottom:10px}
.dp-foot{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#231748;border-top:3px solid var(--ink)}
.dp-foot .wide{grid-column:1/-1}
.dp-foot .btn{min-height:52px}

.title{display:block;background:url(assets/title_bg.webp) center/cover,#ffb02e;padding:0;overflow:hidden}

.title .t-logo{position:absolute;z-index:3;left:50%;top:max(4%,env(safe-area-inset-top,0px));width:min(90%,480px);transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(0 8px 0 #00000055);animation:tLogo .7s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tLogo{0%{opacity:0;transform:translateX(-50%) rotate(-3deg) scale(2.2)}100%{opacity:1}}
.title .t-hero{position:absolute;z-index:2;left:50%;bottom:9%;height:min(58%,760px);width:auto;max-width:none;transform:translateX(-50%);filter:drop-shadow(4px 0 0 var(--ink)) drop-shadow(-4px 0 0 var(--ink)) drop-shadow(0 -4px 0 var(--ink)) drop-shadow(0 14px 18px #0008);animation:heroIn .6s .15s ease-out backwards}
.title .tt{position:absolute;z-index:4;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:400 30px/1 "PopNum",var(--font-pop);letter-spacing:.12em;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 0 0 #fff,3px 4px 0 var(--ink),0 0 18px #ffd23f;animation:tapBlink 1.1s ease-in-out infinite}
@keyframes tapBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.96)}}
.title .tv{z-index:4;color:#fff;text-shadow:var(--ol-xs)}

/* 11/05 审查 P2-12：战斗顶栏只留暂停，声音开关在暂停 → 设置里 */
#bMute{display:none!important}#bPause{right:10px!important}

/* 11/05 培养反馈：战力上涨 —— 顶栏战力闪一下放大，下面弹出「战力 +N」贴纸往上飘 */
.lord .pw.up{animation:pwUp .7s ease-out}
@keyframes pwUp{0%{transform:scale(1)}25%{transform:scale(1.25);color:#fff59a}100%{transform:scale(1)}}
.pwup{position:fixed;z-index:90;pointer-events:none;font:900 18px/1 var(--font-pop);color:#fff59a;padding:6px 12px;border-radius:12px;background:#231748;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),3px 4px 0 2px #00000080;text-shadow:var(--ol-xs);animation:pwFloat 1.4s ease-out forwards;transform:rotate(-4deg)}
@keyframes pwFloat{0%{opacity:0;translate:0 10px;scale:.6}15%{opacity:1;translate:0 0;scale:1.15}30%{scale:1}80%{opacity:1;translate:0 -14px}100%{opacity:0;translate:0 -24px}}

/* 11/05 SSR 专属必杀弹射：武将详情里单独一格，金色标签 */
.gd-skills .sk-t.ss{background:linear-gradient(180deg,var(--yel-1),var(--yel-3));color:var(--ink);text-shadow:none}
.gd-skills .ssk{box-shadow:0 0 0 2px var(--yel-1) inset}
/* 11/05 培养页面换新材质（制作人 3A 街头海报风）：各页的米白信息框换成撕边白纸（九宫格拉伸，撕边宽度不变），硬阴影改成纸片投影 */
.dp-card,.stage,.pstat,.power,.rates,.scard:not(.supr),.gstat,.sum-list,.gd-skills>div,.gd-quote,.gd-join,.bond,.sheet .sec,.empty:not(.wc),.gpred>div{
  background:none!important;border-style:solid!important;border-width:3px!important;border-color:transparent!important;border-image:url(assets/ui_label_w.webp) 30 fill / 13px / 5px stretch!important;box-shadow:none!important;filter:drop-shadow(3px 4px 0 #00000070);border-radius:0!important}   /* 注意不能用 border 简写：它会把 border-image 重置掉 */
.stage.big,.gd-skills .ssk{border-image-source:url(assets/ui_label_y.webp)!important}
.dp-card h4{display:inline-block;padding:3px 16px 4px;margin:-4px 0 8px -6px;background:url(assets/ui_tape_y.webp) center/100% 100% no-repeat;transform:rotate(-1.5deg)}

/* 11/05 培养反馈：出击按钮下面写「战力 / 推荐」，够了是绿、不够是红（不够时去培养） */
.questbtn{position:relative}
.questbtn .qpw{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%) rotate(-1.5deg);white-space:nowrap;font:900 11px/1 var(--font-pop);font-style:normal;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);color:#fff;text-shadow:var(--ol-xs);box-shadow:0 2px 0 var(--ink)}
.questbtn .qpw.ok{background:#1f9a45}.questbtn .qpw.low{background:#de2348}
/* 11/05 编成页照碧蓝幻想：队长大立绘面板 + 一排 MAIN MEMBER + 壁画兽条 */
.ph-set{display:flex;align-items:baseline;gap:10px;margin:2px 2px 8px}
.ph-set b{font:900 20px/1 var(--font-pop);color:var(--ink);padding:5px 18px 6px;background:url(assets/ui_tape_y.webp) center/100% 100% no-repeat;transform:rotate(-2deg)}
.ph-set small{font-size:11px;font-weight:800;color:#d9d0ff}
.phero{position:relative;display:grid;grid-template-columns:46% 1fr;width:100%;min-height:184px;padding:0;margin-bottom:10px;border-radius:18px;border:3px solid var(--ink);box-shadow:var(--stk);overflow:hidden;color:#fff;text-align:left;font:inherit;cursor:pointer;
  background:radial-gradient(120% 90% at 20% 30%,color-mix(in srgb,var(--ec) 55%,transparent),transparent 70%),var(--tex) 0 0/192px,linear-gradient(180deg,#2b1c66,#150c34)}
.ph-art{position:relative;overflow:hidden}
.ph-art img{position:absolute;left:50%;top:-6%;height:150%;width:auto;max-width:none;transform:translateX(calc(-1 * var(--ax) * 100%));filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 var(--ink))}
.ph-tag{position:absolute;left:8px;top:8px;font:900 12px/1 var(--font-pop);padding:5px 10px;color:var(--ink);background:url(assets/ui_tape_y.webp) center/100% 100% no-repeat;transform:rotate(-5deg)}
.ph-info{display:grid;align-content:center;gap:7px;padding:12px 12px 12px 4px}
.ph-name{display:flex;align-items:center;gap:5px}.ph-name b{font:900 20px/1 var(--font-pop);text-shadow:var(--ol-s)}.ph-name i{font-style:normal;font:900 12px/1 var(--font-pop);color:var(--yel-1)}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;border-radius:10px;background:#0b0620b0;border:2px solid var(--ink)}
.ph-row i{font-style:normal;font-size:11px;font-weight:900;color:#d9d0ff}.ph-row b{font:400 20px/1 "PopNum",var(--font-pop);font-variant-numeric:tabular-nums}
.ph-row.hp b{color:#7dffa0}.ph-row.pw b{color:#ffb02e}.ph-row.pel em{font-style:normal;font-weight:900;color:var(--yel-1)}.ph-row.pel em.off{color:#ff8a7a;font-size:11px}
.ph-sk{justify-self:end;font:900 12px/1 var(--font-pop);padding:6px 12px;border-radius:999px;background:linear-gradient(180deg,var(--blu-1),var(--blu-2));border:2px solid var(--ink);text-shadow:var(--ol-xs)}
.pmem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pm{position:relative;display:grid;padding:0;border-radius:12px;border:3px solid var(--ink);background:#160d33;box-shadow:0 0 0 2px #fff,3px 4px 0 2px #00000080;overflow:hidden;color:#fff;font:inherit;text-align:left;cursor:pointer}
.pm-pic{position:relative;display:block;height:108px;overflow:hidden;background:radial-gradient(90% 80% at 50% 30%,#ffffff30,transparent)}
.pm-pic img{position:absolute;left:50%;top:-4%;height:170%;width:auto;max-width:none;transform:translateX(calc(-1 * var(--ax) * 100%))}
.pm-pic .cc-rar{position:absolute;right:4px;top:4px}.pm-pic .el{position:absolute;left:4px;top:4px;width:20px;height:20px}
.pm-no{position:absolute;left:4px;bottom:4px;font:900 14px/1 "PopNum",var(--font-pop);font-style:normal;color:var(--ink);background:var(--yel-1);border:2px solid var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.pm-n{display:flex;justify-content:space-between;align-items:baseline;gap:2px;padding:4px 6px 0}.pm-n b{font:900 12.5px/1.1 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm-n i{font-style:normal;font-size:10px;font-weight:900;color:var(--yel-1)}
.pm-a{display:flex;justify-content:space-between;padding:2px 6px 5px}.pm-a i{font-style:normal;font-size:10px;color:#d9d0ff;font-weight:800}.pm-a b{font:400 14px/1 "PopNum",var(--font-pop);color:#ffb02e}
.pm.SSR-c{box-shadow:0 0 0 2px var(--yel-1),3px 4px 0 2px #00000080}.pm.SR-c{box-shadow:0 0 0 2px #f0b8ff,3px 4px 0 2px #00000080}
.pm.swapping,.phero.swapping{animation:bob 1s ease-in-out infinite}.pm.swapsel,.phero.swapsel{outline:3px solid var(--yel-1);outline-offset:2px}
.psum{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;margin:10px 0;padding:8px 12px 8px 8px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 0 0 2px #fff,3px 4px 0 2px #00000080;color:#fff;font:inherit;text-align:left;cursor:pointer;background:var(--tex) 0 0/192px,linear-gradient(90deg,#3a2a86,#1b1048)}
.psum-img{width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:#0b0620 center/cover}
.psum-t{display:grid;gap:2px}.psum-t i{font-style:normal;font-size:10px;font-weight:900;color:#d9d0ff}.psum-t b{font:900 16px/1.1 var(--font-pop)}.psum-t small{font-size:11px;font-weight:800;color:var(--yel-1)}
.psum em{font-style:normal;font-weight:900;color:var(--yel-1)}
@media (max-width:380px){.pm-pic{height:92px}.phero{min-height:166px}.ph-row b{font-size:17px}}
.ph-set b{white-space:nowrap}.ph-set small{min-width:0}
.ph-row i{white-space:nowrap}.ph-row.pel em.off{white-space:nowrap;font-size:10.5px}
@media (max-height:700px){.phero{min-height:132px}.ph-info{gap:4px;padding:8px 8px 8px 2px}.ph-row{padding:3px 8px}.ph-row b{font-size:16px}.ph-sk{display:none}.pm-pic{height:78px}.ph-set{margin-bottom:5px}.ph-set small{display:none}}
/* 11/05 突破用漆罐 */
.gd-can{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:7px 10px;border-radius:12px;background:#0b0620b0;border:2px solid var(--ink)}
.gd-can>span:not(.el){flex:1;font-weight:900;font-size:13px}.gd-can .el{flex:none}.gd-can b{font:400 18px/1 "PopNum",var(--font-pop)}.gd-can b.ok{color:#7dffa0}.gd-can b.low{color:#ff8a7a}
.rew .rcan{display:inline-flex;align-items:center;gap:4px}.rew .rcan .el{width:20px;height:20px;font-size:10px}
/* 11/05 登录奖励（7 天一轮） */
.login{margin:4px 0 12px;padding:10px;border-radius:14px;background:#0b0620b0;border:2px solid var(--ink)}
.lg-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.lg-h b{font-size:15px;font-weight:900;color:var(--yel-1)}.lg-h small{font-size:11px;color:#d9d0ff}
.lg-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.lgc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;border-radius:9px;background:#2a1c80;border:2px solid #4a3aa8;min-width:0}
.lgc small{font-size:9.5px;color:#d9d0ff;white-space:nowrap}.lgc b{font:400 12px/1 "PopNum",var(--font-pop);display:flex;align-items:center;gap:1px;white-space:nowrap}.lgc b .ico{width:12px;height:12px}
.lgc em{font-style:normal;font:400 9px/1 "PopNum",var(--font-pop);color:#ffd982;display:flex;align-items:center;white-space:nowrap}.lgc em .ico{width:10px;height:10px}
.lgc.big{background:linear-gradient(180deg,#ff3d8f,#a31a6a);border-color:#ffd23f}
.lgc.now{border-color:#ffd23f;box-shadow:0 0 0 2px #ffd23f80;transform:translateY(-2px)}
.lgc.got::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900;color:#7dffa0;background:#0b0620b8;border-radius:7px}
.login .btn{width:100%}.lg-done{text-align:center;font-size:12px;color:#d9d0ff;padding:6px 0}
/* 11/05 审查 P1-12：矮屏（360×640）详情页主按钮要在一屏内：立绘压低、底部按钮变薄 */
@media (max-height:700px){.dpg .gd-hero{height:124px}.dp-hero{height:124px}.dp-foot{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}.dp-foot .btn{min-height:40px}.dp-card>p{margin-bottom:6px}}
/* 11/05 制作人 1A（低调）：按钮、详情页顶栏 / 底栏、底部导航叠一层很淡的涂鸦剪影（ui_graf.webp：喷漆签名、皇冠、箭头、滴落）。
   远看只是有质感，凑近才认得出；按钮中间留干净给文字（mask 两侧浓、中间淡） */
:root{--graf:url(assets/ui_graf.webp);--grafw:url(assets/ui_graf_w.webp)}   /* grafw：白色、已经压到 8.5% 的版本，给深色底栏直接铺 */
.btn{isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:var(--graf) 0 0/150px 150px;opacity:.12;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#0006 35%,#0003 50%,#0006 65%,#000 100%);mask-image:linear-gradient(90deg,#000 0,#0006 35%,#0003 50%,#0006 65%,#000 100%)}
.btn.dk::before,.btn.blue::before,.btn.green::before{filter:invert(1);opacity:.1}
.btn.ghost::before{opacity:.07}
.btn:disabled::before{opacity:.05}
.dp-top,.dp-foot{background:var(--grafw) 30px 0/220px 220px,var(--tex) 0 0/192px,linear-gradient(180deg,#2b1c6c,#1c1150);background-blend-mode:normal,screen,normal}
.dp-top{position:relative}.dp-top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--ink)}
.tabs::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--grafw) 0 0/220px 220px;opacity:.8}
.dp-foot .tag.wide{position:relative;isolation:isolate;overflow:hidden}.dp-foot .tag.wide::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--graf) 0 0/150px 150px;opacity:.1}
/* 11/05 队伍编组条：1～10 号，主手属性小圆点；当前组黄框（参照碧蓝幻想编成组的翻页点） */
.psets{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 8px;padding:2px 2px 4px}.psets::-webkit-scrollbar{display:none}
.pset{position:relative;flex:1 0 32px;min-width:32px;height:36px;display:flex;align-items:center;justify-content:center;gap:1px;border-radius:10px;border:2.5px solid var(--ink);background:#2a1c80;color:#fff;box-shadow:0 3px 0 var(--ink);font:400 15px/1 "PopNum",var(--font-pop);padding:0}
.pset b{font-weight:400;text-shadow:var(--ol-xs)}.pset .el.orb{position:absolute;right:-4px;bottom:-5px;width:15px;height:15px;font-size:0;border-width:1.5px}
.pset.blank{background:#1a1150;color:#8f86c4;border-style:dashed}
.pset.on{background:linear-gradient(180deg,#fff59a,#ffb02e);color:#231748;transform:translateY(-2px)}.pset.on b{text-shadow:none}
.pset:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sup-set{margin:0 0 8px}.sup-set>i{display:block;font-style:normal;font-size:11px;font-weight:900;color:#d9d0ff;margin:0 0 4px 2px}
@media (max-height:700px){.pset{height:30px;font-size:13px}.psets{margin-bottom:5px}}
@media (max-height:700px){.phero{min-height:118px}.pm-pic{height:64px}.ph-set{margin-bottom:3px}}
/* 11/05 制作人：升级时整页闪 → 同一页刷新不播进场动画；变了的数字跳一下、飘「+多少」 */
.sheet.again,.sheet.again .dp-hero *,.sheet.again .gd-hero *,.sheet.again .dp-burst{animation:none!important}
.dp-stats>div{position:relative}
.dp-stats>div.up{animation:stUp .6s ease-out}.dp-stats>div.up b{color:#7dffa0!important}
@keyframes stUp{0%{transform:scale(1)}25%{transform:scale(1.12)}100%{transform:scale(1)}}
.st-up{position:absolute;right:6px;top:-6px;font-style:normal;font:900 15px/1 var(--font-pop);color:#7dffa0;text-shadow:var(--ol-xs);pointer-events:none;animation:gainUp 1.1s ease-out forwards}
/* 11/05 进战斗的加载画面 */
.loadsc{position:absolute;inset:0;z-index:80;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;animation:lsIn .18s ease-out}
.loadsc.out{opacity:0;transition:opacity .3s}
.ls-bg{position:absolute;inset:0;background:url(assets/title_bg.webp) center/cover;filter:saturate(1.1)}
.ls-bg::before{content:"";position:absolute;inset:0;background:var(--graf) 0 0/260px 260px;opacity:.16}.ls-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#231748e6 88%)}
.ls-art{position:absolute;left:50%;bottom:128px;height:60%;transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(0 0 0 #fff) drop-shadow(6px 8px 0 #00000080);animation:lsArt .5s cubic-bezier(.2,.9,.3,1.2) both}
.ls-txt{position:relative;margin:0 auto 10px;font:400 44px/1 var(--font-logo);color:#fff59a;letter-spacing:.06em;text-shadow:var(--ol),5px 5px 0 #ff3d8f;transform:rotate(-4deg)}
.ls-txt i{font-style:normal;display:inline-block;animation:lsDot 1s infinite}.ls-txt i:nth-child(2){animation-delay:.15s}.ls-txt i:nth-child(3){animation-delay:.3s}
.ls-tip{position:relative;margin:0 16px calc(28px + env(safe-area-inset-bottom,0px));padding:10px 14px;border-radius:14px;background:#231748e6;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);color:#fff;font-size:13px;font-weight:800;line-height:1.5}
.ls-tip b{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:6px;background:#ffd23f;color:#231748;font:400 12px/1.4 var(--font-pop)}
@keyframes lsIn{from{opacity:0}}@keyframes lsArt{from{transform:translateX(-30%) rotate(-3deg);opacity:0}}@keyframes lsDot{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
/* 11/05 制作人：详情页分页签要一眼看出能切 → 按钮块 + 图标，当前页黄色凸起、下面小箭头 */
.dp-tabs{gap:6px;padding:7px 8px 9px;background:var(--grafw) 0 0/220px,#231748}
.dp-tabs button{display:flex;align-items:center;justify-content:center;gap:3px;min-height:44px;border:2.5px solid var(--ink);border-radius:12px;background:linear-gradient(180deg,#4b3a9c,#2e2170);box-shadow:inset 0 2px 0 #ffffff26,0 3px 0 var(--ink);color:#e6defc;font-size:15px;padding:0 4px}
.dp-tabs button .uic{width:26px;height:26px;flex:none;margin:-4px 0 -4px -2px}
.dp-tabs button span{white-space:nowrap}
.dp-tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.dp-tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#fff59a,#ffc22e 60%,#f29a12);color:#231748;text-shadow:none;transform:translateY(-2px);box-shadow:inset 0 2px 0 #fff8,0 5px 0 var(--ink)}
.dp-tabs button[aria-pressed="true"]::after{left:50%;right:auto;bottom:-12px;width:0;height:0;border-radius:0;background:none;border:7px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
/* 底部的状态条（已出战 / 当前主手）：不是按钮 → 凹进去的深色牌子 + 勾，和旁边能按的立体按钮分开层级 */
.dp-state{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:14px;background:#120a33;border:2.5px solid #4a3aa8;box-shadow:inset 0 3px 6px #00000080;color:#ffd982;font:900 14px/1.2 var(--font-pop);padding:0 10px;text-align:center}
.dp-state i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#7dffa0;color:#0b3b1c;font-size:13px;flex:none}
.dp-state.wide{grid-column:1/-1}
@media (max-height:700px){.dp-tabs button{min-height:38px;font-size:13px}.dp-tabs button .uic{width:22px;height:22px}}
.fbbox p{margin:0 0 8px;font-size:13px;font-weight:800;line-height:1.55;color:#e6defc}
.fbbox textarea{width:100%;min-height:120px;box-sizing:border-box;border-radius:12px;border:3px solid var(--ink);padding:10px;font:700 14px/1.5 var(--font-ui,inherit);color:var(--text);background:#fff;resize:vertical}
.fb-sent{display:block;margin-top:6px;color:#7dffa0;font-weight:900}
.pnl-h b{white-space:nowrap}
.sb .dot,.promo .dot{z-index:6;width:15px;height:15px;top:4px;right:2px}   /* 11/05 审查 P1-8：小红点被图标盖住了 */
.gc .front .gwep{top:auto;bottom:34px;left:3px;right:3px;text-align:center}   /* 11/05 审查 P1-4：「+专属武器」以前压在脸上 */

:root{--ssrgraf:url(assets/card_ssr_graf.webp)}

.mc.SSR-c:nth-child(3n+1){--gp:10% 15%}.mc.SSR-c:nth-child(3n+2){--gp:70% 55%}.mc.SSR-c:nth-child(3n){--gp:35% 85%}

/* 编成页队员卡（.pm）和扭蛋结果卡（.gc）也用同一套「有厚度的稀有度框」，和涂鸦手小卡统一（11/06） */
.pm{--fr1:#cfe9ff;--fr2:#3d8fd6;--edge:#1d5a9a;padding:3px;border-width:2.5px;background:linear-gradient(160deg,var(--fr1),var(--fr2) 45%,var(--edge));

/* 散花一投 · 公共组件 v2「街头贴纸」（11/07 制作人选：风格 A 街头贴纸 + 装备卡借 B 的底部黑条；页签 = 胶带；消耗 = 能量槽）
   视觉语言：斜切角（不用圆角）、硬投影（实色错位，不用柔光）、胶带标签、斜纹 / 网点底纹。只用 tokens.css 里的变量 */
:root{
  --ink2:#120a30;                                   /* 最深的墨色：硬投影、黑条 */
  --tape-y:repeating-linear-gradient(-45deg,#ffe066 0 12px,#ffd21a 12px 24px);
  --stripe:repeating-linear-gradient(135deg,#ffffff26 0 3px,transparent 3px 8px);
  --dots:radial-gradient(#ffffff14 1px,transparent 1.6px) 0 0/8px 8px;
  /* 胶带锯齿边 */
  --tape-cut:polygon(2% 10%,6% 0,14% 7%,24% 0,36% 6%,50% 0,64% 6%,76% 0,88% 6%,96% 0,100% 12%,100% 90%,96% 100%,86% 94%,72% 100%,58% 94%,44% 100%,30% 94%,16% 100%,6% 95%,0 88%);
}
.k-cut{--cp:12px;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}

/* ───────── 物品卡：斜切贴纸板 + 品级色斜纹 + 底部黑条（品级 / 等级）───────── */
.k-card{--w:84px;--cp:14px;--b:3px;position:relative;display:block;flex:none;width:var(--w);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;container-type:inline-size;--sh:3px}
.k-card.tall{aspect-ratio:4/5}
.k-card.k-s{--w:64px;--cp:10px}.k-card.k-l{--w:150px;--cp:22px;--b:4px;--sh:5px}
.k-card.fill{width:100%;--w:auto}
.k-mat,.k-mat::after,.k-win{clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-mat{position:absolute;inset:0;background:var(--ink2)}
.k-mat::after{content:"";position:absolute;inset:var(--b);background:var(--stripe),var(--rg)}
.k-card.r-N{--rg:linear-gradient(135deg,#e2e5ec,#8b92a5)}.k-card.r-R{--rg:linear-gradient(135deg,#a6f0ff,#1f8ae8)}.k-card.r-SR{--rg:linear-gradient(135deg,#e2b8ff,#7a3ad6)}
.k-card.r-SSR{--rg:conic-gradient(from var(--ha,200deg) at 40% 40%,#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8)}
@property --ha{syntax:"<angle>";inherits:true;initial-value:200deg}
.k-card.r-SSR .k-mat::after{animation:kHolo 4s linear infinite}
@keyframes kHolo{to{--ha:560deg}}
.k-win{position:absolute;left:calc(var(--b) + 7%);right:calc(var(--b) + 7%);top:calc(var(--b) + 7%);bottom:24%;background:radial-gradient(circle at 50% 45%,#ffffff66,transparent 70%),var(--dots),#ffffff14;box-shadow:inset 0 0 0 2px #120a3055;clip-path:none}
.k-card .k-img{position:absolute;inset:6%;background-repeat:no-repeat;filter:drop-shadow(0 3px 0 #120a3099)}
.k-card.k-gen .k-img,.k-card.k-sum .k-img{inset:0;background-size:cover;filter:none}

.k-strip{position:absolute;z-index:2;left:var(--b);right:var(--b);bottom:var(--b);height:21%;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 5% 0 calc(var(--cp) * .7);background:var(--ink2);clip-path:polygon(0 0,100% 0,100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-card .k-rar{height:82%;width:auto;margin-left:-6%;filter:none}
.k-card .k-lv{margin-left:auto;font:400 calc(var(--w,84px) * .19)/1 var(--font-num);color:#ffe066;letter-spacing:.02em;white-space:nowrap}
.k-card.fill .k-lv{font-size:var(--fs-3)}.k-card.k-l .k-lv{font-size:26px}
.k-card .k-lv i{font:900 10px/1 var(--font-pop);font-style:normal;margin-right:1px;color:#fff}
.k-card .k-el{position:absolute;z-index:3;left:-3px;top:-3px;width:calc(var(--cp) * 1.6);height:calc(var(--cp) * 1.6);min-width:18px;min-height:18px;font-size:0;filter:drop-shadow(2px 2px 0 var(--ink2))}
.k-card .k-st{position:absolute;z-index:3;right:calc(var(--b) + 4%);bottom:26%;display:flex;gap:1px}
.k-card .k-st i{width:11px;height:11px;background:#ffe066;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 78%,20% 100%,30% 60%,0 38%,38% 35%);filter:drop-shadow(0 0 1px var(--ink2))}
.k-card .k-tag{position:absolute;z-index:4;right:-6px;top:-7px;padding:2px 8px;font:900 var(--fs-1)/1.15 var(--font-pop);font-style:normal;color:var(--ink2);white-space:nowrap;transform:rotate(7deg);clip-path:var(--tape-cut);background:var(--tc)}
.k-tag.t-new{--tc:#ff7aa8}.k-tag.t-eq{--tc:#7fe6ff}.k-tag.t-team{--tc:#9dff6b}.k-tag.t-up{--tc:#ffe066}
.k-card .k-name{position:absolute;z-index:2;left:0;right:0;bottom:-20px;font:900 var(--fs-1)/1.2 var(--font-pop);color:#fff;text-align:center;text-shadow:var(--ol-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-card.named{margin-bottom:20px}
.k-card.on .k-mat{background:#ffe066}
.k-card.off .k-img{filter:grayscale(1) brightness(.4)}
.k-card:active{transform:translate(2px,2px)}.k-card:active::before{transform:translate(1px,1px)}
.k-grid{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:var(--sp-2);justify-items:center}
.k-grid>.k-card{width:100%}
/* 卡被挤窄（小卡 / 小屏格子）：黑条里只放等级，品级看板子颜色 */
@container (max-width:76px){.k-rar{display:none}.k-lv{font-size:var(--fs-2) !important}.k-st i{width:9px;height:9px}}

/* ───────── 按钮：斜切贴纸 + 硬投影；主 = 黄、次 = 黑底白边、蓝 = 去别处、红 = 危险 ───────── */
.k-btn{--cp:12px;--bg:#ffe066;--fg:var(--ink2);--ol:var(--ink2);position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);min-width:var(--hit);border:0;padding:0 var(--sp-4);background:none;color:var(--fg);font:900 var(--fs-4)/1.1 var(--font-pop);cursor:pointer;filter:drop-shadow(4px 4px 0 var(--ink2))}
.k-btn::before,.k-btn::after{content:"";position:absolute;z-index:-1;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-btn::before{inset:0;background:var(--ol)}
.k-btn::after{inset:3px;background:linear-gradient(105deg,transparent 0 12%,#ffffff40 12% 16%,transparent 16%),var(--bg)}
.k-btn>span{display:grid;justify-items:center}
.k-btn small{font:800 var(--fs-1)/1.2 var(--font-pop);opacity:.85}
.k-btn.l{min-height:var(--btn-l)}.k-btn.m{min-height:var(--btn-m);font-size:var(--fs-3)}.k-btn.s{--cp:8px;min-height:var(--btn-s);font-size:var(--fs-2);padding:0 var(--sp-3);filter:drop-shadow(3px 3px 0 var(--ink2))}
.k-btn.s>span::before{content:"";position:absolute;inset:-6px -2px}
.k-btn.main{--bg:#ffe066}
.k-btn.sub{--bg:var(--ink2);--fg:#fff;--ol:#fff}
.k-btn.blue{--bg:#5fd4ff}
.k-btn.danger{--bg:#ff4d6a;--fg:#fff}
.k-btn .uic{width:1.5em;height:1.5em;margin:-.3em 0}
.k-btn:active{transform:translate(3px,3px);filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-btn:disabled{--bg:repeating-linear-gradient(-45deg,#8e88a8 0 6px,#a49fbb 6px 12px);--fg:#3b3654;cursor:default}
.k-btn.wide{width:100%}
.k-btns{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:var(--sp-3)}

/* ───────── 页签：一级 = 胶带（选中 = 黄色斜纹警示胶带、歪贴、粉色错位影）；二级 = 图标 + 选中的字贴一截胶带 ───────── */
.k-seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--sp-1);padding:var(--sp-2) var(--sp-1);background:var(--dots),var(--ink2)}
.k-seg button{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);min-height:var(--hit);border:0;background:#9d90c8;color:var(--ink2);opacity:.78;font:900 var(--fs-3)/1 var(--font-pop);clip-path:var(--tape-cut);transform:rotate(1.2deg)}
.k-seg button:nth-child(odd){transform:rotate(-1.4deg)}
.k-seg button .uic{width:28px;height:28px;margin:-4px 0;filter:grayscale(.5)}
.k-seg button[aria-pressed=true]{position:relative;z-index:2;opacity:1;background:var(--tape-y);font-size:var(--fs-4);transform:rotate(-3deg) scale(1.08);filter:drop-shadow(3px 3px 0 #ff3d8f)}
.k-seg button[aria-pressed=true] .uic{filter:none}
.k-tabs{display:grid;grid-template-columns:repeat(var(--n),1fr);padding:var(--sp-1) 0 var(--sp-2);background:var(--dots),var(--ink2);border-bottom:var(--bd-2) solid #000}
.k-tabs button{display:grid;justify-items:center;gap:2px;min-height:52px;padding:var(--sp-1) 0;border:0;background:none;color:#8f84c8;font:900 var(--fs-2)/1 var(--font-pop)}
.k-tabs button .uic{width:28px;height:28px;filter:grayscale(.7) brightness(.75)}
.k-tabs button span{padding:3px 6px;white-space:nowrap}
.k-tabs button[aria-pressed=true]{color:var(--ink2)}
.k-tabs button[aria-pressed=true] .uic{filter:none;transform:rotate(-6deg) scale(1.12)}
.k-tabs button[aria-pressed=true] span{background:var(--tape-y);clip-path:var(--tape-cut);transform:rotate(-3deg)}
.k-tabs button.lk{opacity:.45}

/* ───────── 区块：纸片 + 硬投影 + 胶带标题（压在上边缘）───────── */
.k-sec{position:relative;margin:var(--sp-4) 0 var(--sp-4);padding:var(--sp-5) var(--sp-3) var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.k-sec::after{content:"";position:absolute;right:-3px;top:-3px;width:16px;height:16px;background:linear-gradient(225deg,#1d1140 0 50%,#d9d0ff 50%);border-left:var(--bd-1) solid var(--ink2);border-bottom:var(--bd-1) solid var(--ink2)}
.k-h{position:absolute;left:10px;top:-15px;display:flex;align-items:center;gap:var(--sp-2);margin:0;padding:4px 16px;background:#8dffbe;color:var(--ink2);font:900 var(--fs-3)/1.2 var(--font-pop);clip-path:var(--tape-cut);transform:rotate(-2.5deg)}
.k-h{white-space:nowrap;max-width:calc(100% - 20px)}
.k-hr{position:absolute;right:var(--sp-3);top:6px;font:800 var(--fs-1)/1.3 var(--font-pop);color:#6a5ca8;max-width:45%;text-align:right}
.k-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-3);background:#f1ecff;font:800 var(--fs-2)/1.2 var(--font-pop);clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}
.k-row+.k-row{margin-top:var(--sp-1)}
.k-row>span{display:flex;align-items:center;gap:var(--sp-1);color:#4a3d8c}
.k-row>span .uic{width:22px;height:22px}
.k-row b{display:flex;align-items:center;gap:var(--sp-1);font:400 var(--fs-3)/1 var(--font-num)}
.k-row em{font-style:normal;color:#e0322a}
.k-arr{width:0;height:0;border:6px solid transparent;border-left:8px solid #8a7fb3;border-right:0}

/* ───────── 能量槽：消耗（六边形图标徽章 + 胶带标签 + 持有 / 需要 + 斜切分段槽「够升几次」）───────── */
.k-cost{position:relative;display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-3);align-items:center;padding:var(--sp-3);background:var(--dots),var(--ink2);color:#fff;box-shadow:4px 4px 0 #ff3d8f;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.k-hex{grid-row:span 2;display:grid;place-items:center;width:58px;height:58px;background:linear-gradient(135deg,#ffe066,#ff9a1f);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.k-hex .uic,.k-hex .ico{width:40px;height:40px}
.k-hex .ico.coin{background-size:360px 40px;background-position:-200px 0}
.k-ctop{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.k-ctop em{font:900 var(--fs-1)/1 var(--font-pop);font-style:normal;padding:3px 10px;background:#fffdf7;color:var(--ink2);transform:rotate(-2deg);white-space:nowrap}
.k-ctop b{margin-left:auto;font:400 var(--fs-4)/1 var(--font-num);color:#7dffb0;white-space:nowrap}
.k-ctop b i{font-style:normal;font-size:var(--fs-2);color:#8f84c8}
.k-gauge{position:relative;display:grid;grid-template-columns:repeat(5,1fr) auto;gap:3px;align-items:center;height:16px;transform:skewX(-20deg)}
.k-gauge i{background:#2b1c6c;border:1px solid #000}.k-gauge i.on{background:#01fd99}.k-gauge i.part{background:linear-gradient(90deg,#ffda17 var(--p),#2b1c6c var(--p))}
.k-gauge i{height:16px}
.k-gauge b{min-width:2.6em;margin-left:6px;transform:skewX(20deg);font:400 var(--fs-3)/1 var(--font-num);color:#ffe066;text-align:right}
.k-cost.low .k-ctop b{color:#ff6b6b}.k-cost.low{box-shadow:4px 4px 0 #ff4d6a}

/* ───────── 等级条：斜切分段（SUMO 式）───────── */
.k-lvbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--sp-1) var(--sp-3)}
.k-lvbar>div{position:relative;height:18px;background:#2b1c6c;border:var(--bd-1) solid var(--ink2);transform:skewX(-20deg);overflow:hidden}
.k-lvbar>div i{display:block;height:100%;background:repeating-linear-gradient(90deg,#5fd4ff 0 10px,#3ab8ef 10px 12px)}
.k-lvbar>div::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--ink2) calc(10% - 2px) 10%)}
.k-lvbar span{padding:2px 8px;background:var(--ink2);color:#fff;font:800 var(--fs-2)/1 var(--font-pop);transform:skewX(-10deg)}
.k-lvbar span b{font:400 var(--fs-3)/1 var(--font-num);color:#ffe066}
.k-lvbar small{grid-column:1/-1;font:800 var(--fs-1)/1.4 var(--font-pop);color:#6a5ca8}

/* ───────── 小标签：斜贴纸 ───────── */
.k-chip{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:28px;padding:0 var(--sp-2);border:var(--bd-1) solid var(--ink2);background:#fff;color:var(--ink2);font:900 var(--fs-1)/1 var(--font-pop);transform:skewX(-10deg);box-shadow:2px 2px 0 var(--ink2)}
.k-chip>*{transform:skewX(10deg)}
.k-chip .uic{width:18px;height:18px}.k-chip .el{width:18px;height:18px;font-size:0}
.k-chip.hot{background:#ffe066}.k-chip.dark{background:var(--ink2);color:#fff;border-color:#fff}
.k-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

/* ───────── 列表头 ───────── */
.k-lhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;background:linear-gradient(180deg,#1d1140 70%,#1d114000)}
.k-lhead h3{margin:0;display:flex;align-items:center;gap:var(--sp-2);font:900 var(--fs-4)/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.k-lhead h3 small{padding:2px 8px;background:#fffdf7;color:var(--ink2);font:400 var(--fs-2)/1.2 var(--font-num);text-shadow:none;clip-path:var(--tape-cut);transform:rotate(-3deg)}
.k-lbtns{margin-left:auto;display:flex;gap:var(--sp-3)}
.k-elbar{display:flex;gap:var(--sp-2);margin:var(--sp-1) 0 var(--sp-3)}
.k-elbar button{display:grid;place-items:center;width:50px;height:46px;padding:0;border:0;background:#2b1c6c;color:#cfc4ff;font:900 var(--fs-2)/1 var(--font-pop);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.k-elbar button .el{width:30px;height:30px}
.k-elbar button[aria-pressed=true]{background:#ffe066;color:var(--ink2)}
.k-elbar button[aria-pressed=false] .el{filter:saturate(.5) brightness(.8)}

/* ───────── 一级页标题 ───────── */
.k-ptitle{display:flex;align-items:flex-end;gap:var(--sp-2);margin:var(--sp-2) 0 var(--sp-3)}
.k-ptitle h2{margin:0;font:400 var(--fs-5)/1 var(--font-logo);color:#fff59a;letter-spacing:.04em;text-shadow:var(--ol),4px 4px 0 #ff3d8f;transform:rotate(-2deg)}
.k-ptitle small{font:800 var(--fs-2)/1.2 var(--font-pop);color:#cfc4ff}
.k-ptitle>button{margin-left:auto}

/* ───────── 二级页 / 三级抽屉 ───────── */
.k-p2{position:absolute;inset:0;z-index:var(--z-page2);display:flex;flex-direction:column;background:#1d1140;animation:kIn var(--t-mid) ease-out}
@keyframes kIn{from{transform:translateX(30%);opacity:0}}
.k-p2h{flex:none;display:flex;align-items:center;gap:var(--sp-2);height:64px;padding:0 var(--sp-2);background:var(--dots),var(--ink2);border-bottom:var(--bd-2) solid #000}

@keyframes kUp{from{transform:translateY(40%)}}
.k-p3h{flex:none;display:flex;align-items:center;height:60px;padding:0 var(--sp-5) 0 var(--sp-4);background:var(--tape-y);border-bottom:var(--bd-2) solid var(--ink2)}
.k-p3h b{flex:1;font:900 var(--fs-4)/1 var(--font-pop)}
.k-x{position:relative;width:var(--hit);height:var(--hit);border:var(--bd-2) solid var(--ink2);background:#fff;box-shadow:3px 3px 0 var(--ink2);clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
.k-x::before,.k-x::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:5px;margin:-2.5px 0 0 -11px;background:var(--ink2);transform:rotate(45deg)}.k-x::after{transform:rotate(-45deg)}

/* ───────── 弹窗：方纸片 + 硬投影；标题 = 黑底黄字斜条（奖励 = 黄色警示胶带）───────── */
.k-pop{position:absolute;inset:0;z-index:var(--z-pop);display:grid;place-items:center;padding:var(--sp-5) var(--sp-4);background:var(--dim);animation:fade var(--t-fast) ease-out}
.k-popc{position:relative;width:min(100%,340px);max-height:80%;display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-4) var(--sp-4);border:var(--bd-3) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:7px 7px 0 var(--ink2);animation:kPop .26s cubic-bezier(.3,1.5,.5,1)}
@keyframes kPop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.k-popc h3{align-self:flex-start;margin:calc(-1 * var(--sp-5) - 14px) 0 var(--sp-3) -8px;padding:6px 16px;background:var(--ink2);color:#ffe066;font:900 var(--fs-4)/1.2 var(--font-pop);transform:skewX(-10deg) rotate(-2deg)}
.k-popb{min-height:0;overflow:auto;font:700 var(--fs-2)/var(--lh-body) var(--font-pop);color:#3b2f73}
.k-popf{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-3);margin-top:var(--sp-4)}
.k-pop.reward .k-popc{background:var(--stripe),#fff7c9}
.k-ribbon{position:absolute;left:50%;top:-24px;padding:8px 30px;background:var(--tape-y);font:400 var(--fs-4)/1 var(--font-logo);color:var(--ink2);white-space:nowrap;clip-path:var(--tape-cut);transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(3px 3px 0 #ff3d8f)}
.k-pop.reward .k-popb .k-grid{margin-top:var(--sp-3)}

/* ───────── 过场：斜切快门 + logo 盖章（11/07 制作人选，替换三道彩条）───────── */
.wipe{position:absolute;inset:0;z-index:95;overflow:hidden;pointer-events:auto}
.wipe .wa,.wipe .wb{position:absolute;inset:0;transition:transform .3s cubic-bezier(.7,0,.3,1)}
.wipe .wa{background:var(--dots),var(--ink2);clip-path:polygon(0 0,72% 0,38% 100%,0 100%);transform:translate(-75%,-30%)}
.wipe .wb{background:radial-gradient(#120a3022 1.5px,transparent 2px) 0 0/9px 9px,#ffe066;clip-path:polygon(72% 0,100% 0,100% 100%,38% 100%);transform:translate(75%,30%)}
.wipe .ws{position:absolute;left:50%;top:-10%;width:22px;height:120%;margin-left:-11px;background:#ff3d8f;transform:rotate(19deg) scaleY(0);transition:transform .18s .22s ease-out;box-shadow:0 0 0 4px var(--ink2)}
.wipe .wl{position:absolute;left:50%;top:50%;width:min(78%,420px);transform:translate(-50%,-50%) rotate(-6deg) scale(2.2);opacity:0;transition:transform .22s .26s cubic-bezier(.3,1.6,.5,1),opacity .1s .26s;filter:drop-shadow(5px 5px 0 var(--ink2))}
.wipe.in .wa,.wipe.in .wb{transform:none}
.wipe.in .ws{transform:rotate(19deg) scaleY(1)}
.wipe.in .wl{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
.wipe.out .wa{transform:translate(-80%,0);transition-duration:.32s}
.wipe.out .wb{transform:translate(80%,0);transition-duration:.32s}
.wipe.out .ws,.wipe.out .wl{opacity:0;transition:opacity .12s}

/* ───────── UI 规范样张专用（views/uikit.js）───────── */

.k-card::before{content:"";position:absolute;inset:0;transform:translate(var(--sh),var(--sh));background:var(--ink2);clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-card.k-empty::before{display:none}

.k-lc{position:relative;display:grid;grid-template-rows:auto auto;min-width:0;padding:0;border:0;background:var(--ink2);color:#fff;text-align:left;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);box-shadow:inset 0 0 0 2px var(--ink2)}

.k-p3 .k-elbar button[aria-pressed=true]{background:#ffe066}.k-p3 .k-elbar button span{color:var(--ink2)}.k-p3 .k-fl{display:none}.k-p3 .k-elbar{flex-wrap:wrap}

/* ───────── 11/07 卡片改版样图（ki = 方图标、kt = 编成竖卡）───────── */
.kc-sw{display:flex;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.kc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-2) 6px}
.kc{display:grid;gap:2px;min-width:0}
.ki,.kt-card{position:relative;display:block;aspect-ratio:1;--rc1:#c9cfdb;--rc2:#6d7488}
.kt-card{aspect-ratio:3/5}
.r-R{--rc1:#a6f0ff;--rc2:#1f8ae8}.r-SR{--rc1:#e2b8ff;--rc2:#7a3ad6}.r-SSR{--rc1:#ffe066;--rc2:#ff5fb8}
.ki-img{position:absolute;inset:0;background-repeat:no-repeat;background-color:#2b1c6c}
.ki .ki-img[style*=weapons]{inset:10%;background-color:transparent}
.ki{background:radial-gradient(circle at 50% 45%,var(--rc1),var(--rc2) 90%)}
.ki.off .ki-img{filter:grayscale(1) brightness(.4)}
.ki-fr{position:absolute;inset:0;pointer-events:none}
/* 边框 1：贴纸边（品级色粗边 + 白色贴纸外圈 + 硬投影） */
.f1 .ki-fr,.f1.ki .ki-fr{box-shadow:inset 0 0 0 3px var(--rc2),inset 0 0 0 5px #120a30}
.f1.ki,.f1 .kt-card{outline:2px solid #fff;outline-offset:0;box-shadow:3px 3px 0 3px #120a30}
.r-SSR.f1 .ki-fr,.f1 .r-SSR .ki-fr{box-shadow:inset 0 0 0 3px #ffe066,inset 0 0 0 5px #120a30}
/* 边框 2：金属边（品级色渐变粗框，SSR 镭射，内侧墨线，四角小铆钉） */
.f2 .ki-fr,.f2.ki .ki-fr{border:4px solid transparent;border-image:linear-gradient(135deg,#fff 0%,var(--rc1) 25%,var(--rc2) 60%,#fff 80%,var(--rc2)) 1;box-shadow:inset 0 0 0 2px #120a30}
.r-SSR.f2 .ki-fr,.f2 .r-SSR .ki-fr{border-image:conic-gradient(from 30deg,#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8) 1}
.f2.ki,.f2 .kt-card{box-shadow:0 0 0 2px #120a30,3px 3px 0 2px #000}
.f2 .ki-fr::before,.f2 .ki-fr::after{content:"";position:absolute;width:5px;height:5px;background:#fff;box-shadow:0 0 0 1px #120a30;top:-2px;left:-2px}.f2 .ki-fr::after{left:auto;right:-2px;top:auto;bottom:-2px}
.ki-rar{position:absolute;right:2px;top:2px;z-index:2;height:22%;width:auto;filter:drop-shadow(1px 1px 0 #120a30)}
.kt-card .ki-rar{height:9%}
.ki-el{position:absolute !important;left:2px;bottom:2px;z-index:2;width:30% !important;height:auto !important;aspect-ratio:1;font-size:0 !important}
.kt-card .ki-el{width:22% !important}
.ki-plus{position:absolute;right:3px;bottom:2px;z-index:2;font:400 13px/1 var(--font-num);color:#ffe066;-webkit-text-stroke:2.5px #120a30;paint-order:stroke fill}
.ki-team{position:absolute;left:0;top:0;z-index:3;padding:1px 6px 1px 3px;font:900 10px/1.35 var(--font-pop);font-style:normal;color:#fff;background:#e0322a;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.ki-cap{display:flex;gap:3px;align-items:baseline;justify-content:center;min-width:0;font:900 var(--fs-1)/1.25 var(--font-pop);color:var(--ink2);white-space:nowrap;overflow:hidden}
.ki-cap em{font:400 11px/1 var(--font-num);font-style:normal;color:#e0322a}
.uk-dark .ki-cap{color:#fff}
.kt-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kt{display:grid;gap:3px;min-width:0}
.kt-role{display:flex;align-items:center;justify-content:center;gap:2px;height:22px;font:900 11px/1 var(--font-pop);color:#fff;background:var(--rc);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);text-shadow:0 1px 0 #0006}
.kt-ri{width:16px;height:16px}
.kt-row{display:flex;align-items:center;justify-content:space-between;gap:2px;height:22px;padding:0 5px;background:#120a30;font:900 11px/1 var(--font-pop);color:#fff}
.kt-row em{font:400 11px/1 var(--font-num);font-style:normal;color:#cfc4ff}.kt-row b{font:400 13px/1 var(--font-num);white-space:nowrap;overflow:hidden}
.kt-row.nm b{font:900 11px/1 var(--font-pop)}
.kt-row.hp i{color:#7dffb0;font-style:normal}.kt-row.hp b{color:#7dffb0}.kt-row.atk i{color:#ffb15f;font-style:normal}.kt-row.atk b{color:#ffb15f}
.kt-sk{display:flex;align-items:center;justify-content:space-between;gap:3px;height:24px;padding:0 6px;background:#5fd4ff;color:#120a30;font:400 11px/1 var(--font-logo);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%)}
.kt-sk b{font:900 10px/1 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ki-cap{display:block;text-align:center;text-overflow:ellipsis}.ki-cap em{margin-right:2px}
/* 边框 3「漫画格」（11/07 制作人参考《我的英雄学院》卡面）：粗黑框 + 右上斜切缺角（黄黑锯齿）、网点底、黑色硬投影；顶部黑条写出场顺序，底部黑条写等级 / 战力；队伍组用粉色网点框 + 笔刷字 */
.kt-no,.kt-lv{display:none}
.f3 .ki-fr,.f3.ki .ki-fr{box-shadow:inset 0 0 0 4px #120a30}
.f3.ki{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);background:radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,radial-gradient(circle at 50% 45%,var(--rc1),var(--rc2) 90%)}
.f3.ki::after{content:"";position:absolute;right:0;top:0;width:15px;height:15px;background:repeating-linear-gradient(-45deg,#ffe066 0 3px,#120a30 3px 6px);clip-path:polygon(0 0,100% 100%,100% 0)}
.f3.ki{filter:drop-shadow(3px 3px 0 #000)}
.f3 .ki-rar{right:auto;left:3px;top:3px;height:22%}
.f3 .ki-team{left:auto;right:0;top:auto;bottom:0;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%);padding:1px 3px 1px 7px}
.kt.f3{gap:0;filter:drop-shadow(4px 4px 0 #000)}
.f3 .kt-card{aspect-ratio:3/4.2;border:5px solid #120a30;border-top-width:18px;background:radial-gradient(#ffffff40 1.2px,transparent 1.8px) 0 0/6px 6px,linear-gradient(160deg,var(--rc1),var(--rc2));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 14px,100% 100%,0 100%);outline:0;box-shadow:none}
.f3 .kt-card::before{content:"";position:absolute;left:30%;right:22px;top:-18px;height:18px;background:repeating-linear-gradient(-60deg,#120a30 0 4px,#ffffff30 4px 6px)}
.f3 .kt-no{display:block;position:absolute;right:16px;top:-17px;z-index:3;font:400 13px/1 var(--font-num);font-style:italic;color:#fff}
.f3 .kt-lv{display:block;position:absolute;right:3px;bottom:2px;z-index:3;font:400 14px/1 var(--font-num);color:#ffe066;-webkit-text-stroke:3px #120a30;paint-order:stroke fill}
.f3 .kt-card .ki-rar{right:auto;left:2px;top:2px;height:10%}
.f3 .kt-card .ki-fr{box-shadow:none}
.f3 .kt-role{clip-path:none;height:20px;border-left:5px solid #120a30;border-right:5px solid #120a30}
.f3 .kt-row{height:21px;border-left:5px solid #120a30;border-right:5px solid #120a30;padding:0 3px}
.f3 .kt-row.nm em{display:none}.f3 .kt-row.nm{justify-content:center}
.f3 .kt-sk{clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));border:0;background:#120a30;color:#5fd4ff;height:22px}
.kt-grp.f3{position:relative;padding:22px 8px 10px;border:4px solid #ff3d8f;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;box-shadow:5px 5px 0 #000}
.kt-grp.f3 .kb-tape{position:absolute;left:-6px;top:-18px;background:none;clip-path:none;transform:rotate(-6deg);font:400 22px/1 var(--font-logo);color:#ff3d8f;-webkit-text-stroke:5px #fff;paint-order:stroke fill;filter:drop-shadow(2px 2px 0 #120a30)}
/* 11/07 制作人：品级右上、属性左下不变；品级靠「框 + 卡底背景」分出档次（漫画格 v2） */
.f3 .ki-rar,.f3 .kt-card .ki-rar{left:auto;right:3px;top:3px}
.f3 .kt-card .ki-rar{right:2px}
.f3 .ki-team{right:auto;left:0;top:0;bottom:auto;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:1px 7px 1px 3px}
.f3.ki::after,.f3 .kt-card::after{left:0;right:auto;top:auto;bottom:0}
.f3.ki{clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
.f3.ki::after{content:"";position:absolute;width:15px;height:15px;clip-path:polygon(0 0,0 100%,100% 100%)}
.kc-grid.c4{grid-template-columns:repeat(4,1fr);margin-bottom:var(--sp-3)}
.kt-lad .kt-card{aspect-ratio:3/4.2}
/* 卡底背景：N 水泥 / R 海报 / SR 霓虹喷漆 / SSR 镭射金箔 */
.f3.ki.r-N,.f3 .kt-card.r-N{background:radial-gradient(#00000022 1px,transparent 1.6px) 0 0/5px 5px,linear-gradient(0deg,#00000014 1px,transparent 1px) 0 0/100% 14px,linear-gradient(160deg,#c9ccd4,#8a8f9c)}
.f3.ki.r-R,.f3 .kt-card.r-R{background:radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,repeating-linear-gradient(120deg,transparent 0 22px,#ffffff22 22px 30px),linear-gradient(160deg,#7fe0ff,#1f78e0)}
.f3.ki.r-SR,.f3 .kt-card.r-SR{background:radial-gradient(circle at 20% 25%,#ff7ad9aa 0 12%,transparent 13%),radial-gradient(circle at 78% 70%,#7fe6ffaa 0 10%,transparent 11%),radial-gradient(#ffffff40 1.2px,transparent 1.8px) 0 0/6px 6px,linear-gradient(160deg,#d59bff,#5a1fb8)}
.f3.ki.r-SSR,.f3 .kt-card.r-SSR{background:radial-gradient(circle at 70% 20%,#fff 0 2%,transparent 3%),radial-gradient(circle at 25% 75%,#fff 0 1.5%,transparent 2.5%),radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,conic-gradient(from var(--ha,200deg) at 40% 40%,#ffe066,#ff7ad9,#7fe6ff,#b07bff,#ffe066)}
.f3.r-SSR,.f3 .r-SSR{animation:kHolo 5s linear infinite}
/* 框：N 纯黑框；R + 蓝胶带角；SR + 紫色铆钉 + 黄黑锯齿；SSR + 金色内线 + 皇冠 + 流光 */
.f3 .r-N .ki-fr,.f3.r-N .ki-fr{box-shadow:inset 0 0 0 4px #120a30}
.f3.ki.r-R::after,.f3 .r-R::after{background:#5fd4ff !important;width:22px !important;height:9px !important;clip-path:none !important;transform:rotate(-35deg) translate(-6px,-2px)}
.f3 .r-R .ki-fr,.f3.r-R .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 6px #5fd4ff80}
.f3 .r-SR .ki-fr,.f3.r-SR .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 6px #c06bff}
.f3 .r-SR .ki-fr::before,.f3.r-SR .ki-fr::before,.f3 .r-SSR .ki-fr::before,.f3.r-SSR .ki-fr::before{content:"";position:absolute;inset:7px;background:radial-gradient(circle,#fff 0 1.6px,#120a30 1.7px 2.6px,transparent 2.7px) 0 0/100% 100% no-repeat;pointer-events:none;
  -webkit-mask:radial-gradient(circle at 0 0,#000 4px,transparent 4.5px),radial-gradient(circle at 100% 100%,#000 4px,transparent 4.5px)}
.f3.ki.r-SR::after,.f3 .r-SR::after{background:repeating-linear-gradient(-45deg,#ffe066 0 3px,#120a30 3px 6px) !important}
.f3 .r-SSR .ki-fr,.f3.r-SSR .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 7px #ffd23f,inset 0 0 0 8px #120a30,inset 0 0 14px #fff8}
.f3.ki.r-SSR::after,.f3 .r-SSR::after{background:conic-gradient(#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8) !important}
.f3.ki.r-SSR::before,.f3 .kt-card.r-SSR::before{content:"";position:absolute;z-index:3;left:-6px;top:-10px;width:30%;aspect-ratio:1.2;background:url(assets/frame_crown.webp) center/contain no-repeat;transform:rotate(-14deg);filter:drop-shadow(1px 1px 0 #120a30)}
.f3 .kt-card.r-SSR::before{left:-8px;top:-14px;width:28%;height:auto;right:auto;background-color:transparent}
.f3.ki.r-SSR .ki-img,.f3 .r-SSR .ki-img{mask:none}
.f3.ki.r-SSR .ki-fr::after,.f3 .r-SSR .ki-fr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff80 48%,transparent 60%) -150% 0/250% 100% no-repeat;animation:kShine 3.2s ease-in-out infinite}
.f3 .ki-img,.f3.ki .ki-img{background-color:transparent}
/* 11/07 制作人：太板正 → 参考《我英》外框：组框整体微斜 + 双层错位框，卡片上下边斜切（平行四边形），黑色投影也是斜的 */
.kt-grp.f3{transform:rotate(-1.6deg);border:0;padding:26px 10px 12px;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;
  clip-path:polygon(0 3%,100% 0,100% 97%,0 100%);box-shadow:none;outline:0}
.kt-grp.f3::before{content:"";position:absolute;inset:6px;border:4px solid #ff3d8f;clip-path:polygon(0 3%,100% 0,100% 97%,0 100%);pointer-events:none;transform:translate(-4px,3px)}
.kt-grp.f3::after{content:"";position:absolute;inset:10px;border:2px solid #ffffff90;pointer-events:none;transform:translate(5px,-3px)}
.kt-grp.f3 .kt-row4{transform:rotate(1.6deg)}
.kt-grp.f3 .kb-tape{transform:rotate(-8deg) skewX(-12deg);left:4px;top:-4px;z-index:2}
.kt-grp.f3 .uk-p{transform:rotate(1.6deg)}
.f3 .kt-card{clip-path:polygon(0 4%,calc(100% - 22px) 0,100% 14px,100% 100%,0 100%)}
.kt.f3{filter:none;position:relative}
.kt.f3::before{content:"";position:absolute;inset:6px -5px -6px 5px;background:#000;clip-path:polygon(0 4%,100% 0,100% 100%,0 98%);z-index:-1}
.f3 .kt-sk{clip-path:polygon(0 0,100% 0,100% 70%,0 100%);height:26px;padding-bottom:4px}
.f3 .kt-role{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:skewX(-8deg)}
/* 区块和方图标也带一点歪 */
.kc-grid .kc:nth-child(odd) .ki{transform:rotate(-1deg)}.kc-grid .kc:nth-child(even) .ki{transform:rotate(1deg)}
.uk-body .k-sec{transform:rotate(-.6deg);clip-path:polygon(0 1.5%,100% 0,100% 100%,0 98.5%)}
.uk-body .k-sec:nth-of-type(even){transform:rotate(.6deg)}
.uk-body .k-sec{clip-path:none}
.kt-grp.f3{clip-path:none;background:none;padding:40px 12px 14px;isolation:isolate}
.kt-grp.f3::before{inset:0;border:0;transform:none;z-index:-2;background:#ff3d8f;clip-path:polygon(0 18px,100% 0,100% calc(100% - 14px),0 100%)}
.kt-grp.f3::after{inset:5px;border:0;transform:none;z-index:-1;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;clip-path:polygon(0 18px,100% 0,100% calc(100% - 14px),0 100%)}
.kt-grp.f3 .kb-tape{top:-14px;left:2px}
/* 11/07 制作人更正：卡牌本身是正的；斜的是卡后面那块黑色「卡套」（像从卡组里抽出来）——比卡大一圈、上下沿是斜线，顶上写顺序。组框也只是框线斜，内容不转 */
.uk-body .k-sec,.uk-body .k-sec:nth-of-type(even){transform:none}
.kc-grid .kc:nth-child(odd) .ki,.kc-grid .kc:nth-child(even) .ki{transform:none}
.kt-grp.f3,.kt-grp.f3 .kt-row4,.kt-grp.f3 .uk-p{transform:none}
.kt-grp.f3 .kb-tape{transform:rotate(-6deg) skewX(-12deg)}
/* 竖卡：卡面回到长方形；后面的黑卡套是斜的平行四边形，上沿露出 14px 写顺序，下沿包住信息栏 */
.f3 .kt-card{clip-path:none;border-top-width:5px}
.f3 .kt-card::before{display:none}
.kt.f3{padding:20px 0 10px;isolation:isolate}
.kt.f3::before{inset:0 -4px 0 -4px;z-index:-1;background:#120a30;clip-path:polygon(0 10px,100% 0,100% calc(100% - 10px),0 100%);transform:translate(3px,3px);box-shadow:none}
.kt.f3::after{content:"";position:absolute;z-index:-1;inset:0 -4px 0 -4px;clip-path:polygon(0 10px,100% 0,100% 18px,0 28px);background:repeating-linear-gradient(-60deg,#120a30 0 5px,#2b1c6c 5px 8px)}
.f3 .kt-no{right:6px;top:-17px}
.kt-lad .kt.f3,.kt-lad>.kt{padding-top:20px}
/* 方图标：图标是正方形；后面一块斜的黑卡套，左下角露出一截 */
.kc .ki.f3{clip-path:none;transform:none}
.kc:has(.ki.f3){position:relative;isolation:isolate}
.kc:has(.ki.f3)::before{content:"";position:absolute;z-index:-1;left:-3px;right:-3px;top:-4px;aspect-ratio:1;height:auto;background:#120a30;clip-path:polygon(0 8px,100% 0,100% calc(100% - 2px),0 100%);transform:translate(3px,5px)}
.f3.ki::after{width:13px;height:13px}
/* 11/07 制作人：卡套叠在一起没法比较；组框里的紫红网点和黑卡套冲突 → 卡之间留开间距，卡套只比卡宽 2px；组框里改成浅灰网点纸（像参考图），黑卡套更突出 */
.kt-row4{gap:14px}
.kt-lad{gap:14px}
.kc-grid{gap:14px 12px}
.kc-grid.c4{gap:14px 16px}
.kt.f3::before{inset:0 -2px 0 -2px;transform:translate(4px,4px)}
.kt.f3::after{inset:0 -2px 0 -2px}
.kc:has(.ki.f3)::before{left:-2px;right:-2px;transform:translate(4px,4px)}
.kt-grp.f3::after{background:radial-gradient(#120a3022 1.3px,transparent 1.9px) 0 0/7px 7px,#ece8f5}
