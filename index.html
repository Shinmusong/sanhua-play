/* 2. 主界面立绘在长屏上太大、压住右边：整个人放进左边 55% 的框里，按高度缩 */
.hv2 .hero{left:6%!important;width:56%!important;height:62%!important;bottom:7%!important}
.hv2 .hero img{height:auto!important;width:auto!important;max-height:100%!important;max-width:100%!important}
/* 3. 扭蛋结果：名牌里的 NEW / 漆罐+1 是方框 → 小贴纸；SR×1 / NEW×4 → 贴纸；「让新伙伴上场」→ 白撕纸按钮 */
.gres .c4-cap .gtag{display:inline-block!important;margin-top:1px;padding:1px 6px 3px!important;border:0!important;background:url(assets/ui2_tab_on.webp) center/100% 100% no-repeat!important;color:#111!important;font:900 9px/1.1 var(--font-pop)!important}
.gsum b{border:0!important;border-radius:0!important;box-shadow:none!important;padding:5px 14px 9px!important;background:url(assets/ui2_tab_off.webp) center/100% 100% no-repeat!important;color:#fff!important;font:900 15px/1 var(--font-pop)!important}
.gsum b.SR{background-image:url(assets/ui2_tab_on.webp)!important;color:#5a1a9a!important}.gsum b.SSR{background-image:url(assets/ui2_tab_on.webp)!important;color:#111!important}
.gsum b.nw{background-image:url(assets/ui2_tag_g.webp)!important;color:#111!important}
.gteam{padding:6px 18px 9px!important;border:0!important;background:#fff!important;color:#111!important;text-decoration:none!important;font:900 14px/1 var(--font-pop)!important;clip-path:polygon(0 12%,96% 0,100% 50%,97% 100%,4% 90%);transform:rotate(-2deg)}
.gsum b,.ov.gacha .gteam{text-shadow:none!important;-webkit-text-stroke:0!important;text-decoration:none!important}
.ov.gacha .gteam{min-height:0!important;color:#111!important;background:#fff!important;padding:8px 18px 10px!important}
.ov.gacha .gbtns{background:none!important;box-shadow:none!important;border:0!important}
.ov.gacha.spray{background:linear-gradient(#231748cc,#231748ee),url(assets/load_bg4.webp) center/cover,#231748!important}

/* ═══ 11/09 真机：页面下面空一大块（制作人截图）——有的 iOS 浏览器 / App 内页面里 100dvh 比实际屏幕矮，#app 没铺满，下面露出底色。
       改成 fixed 贴满整个窗口，高度跟着真实窗口走 ═══ */
#app{position:fixed!important;top:0!important;bottom:0!important;left:0!important;right:0!important;margin:0 auto!important;height:auto!important;max-height:none!important}

/* ═══ 11/09 制作人：详情页统一底版（照碧蓝幻想；角色 / 武器 / 召唤兽共用 detail.js d2） ═══
   品级条 → 展示区（图 + 星级）→ 信息条（等级 / 属性 / 标签 | HP / 攻击力）→ 取消 / 确认 → 说明框（标题条在框里面，不再挂在框外被切）→ 底栏强化入口 */
.sheet.d2 .dp-scroll{padding-bottom:16px}
.sheet.d2 .kd-banner,.sheet.d2 .kd-art,.sheet.d2 .kd-look{margin:var(--sp-3) var(--page-x) 0}
.d2-ban{min-height:58px}.d2-ban .kd-main.sub{color:#9fe0ff}
.d2-art{height:216px!important;overflow:hidden}
.d2-art .kd-stars{z-index:3}
.d2-gart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:calc(var(--ax,.5) * 100%) 10%}
.d2-sart{position:absolute;inset:4% 6%;width:88%;height:92%;object-fit:contain;filter:drop-shadow(0 6px 0 #120a3099)}.d2-sart.off{filter:brightness(0) opacity(.5)}
.d2-art .gd-nav{z-index:4}
.d2-look{grid-template-columns:1.3fr 1fr!important}
.d2-look .k-chips{display:flex;flex-wrap:wrap;gap:4px}.d2-look .k-chips .k-btn{min-height:30px!important;padding:0 10px!important;font-size:12px!important}
.d2-num .kb-plate{gap:6px}.d2-num .kb-pr{min-height:42px!important}.d2-num .kb-pr.hp b{color:#9dffb0!important}.d2-num .kb-pr.atk b{color:#ffcf6a!important}
.d2-btns{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin:12px var(--page-x) 4px;align-items:center}
.d2-btns .k-btn{min-height:52px!important}.d2-btns .dp-join{grid-column:1/-1}
.d2-sec{margin:16px var(--page-x) 0!important;padding:0 10px 10px!important;transform:none!important}
.d2-sec>.k-h{position:relative!important;left:auto!important;top:auto!important;display:block!important;max-width:none!important;margin:0 -10px 8px!important;padding:7px 16px 8px!important;
  background:url(assets/ui2_tab_on.webp) left center/100% 100% no-repeat!important;color:#111!important;font:900 15px/1.2 var(--font-pop)!important;text-shadow:none!important;transform:none!important}
.d2-psv{box-shadow:inset 0 0 0 999px rgba(70,160,255,.14)!important}
.d2-psv>.k-h{filter:hue-rotate(170deg) saturate(.9) brightness(1.05)}
.d2-abs{display:grid;gap:8px}
.d2-ab{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:8px 8px 9px;background:#120a30cc;border:1px solid #ffffff1f}
.d2-ab .d2-ic{display:grid;place-items:center;width:40px;height:40px;font-style:normal}.d2-ab .d2-ic .uic{width:38px;height:38px}
.d2-abh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.d2-abh b{font:900 15px/1.25 var(--font-pop);color:#fff}
.d2-abh em{font:800 11px/1 var(--font-pop);font-style:normal;color:#231748;background:#ffe066;padding:3px 7px;transform:skewX(-8deg)}
.d2-ab.ult .d2-abh em{background:#ff6fae;color:#fff}.d2-ab.psv .d2-abh em{background:#8fd6ff}
.d2-ab p{margin:4px 0 0;font:700 12px/1.5 var(--font-pop);color:#d9d0ff}
.d2-ab.off{opacity:.55;filter:grayscale(.9)}.d2-ab.off .d2-abh b{color:#bdb3e6}
.d2-ab .ss-acts{display:flex;gap:8px;margin-top:8px}.d2-ab .ss-acts .btn,.d2-ab .ss-acts .k-btn{min-height:36px}
.d2-aura{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;padding:8px 10px 9px;margin-bottom:8px;background:#120a30cc;border:1px solid #ffffff1f}
.d2-aura h5{margin:0;padding:3px 10px;font:900 12px/1.2 var(--font-pop);color:#231748;background:#ffe066;transform:skewX(-8deg)}
.d2-aura.sub h5{background:#8fd6ff}
.d2-aura b{justify-self:end;font:400 24px/1 var(--font-graf),var(--font-num);color:#ffcf6a;-webkit-text-stroke:1px #111;paint-order:stroke fill}
.d2-aura.sub b{color:#9fe0ff}
.d2-aura p{grid-column:1/-1;margin:0;font:700 12px/1.5 var(--font-pop);color:#d9d0ff}
.d2-sec .dp-note{margin:4px 2px 0;font-size:11px;color:#b9aee8}
.d2-sec .wskills{margin:0}
.d2-foot{display:grid!important;grid-template-columns:repeat(var(--n),1fr)!important;gap:8px!important}
.d2-g{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:0 6px 6px;border:0;background:url(assets/ui2_btn_sub.webp) center/100% 100% no-repeat;color:#fff;font:900 14px/1.1 var(--font-pop);cursor:pointer}
.d2-g .uic{width:28px;height:28px}.d2-g .dot{position:absolute;right:8px;top:6px;width:10px;height:10px;border-radius:50%;background:#ff3d5a;border:2px solid #fff}
.d2-g:active{transform:translateY(1px)}
/* 强化视图：只留顶栏、品级条、页签和内容（图和信息条已经在详情页看过了） */
.sheet.dgrow .kd-art{height:120px}
/* 编成 · 壁画兽：主召唤 + 副召唤 2 格一排 */
.ks2 .kb-tot .kb-plate{grid-template-columns:1fr!important}
.ks-row{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;align-items:end;margin:6px 4px 10px}
.ks-slot{position:relative;display:grid;gap:4px}
.ks-lbl{position:absolute;z-index:9;left:-4px;top:-10px;padding:2px 8px 3px;font:400 14px/1 var(--font-graf);font-style:normal;color:#111;background:#ffe066;border:2px solid #111;transform:rotate(-6deg);letter-spacing:.5px}
.ks-slot:not(.main) .ks-lbl{background:#8fd6ff}
.ks-slot.on{filter:drop-shadow(0 0 6px #ffe600)}
.ks-empty{display:grid;place-items:center;align-content:center;gap:2px;width:100%;aspect-ratio:1/1.32;border:3px dashed #ffffff55;background:#120a30aa;color:#fff;cursor:pointer}
.ks-empty b{font:400 40px/1 var(--font-graf);color:#ffe066}.ks-empty small{font:800 11px/1.3 var(--font-pop);color:#cfc4ff}
.ks-pick{margin:0 4px 10px;padding:8px 10px;background:#120a30;border:2px solid #8fd6ff}
.ks-pick p{margin:0 0 6px;font:700 12px/1.5 var(--font-pop);color:#fff}.ks-pbtn{display:flex;gap:8px;justify-content:flex-end}
.ks-list{grid-template-columns:repeat(4,1fr)!important;margin:0 4px}
/* 面板里的通用文字白色规则（ui2.css :is(...) :is(b,p,h4,em…)）会盖掉这里的颜色 → 提高优先级 */
.sheet.d2 .d2-sec>h4.k-h{color:#111!important}
.sheet.d2 .d2-abh em.tg{color:#231748!important}.sheet.d2 .d2-ab.ult .d2-abh em.tg{color:#fff!important}
.sheet.d2 .d2-aura b{color:#ffcf6a!important}.sheet.d2 .d2-aura.sub b{color:#9fe0ff!important}
.sheet.d2 .d2-aura h5{color:#231748!important}
.sheet.d2 .d2-ab p,.sheet.d2 .d2-aura p{color:#d9d0ff!important}
.d2-btns .k-btn[disabled] span{font-size:18px!important;line-height:1.1!important}
.sheet.d2 .d2-btns .k-btn.l>span,.sheet.d2 .d2-btns .k-btn.main.l>span{font-size:22px!important;line-height:1.1!important;white-space:nowrap!important;letter-spacing:0!important}
.sheet.d2 .d2-btns .k-btn.l>span small{font-size:11px!important}
.sheet.d2 .d2-sec>h4.k-h{font-size:16px!important;padding:8px 18px 9px!important}
.sheet.dgrow .d2-ban{margin-bottom:var(--sp-3)}
/* 强化视图的说明卡：标题条也放进框里（以前挂在框外左上角，字被切掉——制作人截图标红的那处） */
.sheet.dgrow .dp-body .k-sec{padding:0 10px 10px!important;transform:none!important}
.sheet.dgrow .dp-body .k-sec>h4.k-h{position:relative!important;left:auto!important;top:auto!important;display:block!important;max-width:none!important;margin:0 -10px 8px!important;padding:8px 18px 9px!important;
  background:url(assets/ui2_tab_on.webp) left center/100% 100% no-repeat!important;color:#111!important;font:900 15px/1.25 var(--font-pop)!important;text-shadow:none!important;transform:none!important;white-space:normal!important}
/* ── 11/09 审查后修正 ── */
.sheet.d2 .d2-btns .k-btn>span,.sheet.d2 .d2-btns .k-btn.l>span,.sheet.d2 .d2-btns .k-btn.main.l>span{font-size:22px!important;line-height:1.1!important;white-space:nowrap!important;letter-spacing:0!important}   /* 两个按钮同一字号，主次只靠颜色 */
.sheet.d2 .d2-btns .k-btn{min-height:54px!important}
.sheet.dgrow .dp-foot .k-btn>span{font-size:22px!important;line-height:1.1!important;white-space:nowrap!important}
.sheet.dgrow .dp-foot .k-btn>span small{display:block!important;margin-top:2px;font-size:11px!important;line-height:1.2!important}
.sheet.dgrow .dp-foot .k-btn{min-height:58px!important;padding-bottom:10px!important}
.sheet.d2 .d2-sec>h4.k-h,.sheet.dgrow .dp-body .k-sec>h4.k-h{padding-left:28px!important}   /* 标题第一个字不压在笔刷毛边上 */
.d2 .kd-stars,.dgrow .kd-stars{color:#ffd23f!important;text-shadow:0 1px 0 #111}.d2 .kd-stars .off,.dgrow .kd-stars .off{color:#3a2f66!important;text-shadow:none}
.d2-blur{position:absolute;inset:-20px;background:center/cover no-repeat;filter:blur(14px) brightness(.55) saturate(1.2);transform:scale(1.15)}
.d2-art.sart .d2-sart{inset:2% 0;width:100%;height:96%}
.d2-look .k-chip.tr{border-left:4px solid #ffb02e}
.ks-empty{display:grid!important;gap:4px;border:0!important;background:none!important;padding:0!important;aspect-ratio:auto!important}
.ks-empty .c4p{width:100%}.ks-empty .kw-plus{color:#ffe066!important;font:400 40px/1 var(--font-graf)!important}
.ks-et{font:800 11px/1.3 var(--font-pop);color:#cfc4ff;text-align:center}
.ks-pick{margin:0 4px 12px!important;padding:12px!important}
.ks-pick{scroll-margin-top:96px}

/* 散花一投 · 涂鸦字（11/09 制作人：效果图是什么游戏内就是什么——效果图的英文标题、按钮、数字都是粗涂鸦字 + 黑描边 + 白贴纸边）
   字体：Bangers（Google Fonts，OFL 免费商用），只放拉丁字母和数字；中文落回 PopSans 粗体 */
@font-face{font-family:"Graf";font-display:swap;src:url(assets/font/g0.woff2) format("woff2");unicode-range:U+0000-00FF,U+2013,U+2014,U+2018,U+2019,U+201C,U+201D,U+00B7}
:root{--font-graf:"Graf","PopSans",sans-serif}
/* 白字黑描边（标题）：white fill + 黑描边 + 白色外圈 */
.gxw{font-family:var(--font-graf)!important;font-weight:400!important;letter-spacing:1px;color:#fff!important;-webkit-text-stroke:3px #111;paint-order:stroke fill;
  text-shadow:0 4px 0 #111,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,0 7px 0 #fff!important;font-style:normal}
/* 黑字（贴纸上的字：黄 / 白贴纸） */
.gxb{font-family:var(--font-graf)!important;font-weight:400!important;letter-spacing:1px;color:#111!important;-webkit-text-stroke:0;text-shadow:none!important;font-style:normal}
/* 黑字白描边（底栏、侧栏标签） */
.gxl{font-family:var(--font-graf)!important;font-weight:400!important;letter-spacing:.5px;color:#111!important;-webkit-text-stroke:0;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff,0 4px 0 #111!important;font-style:normal}

/* ═══ 套到各页（照效果图逐个零件） ═══ */
/* 页头：返回黄箭头 + 白色涂鸦大字 + 粉喷漆 + 右上黄「?」 */
.navbar{background:none!important;border:0!important;box-shadow:none!important;height:64px!important;padding:0 10px 0 4px!important}
.navbar .nb-t{flex:1;position:relative;isolation:isolate;font:400 40px/1 var(--font-graf)!important;letter-spacing:1px;color:#fff!important;-webkit-text-stroke:3px #111;paint-order:stroke fill;
  text-shadow:0 4px 0 #111!important;transform:rotate(-3deg);transform-origin:left center;padding:0 0 0 6px!important;background:none!important}
.navbar .nb-t::before{content:""!important;position:absolute;z-index:-1;left:-4px;width:min(78%,240px);top:42%;bottom:-8px;background:url(assets/ui2_title.webp) left center/100% 100% no-repeat!important;display:block!important}
.navbar .nb-t::after{content:"";position:absolute;z-index:1;left:calc(min(78%,240px) - 10px);top:-6px;width:40px;height:30px;background:url(assets/frame_crown.webp) center/contain no-repeat;transform:rotate(14deg)}
.nb-help{flex:none;width:46px;height:46px;border:0;background:url(assets/sw_help.webp) center/contain no-repeat;filter:drop-shadow(0 2px 0 #000a)}
.pickp .k-p2h b{font:400 40px/1 var(--font-graf)!important;-webkit-text-stroke:3px #111!important;text-shadow:0 4px 0 #111!important}
/* 涂鸦字：按钮、页签、贴纸、数字 */
.k-ab-main b,.btn b,.ga-pick,.kb-tab,.s-tag,.ksb-n b,.qh-t b,.sl-t b.s-strip,.sl-ch,.ga-pl,.ga-pn,.kb-pow i,.ga-rate,.qh-info,.qh-chip,.h2-n,.h2-lock,.sl-r small.s-strip,.s-strip.pk-out,.gl-show .s-strip,.kw-sum{font-family:var(--font-graf)!important;font-weight:400!important;letter-spacing:.5px}
.k-ab-main b{font-size:30px!important;color:#111!important}
.pk-bar .k-ab-main b,#panel .pk-bar .k-ab-main b{font-size:30px!important;transform:rotate(-3deg)}
.k-ab-main small{font-family:var(--font-graf)!important;font-size:12px!important}
.kb-pow b,.ga-rate b,.hd-pow b,.ga-pn{font-family:var(--font-graf)!important}
.kb-pow{padding:8px 18px 14px 14px!important}.kb-pow i{font-size:24px!important}.kb-pow b{font:400 36px/1 var(--font-graf)!important}
.kb-tab{font-size:18px!important;padding:2px 12px 10px!important;height:40px!important}
.s-tag{font-size:20px!important;height:36px!important;padding:0 16px 4px!important;transform:rotate(-3deg)}
.ksb-n b{font-size:28px!important;color:#111!important}.ksb-n small{font-size:10px!important}
.qh-t b{font-size:40px!important;line-height:.95!important;-webkit-text-stroke:0;padding:8px 18px 12px 14px!important}
.qh-t i{display:block!important;margin:4px 0 0 6px;font:900 12px/1 var(--font-pop);font-style:normal;color:#fff;text-shadow:0 1px 2px #000}
.qh-info{font-size:17px!important}.qh-chip{font-size:18px!important}
.sl-t b.s-strip{font-size:26px!important}
.sl-r small.s-strip{font-size:15px!important}
.sl-ch{font-size:34px!important}.sl-ch small{font-family:var(--font-pop)!important;font-size:11px!important}
.sl-stars3{display:flex;align-items:center;gap:0}.sl-stars3 i{font-style:normal;font-size:42px;line-height:1;color:#6a6a7a;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:0 0 0 #fff,-2px -2px 0 #fff,2px 2px 0 #fff}
.sl-stars3 i.on{color:#ffd600}.sl-stars3 small{margin-left:4px;font:400 14px/1 var(--font-graf);color:#fff;-webkit-text-stroke:2px #111;paint-order:stroke fill}
.sl-show .sl-stars{display:none!important}
.ga-pick{font-size:44px!important;font-style:normal!important;padding:8px 20px 16px!important}
.ga-rate{font-size:26px!important}.ga-rate b{font-size:46px!important}
.ga-pl{font-size:24px!important}.ga-pn{font-size:22px!important}
.ga-bar2 .btn b{font-size:26px!important;line-height:1;display:block}.ga-bar2 .btn.gold b{font-size:30px!important}
.ga-bar2 .btn small{display:flex!important;align-items:center;justify-content:center;gap:2px;font-family:var(--font-graf)!important;font-size:13px!important}
.ga-bar2 .btn small .ico{width:14px;height:14px}
.s-strip.pk-out{font-size:24px!important}.s-strip.pk-out b{font-family:var(--font-pop)!important;font-size:18px!important}.s-strip.pk-out em{font-family:var(--font-graf)!important;font-size:24px!important;color:#111!important}
.gl-show .s-strip{font-size:22px!important}.kw-sum{font-size:20px!important}
/* 名牌第 2 行「Lv 12  ATK 446」用涂鸦字 */
.c4w:has(>.c4-cap) .c4-cap>.c4-l2{font-family:var(--font-graf)!important;font-weight:400!important;font-size:12px!important;letter-spacing:.3px}
/* 功能区圆钮下的字（INFO / BOND / AUTO）、底栏、侧栏：黑字白边涂鸦字 */
.k-ab-i small,.tab span,.hv2 .scol .sb>span{font-family:var(--font-graf)!important;font-weight:400!important;color:#111!important;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff,0 4px 0 #111!important}
.k-ab-i small{font-size:15px!important}
.tab span{font-size:18px!important;padding:0!important}
.hv2 .scol .sb>span{font-size:18px!important}
.tab.mid span{font-size:24px!important;color:#111!important}
.tab[aria-selected="true"] span::after{bottom:-6px!important}
/* 主界面右列：卡上粉色涂鸦大字 + 黄贴纸 */
.h2-ent b{font:400 30px/1 var(--font-graf)!important;color:#ff4fb0!important;-webkit-text-stroke:2.5px #111;paint-order:stroke fill;text-shadow:0 3px 0 #111!important;align-self:flex-end;transform:rotate(-4deg)}
.h2-ent{align-items:flex-start;height:84px!important}
.h2-n{display:inline-flex!important;align-items:center;gap:3px;align-self:flex-end;padding:2px 10px 5px;background:url(assets/ui2_tab_on.webp) center/100% 100% no-repeat;color:#111;font-size:15px!important;font-style:normal}
.h2-n img{width:20px;height:20px}
.h2-sl b{font:400 34px/1 var(--font-graf)!important;color:#ffe600!important;-webkit-text-stroke:2.5px #111;paint-order:stroke fill;text-shadow:0 3px 0 #111!important;transform:rotate(-6deg);align-self:flex-start}

.hd #lord{display:contents}
.lord{display:flex!important;align-items:center;gap:6px;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;clip-path:none!important}
.lord .head{width:52px!important;height:52px!important;border-radius:0!important;border:3px solid #fff!important;outline:2.5px solid #111;clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%)}
.lord .lv,.lord .pw{display:none!important}
.ld-n{display:grid;justify-items:start;gap:2px}
.ld-n b{padding:2px 10px 4px;background:#fff;color:#111;font:900 14px/1 var(--font-pop);clip-path:polygon(0 12%,96% 0,100% 50%,97% 100%,4% 90%)}
.ld-n i{padding:1px 10px 4px;background:#ff4fb0;color:#111;font:400 16px/1 var(--font-graf);font-style:normal;transform:rotate(-3deg)}
.hd-pow{display:grid;justify-items:start;line-height:1}
.hd-pow i{padding:1px 8px 3px;background:#fff;color:#111;font:400 13px/1 var(--font-graf);font-style:normal;transform:rotate(-4deg)}
.hd-pow b{margin-top:-2px;padding:2px 10px 6px;background:url(assets/ui2_tab_on.webp) center/100% 100% no-repeat;color:#111;font:400 26px/1 var(--font-graf)!important}
.hd .curs{display:grid!important;gap:4px;justify-items:end}
.hd .curs .cur{min-width:0!important;height:24px!important;font-size:13px!important}
.hd .curs .cur span{font-family:var(--font-graf)!important;font-size:16px!important}

#hub[data-tab="party"] .hd,#hub[data-tab="gacha"] .hd,#hub[data-tab="gen"] .hd,#hub[data-qv="main"] .hd{display:none!important}

.tabs .tab[aria-selected="true"] span,.tabs .tab span{background:none!important;color:#111!important}

#panel .pk-bar .k-ab-i small,.pk-bar .k-ab-i small,.k-ab .k-ab-i small{font-size:14px!important;letter-spacing:.5px}
.pk-bar .k-ab-i{width:48px!important}
.pk-bar .k-ab-c.c3,.pk-bar .k-ab-c.c3 .uic{width:46px!important;height:46px!important}

.pk-bar .k-ab-main{flex:1 0 120px!important;min-width:120px!important}
.sl-ch{font-size:26px!important;padding:6px 12px 10px!important}

.sl-stars3 i{font-size:30px!important}
.ga-tr{min-width:0;overflow:hidden}.ga-sub{display:block;width:100%;font-size:10px!important;line-height:1.35!important}
.c4w:has(>.c4-cap) .c4-cap>.c4-l2{font-size:11px!important;letter-spacing:0!important}
.ksb-n small{display:block}

.ga-sub{display:none!important}

.pk-bar:has(.k-ab-l>:nth-child(3)) .k-ab-main{padding-left:6px!important;padding-right:10px!important}

.k-popc .gp-h,.k-popc small{max-width:100%;white-space:normal!important;overflow-wrap:anywhere}
