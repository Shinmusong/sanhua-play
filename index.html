/* ===== 11/06 UI/UX 专项审查（docs/qa/审查报告_UIUX_20261106.md） ===== */
/* P0-1 返回条吸顶，章节切换放进同一条 */
.backbar{position:sticky;top:-12px;z-index:30;margin:-12px -12px 10px;padding:10px 12px 8px;background:linear-gradient(180deg,#1b0f3df2 70%,#1b0f3d00);flex-wrap:wrap}
.backbar .btn.back{min-height:44px;min-width:72px;font-size:15px}
.backbar .chnav{margin:0 0 0 auto;gap:6px}
.backbar .chnav .btn{min-width:44px;min-height:44px;font-size:20px}
/* P0-2 说明：左右翻页 + 右上角 × */
.pnl.help{max-height:calc(100% - 40px);display:flex;flex-direction:column;gap:10px}
.pnl-x{position:absolute;right:-8px;top:-12px;z-index:5;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font:900 26px/1 var(--font-pop);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0 0 3px}
.pnl.help .helpbox{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain;min-height:0;flex:1}
.pnl.help .helpbox::-webkit-scrollbar{display:none}
.pnl.help .helpc{flex:0 0 100%;scroll-snap-align:center;overflow-y:auto;position:relative}
.pnl.help .helpc img{max-height:min(46vh,340px);object-fit:contain}
.hp-n{position:absolute;right:14px;top:10px;z-index:1;font:900 12px/1 var(--font-pop);font-style:normal;color:#fff;background:var(--ink);border-radius:999px;padding:3px 8px}
.hp-nav{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.pnl .hp-nav .btn{min-height:52px}
/* P1-1 扭蛋结果：底部固定「收下 / 再抽」，再抽是主按钮；上场改成链接 */
.ov.gacha .gbtns{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;width:min(100%,420px);justify-items:stretch;margin:auto 0 0;padding:12px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#1b0f3d00,#1b0f3de6 35%)}
.ov.gacha .gbtns .btn{min-height:58px;font-size:18px;padding:6px}
.ov.gacha .gteam{margin:4px auto 0;min-height:44px;padding:0 18px;border:0;background:none;color:#ffe27a;font:900 15px/1 var(--font-pop);text-shadow:var(--ol-xs);text-decoration:underline;text-underline-offset:3px;transition:opacity .3s .3s}
.ov.gacha:not(.done) .gteam{opacity:0;pointer-events:none;visibility:hidden}
/* P1-2 结果卡：NEW / 重复转化改成左上角小角标，不压脸 */
.gc .front .new{top:auto;bottom:20px;left:2px;right:auto;transform:rotate(-4deg);max-width:calc(100% - 6px);font-size:9.5px;line-height:1.25;padding:0 3px;text-align:left;border-width:1.5px}
.gc .front .gwep{bottom:36px;left:2px;right:auto;font-size:9px;padding:0 3px;border-width:1.5px}
@media (max-width:380px){.gc .front .new{bottom:18px;font-size:9px}}
.ov.gacha .gtitle{margin-top:auto}
/* P1-4 可点区域 ≥ 44px（品质规范 §5）：按钮、页签直接做高；小药丸（货币、筛选 chip）外观不变，用透明的 ::before 把热区撑到 44 */
.btn{min-height:44px}
.seg-b{min-height:46px}
.pset{flex:0 0 44px;min-width:44px;height:44px}
@media (max-height:700px){.pset{height:44px;font-size:15px}}
.chip{position:relative;min-height:34px}
.chip::before{content:"";position:absolute;inset:-5px -4px}
.curs .cur::before{content:"";position:absolute;top:-10px;bottom:-10px;left:0;right:-4px}
.ov.gacha .gskip{min-height:46px;min-width:110px}
/* P1-5 决定出击的关键信息不能是最小字：主页出击副标题、关卡详情的推荐编队 / 推荐战力 / 掉落 */
.questbtn small{font-size:13px}
.stage .info .tag{font-size:12px;padding:2px 8px}
.mc .cc-bt,.cc-name i small{font-size:9.5px}
.promo small{font-size:10px}
/* P2-1 主页：锁上写解锁关卡；主角立绘缩小一点，不压左右两列按钮 */
.lkn{position:absolute;left:50%;bottom:-2px;z-index:4;transform:translateX(-50%);white-space:nowrap;font:900 11px/1.2 var(--font-pop);font-style:normal;color:#fff;background:#231748;border:1.5px solid #fff;border-radius:999px;padding:1px 6px;pointer-events:none;filter:none}
.ulock .lkn{filter:none}
.tab .lkn{bottom:2px;font-size:10px}
.home .hero{left:64px;right:64px}
.home .hero img{max-height:396px;max-width:100%}
/* P2-2 选支援：用不上的收起来，「直接出发」吸底 */
.sup-sheet .sh-foot{position:sticky;bottom:-16px;z-index:3;margin:12px -12px -16px;padding:10px 12px 16px;background:linear-gradient(180deg,#1b0f3d00,#1b0f3df0 30%)}
.sup-more{margin-top:6px}.sup-more summary{min-height:44px;display:flex;align-items:center;justify-content:center;font:900 13px/1 var(--font-pop);color:#d6caff;cursor:pointer}
.sup-more .supr{margin-top:6px}
/* P2-3 装备盘：预测和明细收进一行 */
.gmore{margin-top:8px}
.gmore summary{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;border:2.5px solid var(--ink);background:var(--cream);color:var(--text);font:900 13px/1.3 var(--font-ui);cursor:pointer;list-style:none}
.gmore summary::-webkit-details-marker{display:none}
.gmore summary::after{content:"▸";margin-left:auto;transition:transform .2s}
.gmore[open] summary::after{transform:rotate(90deg)}
.gmore[open] .gpred{margin-top:8px}
/* P1-4 详情页页签、矮屏底部按钮也不低于 44 */
.dp-tabs button{min-height:44px}
@media (max-height:700px){.dp-tabs button{min-height:44px}.dp-foot .btn{min-height:44px}}
/* P2-7 地图页：章节进度条 */
.exp-prog{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;min-height:76px;padding:10px 14px;border-radius:16px;border:3px solid var(--ink);background:var(--cream);color:var(--text);box-shadow:0 4px 0 var(--ink);text-align:left}
.exp-prog img{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#231748;object-fit:cover;flex:none}
.exp-prog .ep-t{display:grid;gap:5px;flex:1;min-width:0}
.exp-prog b{font:900 15px/1.2 var(--font-pop)}
.exp-prog small{font-size:12px;font-weight:900;color:var(--muted)}
.ep-bar{display:block;height:10px;border-radius:6px;background:#231748;overflow:hidden;border:2px solid var(--ink)}
.ep-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5a,#ffc23a,#55d47a,#4f95ff,#b27cff)}
.ep-go{font:900 28px/1 var(--font-pop);color:var(--ink)}
/* P2-6 矮屏结算：掉落图标缩小、星星收小一点，升级那几行完整露出来，不被底部按钮切掉 */
@media (max-height:700px){.rpnl .lw .wi{width:46px;height:46px}.rstar .st{width:48px;height:48px}.rstar .st.s1{width:62px;height:62px}.ov .logo img{max-height:12vh}.rpnl{gap:6px}.rpnl .rstats div{padding:3px 4px}}
/* 11/06 机关敌人提示：关卡详情一行小图标 + 名字，这关第一次出现的标 NEW */
.stage .row.foes{gap:4px;flex-wrap:wrap;margin-top:3px}
.stage .row.foes small{font-size:11px;font-weight:900;color:var(--muted)}
.foe{display:inline-flex;align-items:center;gap:2px;height:22px;padding:0 7px 0 3px;border-radius:999px;background:#fff;border:2px solid var(--ink);font:900 11px/1 var(--font-ui);color:var(--text)}
.foe .uic{width:18px;height:18px}
.foe.nw{background:#ffe27a;position:relative}
.foe.nw::after{content:"NEW";position:absolute;right:-6px;top:-9px;font:900 9px/1 var(--font-pop);color:#fff;background:#e8264a;border:1.5px solid var(--ink);border-radius:4px;padding:1px 3px;transform:rotate(8deg)}
.foe.more{padding:0 7px}
/* 11/06 新对手介绍卡 */
.ov.foe-ov{background:#0b0620b8;justify-content:center}
.foecard{position:relative;width:min(86%,330px);padding:56px 18px 18px;border-radius:22px;border:4px solid var(--ink);text-align:center;color:#fff;box-shadow:0 6px 0 var(--ink),0 0 0 6px #fff inset;
  background:repeating-conic-gradient(from 0deg at 50% 30%,#ffffff22 0 8deg,#fff0 8deg 16deg),radial-gradient(circle at 50% 30%,var(--e1) 0%,var(--e2) 70%);animation:foeIn .45s cubic-bezier(.2,1.6,.4,1) both}
.foecard img{display:block;height:200px;margin:-30px auto 4px;filter:drop-shadow(0 6px 0 #0006);animation:foeBob 1.6s ease-in-out infinite}
.foecard b{display:block;font:900 30px/1.1 var(--font-pop);text-shadow:var(--ol-s,0 3px 0 #000)}
.foecard p{margin:8px 4px 16px;padding:10px 12px;border-radius:12px;background:#fff;color:var(--text);border:3px solid var(--ink);font:900 15px/1.5 var(--font-ui)}
.fc-new{position:absolute;left:50%;top:-20px;transform:translateX(-50%) rotate(-4deg);font:900 22px/1 var(--font-pop);font-style:normal;color:#231748;background:#ffe27a;border:3px solid var(--ink);border-radius:10px;padding:6px 14px;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.foecard .btn{width:100%;min-height:56px}
@keyframes foeIn{from{transform:scale(.6) rotate(-6deg);opacity:0}}
@keyframes foeBob{50%{transform:translateY(-6px)}}
/* 11/06 锁头换成贴纸图（以前是两块 CSS 拼的小锁） */
.ulock::before{display:none}
.ulock::after{right:0;top:0;width:22px;height:28px;border:0;border-radius:0;background:url(assets/ui_lock.webp) center/contain no-repeat;filter:drop-shadow(0 1px 0 #0008)}
.tab.ulock::after{right:6px;top:2px}
/* 11/06 关卡地图节点：黄黑胶带圈贴纸 */
.snode{border:0;background:radial-gradient(circle,var(--ec) 0 57%,#231748 58% 61%,transparent 62%),url(assets/ui_node.webp) center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 4px 0 #0007)}   /* 中间保留关卡属性色 */
/* 11/06 扭蛋开场：胶囊换成 ChatGPT 出的彩虹喷漆罐贴纸；摇两下「噗」地喷开，光的颜色暗示稀有度 */
.gintro .cap{width:120px;height:216px;background:url(assets/ui_gcan.webp) center/contain no-repeat;filter:drop-shadow(0 0 14px var(--capg,#49b6ff));animation:capDrop .45s cubic-bezier(.3,1.6,.6,1) both,capShake .3s .45s 2,canPop .3s .85s forwards}
.gintro .cap i{display:none}
.gintro.r-SR{--capg:#c06bff}.gintro.r-SSR{--capg:#ffcf3a}
@keyframes canPop{60%{transform:scale(1.25);opacity:1}to{transform:scale(1.6);opacity:0}}
/* 11/06 试打必杀 */
.ssk .sstry{width:100%;margin-top:8px;min-height:48px}
.foecard b .uic{display:inline-block;width:34px;height:34px;vertical-align:-6px;margin-right:4px}
.foecard .fc-mark{display:block;margin-top:4px;font:900 12px/1.3 var(--font-ui);color:#fff;opacity:.9}
/* 11/06 审查 P2-11：未解锁的关卡点只把中心压灰，胶带圈保留原色；扭蛋漆罐喷开时有一道颜料扇面 */
.snode.lock{filter:brightness(.78);--ec:#6b6680}
.gintro .cap::after{content:"";position:absolute;left:50%;top:6%;width:260px;height:260px;margin-left:-130px;margin-top:-200px;border-radius:50%;opacity:0;pointer-events:none;
  background:conic-gradient(from 150deg,transparent 0 10deg,var(--capg,#49b6ff) 20deg 40deg,transparent 50deg 60deg,#fff 70deg 80deg,transparent 90deg 100deg,var(--capg,#49b6ff) 110deg 130deg,transparent 140deg);animation:canSpray .4s .82s ease-out forwards}
@keyframes canSpray{0%{opacity:0;transform:scale(.2)}40%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.ss-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.ss-acts .btn{min-height:48px;margin:0;width:100%}
.ov.ssprev{background:#0b0620f0;justify-content:center;gap:10px}
.ov.ssprev canvas{width:min(100%,480px);border-radius:16px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:#0b0620;cursor:pointer}
.ov.ssprev .ssp-tip{font:900 13px/1 var(--font-ui);color:#d6caff}
.ov.ssprev .pnl-x{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top))}

/* 11/06 制作人：结算「伤害占比」 */
.dmgp{width:100%;margin-top:2px}
.dmgp summary{list-style:none;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-height:44px}
.dmgp summary::-webkit-details-marker{display:none}
.dmgmore{font-style:normal;margin-left:8px;padding:1px 8px;border-radius:9px;background:#ffffff1f;color:#fff}
.dmgmore::after{content:" ▾"}
.dmgp[open] .dmgmore::after{content:" ▴"}
.dmgp[open] .dmgcells{display:none}
.dmgcells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;min-width:0}
.dmgc{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:32px;border-radius:9px;background:#ffffff0d;animation:dmgIn .35s var(--d) both}
.dmgc.top{background:linear-gradient(180deg,#ffd23f40,#ffffff0d);box-shadow:0 0 0 2px #ffd23f99 inset}
.dmgc .head{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);display:block;flex:none}
.dmgc .head.ex{display:grid;place-items:center;font-size:13px;color:#231748;background:#ffc22e}.dmgc .head.ex.other{background:#b8b0d8}

.dmgc .mvp{position:absolute;left:50%;top:-11px;height:15px;transform:translateX(-50%) rotate(-6deg);pointer-events:none}
.dmgrows{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.dmgh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.dmgh b{font:900 13px var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.dmgh small{font-size:11px;font-weight:800;color:#d9d0ff;font-variant-numeric:tabular-nums}
.dmgbar{display:flex;height:12px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:#0006;box-shadow:0 2px 0 var(--ink)}
.dmgbar i{display:block;min-width:2px;border-right:2px solid var(--ink);transform-origin:left;animation:dmgGrow .6s .15s cubic-bezier(.2,.9,.3,1) both}
.dmgbar i:last-child{border-right:0}
.dmgrows{display:flex;flex-direction:column;gap:3px}
.dmgr{display:grid;grid-template-columns:26px 74px 1fr 38px 58px;align-items:center;gap:6px;height:28px;padding:0 6px 0 2px;border-radius:9px;background:#ffffff0d;animation:dmgIn .35s var(--d) both}
.dmgr.top{background:linear-gradient(90deg,#ffd23f33,#ffffff0d);box-shadow:0 0 0 2px #ffd23f80 inset}
.dmgr .head{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink);display:block}
.dmgr .head.ex{display:grid;place-items:center;font-size:14px;color:#231748;background:#ffc22e}
.dmgr .head.ex.other{background:#b8b0d8}
.dmgr .nm{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;text-shadow:var(--ol-xs)}
.dmgr .bar{height:10px;border-radius:6px;background:#0007;border:2px solid var(--ink);overflow:hidden}
.dmgr .bar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:dmgGrow .7s calc(var(--d) + .1s) cubic-bezier(.2,.9,.3,1) both}
.dmgr b{font:400 17px/1 "PopNum",var(--font-pop);color:var(--yel-1);text-align:right;text-shadow:var(--ol-xs)}
.dmgr small{font-size:11px;font-weight:800;color:#d9d0ff;text-align:right;font-variant-numeric:tabular-nums}
@keyframes dmgGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dmgIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (max-height:700px){.dmgr{height:22px}.dmgr .head{width:20px;height:20px}.dmgr{grid-template-columns:20px 70px 1fr 34px 54px}.dmgr b{font-size:14px}}

@media (max-height:700px){.dmgp summary .dmgbar{display:none}.dmgc{height:27px}.dmgp summary{gap:3px}}
/* 11/06 角色定位、核心属性、弹道特性、被动槽、属性表 */

/* 11/06 真机：结算页一屏放下（漆罐和奖励同一行，LEVEL UP 小标贴在经验那一行开头） */
.rpnl .rew{gap:6px;flex-wrap:nowrap}
.rpnl .rew span{font-size:15px;padding:4px 10px 4px 5px;white-space:nowrap}
.rpnl .rew .ico{width:26px;height:26px;background-size:234px 26px}.rpnl .rew .ico.coin{background-position:-130px 0}
.rpnl .rew .rcan .el{width:18px;height:18px}
.lvlogo{height:30px;flex-basis:auto;margin:-4px 0;display:inline-block}
.rpnl .xprow{align-items:center}
@media (max-width:380px){.rpnl .rew span{font-size:13px;padding:3px 8px 3px 4px}.rpnl .rew .ico{width:22px;height:22px;background-size:198px 22px}.rpnl .rew .ico.coin{background-position:-110px 0}}

/* 11/07 功能开放：结算后的「新功能开放」卡、一步引导手指、NEW 角标 */
.unl-ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(20,12,48,.62);animation:fade .2s ease-out}
.unl-card{position:relative;width:min(86%,330px);padding:26px 18px 16px;border:4px solid var(--ink);border-radius:22px;background:linear-gradient(170deg,#fff 0%,#f1ecff 100%);box-shadow:0 6px 0 var(--ink);text-align:center;animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
.unl-card small{display:block;font:900 14px/1 var(--font-pop);color:var(--cinnabar);letter-spacing:.12em}
.unl-card h3{margin:6px 0 8px;font:900 26px/1.15 var(--font-pop);color:var(--ink)}
.unl-card p{margin:0 4px 12px;font:700 14px/1.55 var(--font-pop);color:#3b2f73}
.unl-new{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-4deg);padding:3px 14px;border:3px solid var(--ink);border-radius:10px;background:var(--gold);font:900 18px/1.1 var(--font-pop);font-style:normal;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.unl-ic{display:grid;place-items:center;width:84px;height:84px;margin:4px auto 8px;border:3px solid var(--ink);border-radius:22px;background:radial-gradient(circle at 50% 40%,#fff59a,#ffd23f 70%);animation:bob 1.2s ease-in-out infinite}
.unl-ic .uic{width:76px;height:76px}
.unl-rew{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:var(--ink);font:900 14px/1.3 var(--font-pop);color:var(--gold-2)}
.unl-rew .ico{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#7ef0ff 45%,#b26bff)}
.unl-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.unl-btns .btn{min-height:50px}
.unl-focus{position:relative;z-index:5;outline:4px solid var(--gold);outline-offset:3px;border-radius:14px;animation:unlGlow 1s ease-in-out infinite}
@keyframes unlGlow{50%{outline-color:#fff59a;box-shadow:0 0 18px 6px rgba(255,210,63,.75)}}
.unl-hand{position:fixed;z-index:60;height:72px;pointer-events:none;transform:translate(-28%,0) rotate(-10deg);transform-origin:28% 0;filter:drop-shadow(3px 4px 0 rgba(35,23,72,.85));animation:unlTap .9s ease-in-out infinite}
@keyframes unlTap{50%{translate:0 10px;scale:.92}}
.unl-nw:not(.k-btn):not(.btn)::after{content:'NEW';position:absolute;top:-8px;right:-6px;z-index:3;padding:1px 5px;border:2px solid var(--ink);border-radius:7px;background:var(--cinnabar);font:900 10px/1.2 var(--font-pop);color:#fff;letter-spacing:.04em;transform:rotate(8deg);pointer-events:none;animation:bob 1s ease-in-out infinite}
.unl-nw.ulock:not(.k-btn)::after{display:none}
/* 11/07 过场改成斜切快门，样式在 kit.css */
.title.leaving{pointer-events:none}

/* 11/07 制作人：扭蛋结果里的 SSR 壁画兽看不出不是角色 → 左上角「壁画兽」标签，卡面加一圈青色内框 */
.gc .front.gsumc{box-shadow:inset 0 0 0 3px #2fd4ff,inset 0 0 18px #2fd4ff99}
.gc .front .gsum{position:absolute;z-index:2;left:-3px;right:-3px;bottom:19px;display:flex;align-items:center;justify-content:center;gap:1px;padding:0 2px;border-block:2px solid var(--ink);background:#2fd4ff;font:900 11px/1.25 var(--font-pop);color:var(--ink);letter-spacing:.06em;transform:rotate(-4deg)}
.gc .front .gsum .uic{width:17px;height:17px;margin:-2px 0}
.gc .front.gsumc .new{top:3px;bottom:auto;left:2px;right:auto;transform:rotate(-4deg)}
/* 11/07 制作人：涂鸦手详情——「编成中」角标、左右切换箭头、返回按钮放大 */
.gd-inteam{position:absolute;z-index:3;right:8px;top:10px;padding:3px 10px;border:2.5px solid var(--ink);border-radius:999px;background:linear-gradient(180deg,#7dffb0,#2fd47a);font:900 13px/1.25 var(--font-pop);color:var(--ink);box-shadow:0 2px 0 var(--ink);transform:rotate(3deg)}
.gd-nav{position:absolute;z-index:3;top:50%;width:44px;height:64px;margin-top:-32px;border:0;padding:0;background:none;cursor:pointer}
.gd-nav::before{content:"";position:absolute;inset:14px 10px;border:solid #fff;border-width:0 0 6px 6px;border-radius:3px;filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(2px 2px 0 var(--ink));opacity:.9}
.gd-nav.l{left:2px}.gd-nav.l::before{transform:rotate(45deg) translate(6px,-2px)}
.gd-nav.r{right:2px}.gd-nav.r::before{transform:rotate(-135deg) translate(6px,-2px)}
.gd-nav:active::before{opacity:.5}
.dpg .gd-art.sw-r{animation:swR .28s ease-out}.dpg .gd-art.sw-l{animation:swL .28s ease-out}
@keyframes swR{from{translate:60px 0;opacity:.2}}@keyframes swL{from{translate:-60px 0;opacity:.2}}

/* 11/07 制作人：战力提高的中央演出 */
.powpop{position:absolute;z-index:70;left:50%;top:42%;display:grid;justify-items:center;gap:0;padding:10px 26px 12px;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;border:4px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#3a2690f2,#231748f2);box-shadow:0 5px 0 var(--ink),0 0 30px #ffd23f88;animation:powIn .32s cubic-bezier(.3,1.6,.5,1)}
.powpop i{font:400 22px/1 var(--font-logo);font-style:normal;color:#fff59a;letter-spacing:.08em;text-shadow:var(--ol-s)}
.powpop b{font:400 44px/1.05 "PopNum",var(--font-pop);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.powpop small{font:900 18px/1 var(--font-pop);color:#7dffb0;text-shadow:var(--ol-xs)}
.powpop.bump{animation:powBump .25s ease-out}
.powpop.out{opacity:0;transform:translate(-50%,-70%) rotate(-3deg);transition:.3s}
@keyframes powIn{from{transform:translate(-50%,-50%) rotate(-3deg) scale(.4);opacity:0}}
@keyframes powBump{50%{transform:translate(-50%,-50%) rotate(-3deg) scale(1.08)}}
.dpg .gd-hero{touch-action:pan-y}.dpg .gd-art{pointer-events:none;-webkit-user-drag:none;user-select:none}   /* 滑动切换：图片不能被浏览器当成拖拽 */

/* 散花一投 · 公共组件 v2「街头贴纸」（11/07 制作人选：风格 A 街头贴纸 + 装备卡借 B 的底部黑条；页签 = 胶带；消耗 = 能量槽）
   视觉语言：斜切角（不用圆角）、硬投影（实色错位，不用柔光）、胶带标签、斜纹 / 网点底纹。只用 tokens.css 里的变量 */
:root{
  --ink2:#120a30;                                   /* 最深的墨色：硬投影、黑条 */
  --tape-y:repeating-linear-gradient(-45deg,#ffe066 0 12px,#ffd21a 12px 24px);
  --stripe:repeating-linear-gradient(135deg,#ffffff26 0 3px,transparent 3px 8px);
  --dots:radial-gradient(#ffffff14 1px,transparent 1.6px) 0 0/8px 8px;
  /* 胶带锯齿边 */
  --tape-cut:polygon(2% 10%,6% 0,14% 7%,24% 0,36% 6%,50% 0,64% 6%,76% 0,88% 6%,96% 0,100% 12%,100% 90%,96% 100%,86% 94%,72% 100%,58% 94%,44% 100%,30% 94%,16% 100%,6% 95%,0 88%);
}
.k-cut{--cp:12px;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}

/* ───────── 物品卡：斜切贴纸板 + 品级色斜纹 + 底部黑条（品级 / 等级）───────── */
.k-card{--w:84px;--cp:14px;--b:3px;position:relative;display:block;flex:none;width:var(--w);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;container-type:inline-size;--sh:3px}
.k-card.tall{aspect-ratio:4/5}
.k-card.k-s{--w:64px;--cp:10px}.k-card.k-l{--w:150px;--cp:22px;--b:4px;--sh:5px}
.k-card.fill{width:100%;--w:auto}
.k-mat,.k-mat::after,.k-win{clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-mat{position:absolute;inset:0;background:var(--ink2)}
.k-mat::after{content:"";position:absolute;inset:var(--b);background:var(--stripe),var(--rg)}
.k-card.r-N{--rg:linear-gradient(135deg,#e2e5ec,#8b92a5)}.k-card.r-R{--rg:linear-gradient(135deg,#a6f0ff,#1f8ae8)}.k-card.r-SR{--rg:linear-gradient(135deg,#e2b8ff,#7a3ad6)}
.k-card.r-SSR{--rg:conic-gradient(from var(--ha,200deg) at 40% 40%,#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8)}
@property --ha{syntax:"<angle>";inherits:true;initial-value:200deg}
.k-card.r-SSR .k-mat::after{animation:kHolo 4s linear infinite}
@keyframes kHolo{to{--ha:560deg}}
.k-win{position:absolute;left:calc(var(--b) + 7%);right:calc(var(--b) + 7%);top:calc(var(--b) + 7%);bottom:24%;background:radial-gradient(circle at 50% 45%,#ffffff66,transparent 70%),var(--dots),#ffffff14;box-shadow:inset 0 0 0 2px #120a3055;clip-path:none}
.k-card .k-img{position:absolute;inset:6%;background-repeat:no-repeat;filter:drop-shadow(0 3px 0 #120a3099)}
.k-card.k-gen .k-img,.k-card.k-sum .k-img{inset:0;background-size:cover;filter:none}

.k-strip{position:absolute;z-index:2;left:var(--b);right:var(--b);bottom:var(--b);height:21%;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 5% 0 calc(var(--cp) * .7);background:var(--ink2);clip-path:polygon(0 0,100% 0,100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-card .k-rar{height:82%;width:auto;margin-left:-6%;filter:none}
.k-card .k-lv{margin-left:auto;font:400 calc(var(--w,84px) * .19)/1 var(--font-num);color:#ffe066;letter-spacing:.02em;white-space:nowrap}
.k-card.fill .k-lv{font-size:var(--fs-3)}.k-card.k-l .k-lv{font-size:26px}
.k-card .k-lv i{font:900 10px/1 var(--font-pop);font-style:normal;margin-right:1px;color:#fff}
.k-card .k-el{position:absolute;z-index:3;left:-3px;top:-3px;width:calc(var(--cp) * 1.6);height:calc(var(--cp) * 1.6);min-width:18px;min-height:18px;font-size:0;filter:drop-shadow(2px 2px 0 var(--ink2))}
.k-card .k-st{position:absolute;z-index:3;right:calc(var(--b) + 4%);bottom:26%;display:flex;gap:1px}
.k-card .k-st i{width:11px;height:11px;background:#ffe066;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 78%,20% 100%,30% 60%,0 38%,38% 35%);filter:drop-shadow(0 0 1px var(--ink2))}
.k-card .k-tag{position:absolute;z-index:4;right:-6px;top:-7px;padding:2px 8px;font:900 var(--fs-1)/1.15 var(--font-pop);font-style:normal;color:var(--ink2);white-space:nowrap;transform:rotate(7deg);clip-path:var(--tape-cut);background:var(--tc)}
.k-tag.t-new{--tc:#ff7aa8}.k-tag.t-eq{--tc:#7fe6ff}.k-tag.t-team{--tc:#9dff6b}.k-tag.t-up{--tc:#ffe066}
.k-card .k-name{position:absolute;z-index:2;left:0;right:0;bottom:-20px;font:900 var(--fs-1)/1.2 var(--font-pop);color:#fff;text-align:center;text-shadow:var(--ol-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-card.named{margin-bottom:20px}
.k-card.on .k-mat{background:#ffe066}
.k-card.off .k-img{filter:grayscale(1) brightness(.4)}
.k-card:active{transform:translate(2px,2px)}.k-card:active::before{transform:translate(1px,1px)}
.k-grid{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:var(--sp-2);justify-items:center}
.k-grid>.k-card{width:100%}
/* 卡被挤窄（小卡 / 小屏格子）：黑条里只放等级，品级看板子颜色 */
@container (max-width:76px){.k-rar{display:none}.k-lv{font-size:var(--fs-2) !important}.k-st i{width:9px;height:9px}}

/* ───────── 按钮：斜切贴纸 + 硬投影；主 = 黄、次 = 黑底白边、蓝 = 去别处、红 = 危险 ───────── */
.k-btn{--cp:12px;--bg:#ffe066;--fg:var(--ink2);--ol:var(--ink2);position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);min-width:var(--hit);border:0;padding:0 var(--sp-4);background:none;color:var(--fg);font:900 var(--fs-4)/1.1 var(--font-pop);cursor:pointer;filter:drop-shadow(4px 4px 0 var(--ink2))}
.k-btn::before,.k-btn::after{content:"";position:absolute;z-index:-1;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-btn::before{inset:0;background:var(--ol)}
.k-btn::after{inset:3px;background:linear-gradient(105deg,transparent 0 12%,#ffffff40 12% 16%,transparent 16%),var(--bg)}
.k-btn>span{display:grid;justify-items:center}
.k-btn small{font:800 var(--fs-1)/1.2 var(--font-pop);opacity:.85}
.k-btn.l{min-height:var(--btn-l)}.k-btn.m{min-height:var(--btn-m);font-size:var(--fs-3)}.k-btn.s{--cp:8px;min-height:var(--btn-s);font-size:var(--fs-2);padding:0 var(--sp-3);filter:drop-shadow(3px 3px 0 var(--ink2))}
.k-btn.s>span::before{content:"";position:absolute;inset:-6px -2px}
.k-btn.main{--bg:#ffe066}
.k-btn.sub{--bg:var(--ink2);--fg:#fff;--ol:#fff}
.k-btn.blue{--bg:#5fd4ff}
.k-btn.danger{--bg:#ff4d6a;--fg:#fff}
.k-btn .uic{width:1.5em;height:1.5em;margin:-.3em 0}
.k-btn:active{transform:translate(3px,3px);filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-btn:disabled{--bg:repeating-linear-gradient(-45deg,#8e88a8 0 6px,#a49fbb 6px 12px);--fg:#3b3654;cursor:default}
.k-btn.wide{width:100%}
.k-btns{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:var(--sp-3)}

/* ───────── 页签：一级 = 胶带（选中 = 黄色斜纹警示胶带、歪贴、粉色错位影）；二级 = 图标 + 选中的字贴一截胶带 ───────── */
.k-seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--sp-1);padding:var(--sp-2) var(--sp-1);background:var(--dots),var(--ink2)}
.k-seg button{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);min-height:var(--hit);border:0;background:#9d90c8;color:var(--ink2);opacity:.78;font:900 var(--fs-3)/1 var(--font-pop);clip-path:var(--tape-cut);transform:rotate(1.2deg)}
.k-seg button:nth-child(odd){transform:rotate(-1.4deg)}
.k-seg button .uic{width:28px;height:28px;margin:-4px 0;filter:grayscale(.5)}
.k-seg button[aria-pressed=true]{position:relative;z-index:2;opacity:1;background:var(--tape-y);font-size:var(--fs-4);transform:rotate(-3deg) scale(1.08);filter:drop-shadow(3px 3px 0 #ff3d8f)}
.k-seg button[aria-pressed=true] .uic{filter:none}
.k-tabs{display:grid;grid-template-columns:repeat(var(--n),1fr);padding:var(--sp-1) 0 var(--sp-2);background:var(--dots),var(--ink2);border-bottom:var(--bd-2) solid #000}
.k-tabs button{display:grid;justify-items:center;gap:2px;min-height:52px;padding:var(--sp-1) 0;border:0;background:none;color:#8f84c8;font:900 var(--fs-2)/1 var(--font-pop)}
.k-tabs button .uic{width:28px;height:28px;filter:grayscale(.7) brightness(.75)}
.k-tabs button span{padding:3px 6px;white-space:nowrap}
.k-tabs button[aria-pressed=true]{color:var(--ink2)}
.k-tabs button[aria-pressed=true] .uic{filter:none;transform:rotate(-6deg) scale(1.12)}
.k-tabs button[aria-pressed=true] span{background:var(--tape-y);clip-path:var(--tape-cut);transform:rotate(-3deg)}
.k-tabs button.lk{opacity:.45}

/* ───────── 区块：纸片 + 硬投影 + 胶带标题（压在上边缘）───────── */
.k-sec{position:relative;margin:var(--sp-4) 0 var(--sp-4);padding:var(--sp-5) var(--sp-3) var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.k-sec::after{content:"";position:absolute;right:-3px;top:-3px;width:16px;height:16px;background:linear-gradient(225deg,#1d1140 0 50%,#d9d0ff 50%);border-left:var(--bd-1) solid var(--ink2);border-bottom:var(--bd-1) solid var(--ink2)}
.k-h{position:absolute;left:10px;top:-15px;display:flex;align-items:center;gap:var(--sp-2);margin:0;padding:4px 16px;background:#8dffbe;color:var(--ink2);font:900 var(--fs-3)/1.2 var(--font-pop);clip-path:var(--tape-cut);transform:rotate(-2.5deg)}
.k-h{white-space:nowrap;max-width:calc(100% - 20px)}
.k-hr{position:absolute;right:var(--sp-3);top:6px;font:800 var(--fs-1)/1.3 var(--font-pop);color:#6a5ca8;max-width:45%;text-align:right}
.k-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-3);background:#f1ecff;font:800 var(--fs-2)/1.2 var(--font-pop);clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}
.k-row+.k-row{margin-top:var(--sp-1)}
.k-row>span{display:flex;align-items:center;gap:var(--sp-1);color:#4a3d8c}
.k-row>span .uic{width:22px;height:22px}
.k-row b{display:flex;align-items:center;gap:var(--sp-1);font:400 var(--fs-3)/1 var(--font-num)}
.k-row em{font-style:normal;color:#e0322a}
.k-arr{width:0;height:0;border:6px solid transparent;border-left:8px solid #8a7fb3;border-right:0}

/* ───────── 能量槽：消耗（六边形图标徽章 + 胶带标签 + 持有 / 需要 + 斜切分段槽「够升几次」）───────── */
.k-cost{position:relative;display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-3);align-items:center;padding:var(--sp-3);background:var(--dots),var(--ink2);color:#fff;box-shadow:4px 4px 0 #ff3d8f;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.k-hex{grid-row:span 2;display:grid;place-items:center;width:58px;height:58px;background:linear-gradient(135deg,#ffe066,#ff9a1f);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.k-hex .uic,.k-hex .ico{width:40px;height:40px}
.k-hex .ico.coin{background-size:360px 40px;background-position:-200px 0}
.k-ctop{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.k-ctop em{font:900 var(--fs-1)/1 var(--font-pop);font-style:normal;padding:3px 10px;background:#fffdf7;color:var(--ink2);transform:rotate(-2deg);white-space:nowrap}
.k-ctop b{margin-left:auto;font:400 var(--fs-4)/1 var(--font-num);color:#7dffb0;white-space:nowrap}
.k-ctop b i{font-style:normal;font-size:var(--fs-2);color:#8f84c8}
.k-gauge{position:relative;display:grid;grid-template-columns:repeat(5,1fr) auto;gap:3px;align-items:center;height:16px;transform:skewX(-20deg)}
.k-gauge i{background:#2b1c6c;border:1px solid #000}.k-gauge i.on{background:#01fd99}.k-gauge i.part{background:linear-gradient(90deg,#ffda17 var(--p),#2b1c6c var(--p))}
.k-gauge i{height:16px}
.k-gauge b{min-width:2.6em;margin-left:6px;transform:skewX(20deg);font:400 var(--fs-3)/1 var(--font-num);color:#ffe066;text-align:right}
.k-cost.low .k-ctop b{color:#ff6b6b}.k-cost.low{box-shadow:4px 4px 0 #ff4d6a}

/* ───────── 等级条：斜切分段（SUMO 式）───────── */
.k-lvbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--sp-1) var(--sp-3)}
.k-lvbar>div{position:relative;height:18px;background:#2b1c6c;border:var(--bd-1) solid var(--ink2);transform:skewX(-20deg);overflow:hidden}
.k-lvbar>div i{display:block;height:100%;background:repeating-linear-gradient(90deg,#5fd4ff 0 10px,#3ab8ef 10px 12px)}
.k-lvbar>div::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--ink2) calc(10% - 2px) 10%)}
.k-lvbar span{padding:2px 8px;background:var(--ink2);color:#fff;font:800 var(--fs-2)/1 var(--font-pop);transform:skewX(-10deg)}
.k-lvbar span b{font:400 var(--fs-3)/1 var(--font-num);color:#ffe066}
.k-lvbar small{grid-column:1/-1;font:800 var(--fs-1)/1.4 var(--font-pop);color:#6a5ca8}

/* ───────── 小标签：斜贴纸 ───────── */
.k-chip{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:28px;padding:0 var(--sp-2);border:var(--bd-1) solid var(--ink2);background:#fff;color:var(--ink2);font:900 var(--fs-1)/1 var(--font-pop);transform:skewX(-10deg);box-shadow:2px 2px 0 var(--ink2)}
.k-chip>*{transform:skewX(10deg)}
.k-chip .uic{width:18px;height:18px}.k-chip .el{width:18px;height:18px;font-size:0}
.k-chip.hot{background:#ffe066}.k-chip.dark{background:var(--ink2);color:#fff;border-color:#fff}
.k-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

/* ───────── 列表头 ───────── */
.k-lhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;background:linear-gradient(180deg,#1d1140 70%,#1d114000)}
.k-lhead h3{margin:0;display:flex;align-items:center;gap:var(--sp-2);font:900 var(--fs-4)/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.k-lhead h3 small{padding:2px 8px;background:#fffdf7;color:var(--ink2);font:400 var(--fs-2)/1.2 var(--font-num);text-shadow:none;clip-path:var(--tape-cut);transform:rotate(-3deg)}
.k-lbtns{margin-left:auto;display:flex;gap:var(--sp-3)}
.k-elbar{display:flex;gap:var(--sp-2);margin:var(--sp-1) 0 var(--sp-3)}
.k-elbar button{display:grid;place-items:center;width:50px;height:46px;padding:0;border:0;background:#2b1c6c;color:#cfc4ff;font:900 var(--fs-2)/1 var(--font-pop);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.k-elbar button .el{width:30px;height:30px}
.k-elbar button[aria-pressed=true]{background:#ffe066;color:var(--ink2)}
.k-elbar button[aria-pressed=false] .el{filter:saturate(.5) brightness(.8)}

/* ───────── 一级页标题 ───────── */
.k-ptitle{display:flex;align-items:flex-end;gap:var(--sp-2);margin:var(--sp-2) 0 var(--sp-3)}
.k-ptitle h2{margin:0;font:400 var(--fs-5)/1 var(--font-logo);color:#fff59a;letter-spacing:.04em;text-shadow:var(--ol),4px 4px 0 #ff3d8f;transform:rotate(-2deg)}
.k-ptitle small{font:800 var(--fs-2)/1.2 var(--font-pop);color:#cfc4ff}
.k-ptitle>button{margin-left:auto}

/* ───────── 二级页 / 三级抽屉 ───────── */
.k-p2{position:absolute;inset:0;z-index:var(--z-page2);display:flex;flex-direction:column;background:#1d1140;animation:kIn var(--t-mid) ease-out}
@keyframes kIn{from{transform:translateX(30%);opacity:0}}
.k-p2h{flex:none;display:flex;align-items:center;gap:var(--sp-2);height:64px;padding:0 var(--sp-2);background:var(--dots),var(--ink2);border-bottom:var(--bd-2) solid #000}
.k-p2h b{position:relative;flex:1;min-width:0;font:900 var(--fs-4)/1 var(--font-pop);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:4px}
.k-p2h b::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:5px;background:#ffe066;transform:skewX(-30deg)}
.k-back{flex:none;width:56px;height:56px;border:0;padding:0;background:url(assets/ui_icons.webp) calc(36 * 100% / 69) 0/7000% 100% no-repeat;filter:drop-shadow(2px 2px 0 #000)}
.k-back:active{transform:scale(.92)}
.k-p2b{flex:1;min-height:0;overflow:auto;padding:var(--sp-3) var(--page-x) var(--sp-5);-webkit-overflow-scrolling:touch}
.k-foot{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-3);padding:var(--sp-3) var(--page-x) calc(var(--sp-3) + env(safe-area-inset-bottom,0px));background:var(--dots),var(--ink2);border-top:var(--bd-2) solid #000}
.k-p3{position:absolute;inset:0;z-index:var(--z-page3);display:flex;align-items:flex-end;background:var(--dim);animation:fade var(--t-fast) ease-out}
.k-p3s{display:flex;flex-direction:column;width:100%;height:88%;border-top:var(--bd-3) solid var(--ink2);background:#fffdf7;color:var(--ink2);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%);animation:kUp var(--t-mid) cubic-bezier(.2,.9,.3,1)}
@keyframes kUp{from{transform:translateY(40%)}}
.k-p3h{flex:none;display:flex;align-items:center;height:60px;padding:0 var(--sp-5) 0 var(--sp-4);background:var(--tape-y);border-bottom:var(--bd-2) solid var(--ink2)}
.k-p3h b{flex:1;font:900 var(--fs-4)/1 var(--font-pop)}
.k-x{position:relative;width:var(--hit);height:var(--hit);border:var(--bd-2) solid var(--ink2);background:#fff;box-shadow:3px 3px 0 var(--ink2);clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
.k-x::before,.k-x::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:5px;margin:-2.5px 0 0 -11px;background:var(--ink2);transform:rotate(45deg)}.k-x::after{transform:rotate(-45deg)}
.k-p3b{flex:1;min-height:0;overflow:auto;padding:var(--sp-4) var(--sp-4) var(--sp-5)}
.k-p3 .k-foot{background:#f1ecff;border-top-color:var(--ink2)}

/* ───────── 弹窗：方纸片 + 硬投影；标题 = 黑底黄字斜条（奖励 = 黄色警示胶带）───────── */
.k-pop{position:absolute;inset:0;z-index:var(--z-pop);display:grid;place-items:center;padding:var(--sp-5) var(--sp-4);background:var(--dim);animation:fade var(--t-fast) ease-out}
.k-popc{position:relative;width:min(100%,340px);max-height:80%;display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-4) var(--sp-4);border:var(--bd-3) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:7px 7px 0 var(--ink2);animation:kPop .26s cubic-bezier(.3,1.5,.5,1)}
@keyframes kPop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.k-popc h3{align-self:flex-start;margin:calc(-1 * var(--sp-5) - 14px) 0 var(--sp-3) -8px;padding:6px 16px;background:var(--ink2);color:#ffe066;font:900 var(--fs-4)/1.2 var(--font-pop);transform:skewX(-10deg) rotate(-2deg)}
.k-popb{min-height:0;overflow:auto;font:700 var(--fs-2)/var(--lh-body) var(--font-pop);color:#3b2f73}
.k-popf{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-3);margin-top:var(--sp-4)}
.k-pop.reward .k-popc{background:var(--stripe),#fff7c9}
.k-ribbon{position:absolute;left:50%;top:-24px;padding:8px 30px;background:var(--tape-y);font:400 var(--fs-4)/1 var(--font-logo);color:var(--ink2);white-space:nowrap;clip-path:var(--tape-cut);transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(3px 3px 0 #ff3d8f)}
.k-pop.reward .k-popb .k-grid{margin-top:var(--sp-3)}

/* ───────── 过场：斜切快门 + logo 盖章（11/07 制作人选，替换三道彩条）───────── */
.wipe{position:absolute;inset:0;z-index:95;overflow:hidden;pointer-events:auto}
.wipe .wa,.wipe .wb{position:absolute;inset:0;transition:transform .3s cubic-bezier(.7,0,.3,1)}
.wipe .wa{background:var(--dots),var(--ink2);clip-path:polygon(0 0,72% 0,38% 100%,0 100%);transform:translate(-75%,-30%)}
.wipe .wb{background:radial-gradient(#120a3022 1.5px,transparent 2px) 0 0/9px 9px,#ffe066;clip-path:polygon(72% 0,100% 0,100% 100%,38% 100%);transform:translate(75%,30%)}
.wipe .ws{position:absolute;left:50%;top:-10%;width:22px;height:120%;margin-left:-11px;background:#ff3d8f;transform:rotate(19deg) scaleY(0);transition:transform .18s .22s ease-out;box-shadow:0 0 0 4px var(--ink2)}
.wipe .wl{position:absolute;left:50%;top:50%;width:min(78%,420px);transform:translate(-50%,-50%) rotate(-6deg) scale(2.2);opacity:0;transition:transform .22s .26s cubic-bezier(.3,1.6,.5,1),opacity .1s .26s;filter:drop-shadow(5px 5px 0 var(--ink2))}
.wipe.in .wa,.wipe.in .wb{transform:none}
.wipe.in .ws{transform:rotate(19deg) scaleY(1)}
.wipe.in .wl{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
.wipe.out .wa{transform:translate(-80%,0);transition-duration:.32s}
.wipe.out .wb{transform:translate(80%,0);transition-duration:.32s}
.wipe.out .ws,.wipe.out .wl{opacity:0;transition:opacity .12s}

/* ───────── UI 规范样张专用（views/uikit.js）───────── */
.uk .k-p2b{padding:0;background:#1d1140}
.uk .uk-body{padding:var(--sp-3) var(--page-x) var(--sp-5)}
.uk-fs{display:grid;grid-template-columns:44px 1fr;align-items:baseline;gap:0 var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px dashed #d9d0ff}
.uk-fs code,.uk-sp code,.uk-rd code{font:800 var(--fs-1)/1 ui-monospace,monospace;color:#8a7fb3}
.uk-fs span{font-family:var(--font-pop);font-weight:900;line-height:1.1}
.uk-fs small{grid-column:2;font:700 var(--fs-1)/1.4 var(--font-pop);color:#6a5ca8}
.uk-sp{display:flex;align-items:center;gap:var(--sp-2);min-height:28px}.uk-sp i{height:18px;background:var(--pnk);border:1px solid var(--ink)}.uk-sp small{font:700 var(--fs-1)/1 var(--font-pop);color:#4a3d8c}
.uk-rds{display:flex;gap:var(--sp-2)}.uk-rd{flex:1;display:grid;place-items:center;height:64px;border:solid var(--ink2);background:#f1ecff;box-shadow:4px 4px 0 var(--ink2)}
.uk-p{margin:var(--sp-2) 0 0;font:700 var(--fs-1)/1.5 var(--font-pop);color:#6a5ca8}.uk-p.w{color:#cfc4ff}
.uk-ol{margin:0;padding-left:1.4em;font:700 var(--fs-2)/1.6 var(--font-pop)}
.uk-rars{display:flex;align-items:center;justify-content:space-around;padding:var(--sp-2);background:var(--dots),var(--ink2)}.uk-big{height:44px}
.uk-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-3);padding:var(--sp-4) var(--sp-3);background:var(--dots),var(--ink2)}
.uk-col{display:flex;gap:var(--sp-2)}
.uk-btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:var(--sp-2) 0 var(--sp-2)}
.uk-dark{margin:0 0 var(--sp-4);color:#fff}
.uk-flow{display:flex;align-items:center;justify-content:space-between;margin:0 0 var(--sp-4);padding:var(--sp-3);background:var(--dots),var(--ink2)}
.uk-flow span{padding:var(--sp-1) var(--sp-3);background:var(--tape-y);clip-path:var(--tape-cut);font:900 var(--fs-2)/1 var(--font-pop);color:var(--ink)}
.uk-flow span:last-child{background:var(--pnk);color:#fff}
.uk-flow i{flex:1;height:3px;margin:0 var(--sp-1);background:#8a7fb3}
.uk-lv{margin:0 0 var(--sp-4);padding:var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.uk-lvh{display:grid;gap:2px;margin-bottom:var(--sp-2)}.uk-lvh b{font:900 var(--fs-3)/1.2 var(--font-pop)}.uk-lvh small{font:700 var(--fs-1)/1.4 var(--font-pop);color:#6a5ca8}
.uk-lv ul{margin:0 0 var(--sp-2);padding-left:1.2em;font:700 var(--fs-2)/1.55 var(--font-pop)}
.uk-map p{margin:0 0 var(--sp-2);font:700 var(--fs-2)/1.55 var(--font-pop)}
.uk-sum{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-3) 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.uk-sum small{display:block;font:800 var(--fs-1)/1 var(--font-pop);color:#6a5ca8}.uk-sum b{font:400 var(--fs-5)/1.1 var(--font-num)}
.uk-tops{margin:0 0 var(--sp-3)}
.uk-wgrid{display:grid;grid-template-columns:1fr 1.55fr;gap:var(--sp-2);align-items:start}
.uk-main{display:grid;gap:var(--sp-1);justify-items:center}.uk-main small{font:900 var(--fs-1)/1 var(--font-pop);color:#fff59a}
.uk-empty{display:grid;place-items:center;border:var(--bd-2) dashed #8a7fb3 !important;background:var(--dots),#2b1c6c;filter:none;color:#8a7fb3;font:900 var(--fs-5)/1 var(--font-pop)}
.uk-gh{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3);background:var(--dots),var(--ink2)}
.uk-gh b{display:block;font:900 var(--fs-5)/1.1 var(--font-pop);text-shadow:var(--ol-s)}.uk-gh small{font:700 var(--fs-1)/1.4 var(--font-pop);color:#cfc4ff}

/* ───────── 11/07 碧蓝式骨架样图（编成页 kb-*、武器详情 kd-*）───────── */
.kb-set{display:flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);background:var(--dots),var(--ink2);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.kb-setn{flex:1;min-width:0;display:grid}.kb-setn b{font:900 var(--fs-3)/1.2 var(--font-pop);color:#ffe066}.kb-setn small{font:700 var(--fs-1)/1.3 var(--font-pop);color:#cfc4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-set .psets{margin:0}
.kb-hero{position:relative;height:200px;margin:0 0 var(--sp-3);border:var(--bd-3) solid var(--ink2);background:radial-gradient(circle at 25% 40%,color-mix(in srgb,var(--ec) 55%,#fff),transparent 60%),repeating-linear-gradient(135deg,#ffffff18 0 3px,transparent 3px 9px),#2b1c6c;box-shadow:6px 6px 0 var(--ink2);overflow:hidden}
.kb-art{position:absolute;left:-6%;top:-10%;height:200%;width:auto;transform:translateX(calc(var(--ax) * -30%));filter:drop-shadow(4px 0 0 var(--ink2))}
.kb-lead{position:absolute;left:8px;top:8px;padding:2px 10px;font:900 var(--fs-1)/1.3 var(--font-pop);font-style:normal;color:var(--ink2);background:var(--tape-y);clip-path:var(--tape-cut);transform:rotate(-4deg)}
.kb-info{position:absolute;right:0;top:0;bottom:0;width:56%;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);background:linear-gradient(100deg,transparent,#120a30e6 18%);}
.kb-nm{display:flex;align-items:center;gap:var(--sp-1);color:#fff}.kb-nm b{font:900 var(--fs-4)/1 var(--font-pop);text-shadow:var(--ol-s)}.kb-nm em{margin-left:auto;font:400 var(--fs-3)/1 var(--font-num);font-style:normal;color:#ffe066}
.kb-nm .k-ri{width:22px;height:22px}
.kb-plate{display:grid;gap:3px;width:100%}
.kb-pr{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-1);min-height:24px;padding:0 var(--sp-2);background:#120a30;border:1px solid #ffffff22;clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px))}
.kb-pr i{font:900 var(--fs-1)/1 var(--font-pop);font-style:normal;color:#cfc4ff;white-space:nowrap}
.kb-pr b{font:400 var(--fs-3)/1 var(--font-num);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-pr.hp b{color:#7dffb0}.kb-pr.atk b{color:#ffb15f}.kb-pr.pw b{color:#ffe066}
.kb-pr.nm{background:#2b1c6c}.kb-pr.nm i{color:#ffe066;font-family:var(--font-num);font-weight:400}.kb-pr.nm b{font:900 var(--fs-1)/1 var(--font-pop)}
.kb-pe .k-chip{font-size:var(--fs-1)}
.kb-info .k-btn.s{align-self:flex-start}
.kb .k-seg{margin:0 0 var(--sp-3)}
.kb-low{padding:var(--sp-3);background:var(--dots),#231748;border:var(--bd-2) solid var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.kb-tape{display:inline-block;margin:0 0 var(--sp-3);padding:3px 16px;font:400 var(--fs-3)/1.2 var(--font-logo);letter-spacing:.12em;color:var(--ink2);background:#8dffbe;clip-path:var(--tape-cut);transform:rotate(-2deg)}

.kb-sumline span{display:grid;gap:2px;color:#fff}.kb-sumline small{font:800 var(--fs-1)/1 var(--font-pop);color:#cfc4ff}.kb-sumline b{font:900 var(--fs-3)/1.1 var(--font-pop)}.kb-sumline em{font:800 var(--fs-1)/1.2 var(--font-pop);font-style:normal;color:#7dffb0}

.kb-tot{margin:0 0 var(--sp-3)}.kb-tot .kb-plate{grid-template-columns:1fr 1fr}.kb-tot .kb-pr{min-height:34px}.kb-tot .kb-pr b{font-size:var(--fs-4)}

.kd{display:grid;gap:var(--sp-3)}
.kd-banner{position:relative;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-2);background:var(--stripe),var(--rg,#ffe066);border:var(--bd-3) solid var(--ink2);box-shadow:5px 5px 0 var(--ink2);clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.kd-banner.r-N{--rg:linear-gradient(90deg,#e2e5ec,#8b92a5)}.kd-banner.r-R{--rg:linear-gradient(90deg,#a6f0ff,#1f8ae8)}.kd-banner.r-SR{--rg:linear-gradient(90deg,#e2b8ff,#7a3ad6)}.kd-banner.r-SSR{--rg:linear-gradient(90deg,#ff5fb8,#ffe066,#5ff2ff)}

.kd-num{display:grid;align-content:center;padding:var(--sp-2);background:#120a30}.kd-num .kb-pr{min-height:44px}.kd-num .kb-pr b{font-size:var(--fs-5)}

/* 卡的硬投影用一层同形状的底板（不用 filter：filter 会连卡下面的名字、数值文字一起投影，看起来像重影） */
.k-card::before{content:"";position:absolute;inset:0;transform:translate(var(--sh),var(--sh));background:var(--ink2);clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.k-card.k-empty::before{display:none}

/* ───────── 列表卡（碧蓝式リスト：横向头像 + 贴在下面的黑色信息牌，一张卡是一整块）───────── */
.k-lc{position:relative;display:grid;grid-template-rows:auto auto;min-width:0;padding:0;border:0;background:var(--ink2);color:#fff;text-align:left;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);box-shadow:inset 0 0 0 2px var(--ink2)}

.k-lc.r-N{--rg:linear-gradient(135deg,#e2e5ec,#8b92a5)}.k-lc.r-R{--rg:linear-gradient(135deg,#a6f0ff,#1f8ae8)}.k-lc.r-SR{--rg:linear-gradient(135deg,#e2b8ff,#7a3ad6)}.k-lc.r-SSR{--rg:linear-gradient(135deg,#ff5fb8,#ffe066,#5ff2ff)}
.k-lc-img{position:absolute;inset:0;background-repeat:no-repeat}

.k-lc-team{position:absolute;left:0;top:0;z-index:2;padding:1px 7px 1px 4px;font:900 11px/1.35 var(--font-pop);font-style:normal;color:#fff;background:#e0322a;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.k-lc-rar{position:absolute;right:1px;top:2px;z-index:2;height:17px;width:auto;filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-lc-ic{position:absolute;left:2px;bottom:2px;z-index:2;display:flex;align-items:center;gap:1px}
.k-lc-ic .el{width:20px;height:20px;font-size:0}
.k-lc-role{width:18px;height:18px;filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-lc-info{display:grid;gap:1px;padding:2px 5px 4px}
.k-lc-st{display:flex;justify-content:center;gap:2px;height:9px}
.k-lc-st i{width:9px;height:9px;background:#4a3f7a;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 78%,20% 100%,30% 60%,0 38%,38% 35%)}.k-lc-st i.on{background:#ffe066}
.k-lc-nm{display:flex;align-items:baseline;justify-content:space-between;gap:2px;min-width:0}

.k-lc-nm em{flex:none;font:400 var(--fs-1)/1 var(--font-num);font-style:normal;color:#ffe066}
.k-lc-sub{font:800 11px/1.3 var(--font-pop);color:#cfc4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-lc-sub b{font:400 var(--fs-1)/1 var(--font-num);color:#ffb15f}
.k-lc-sub em{margin-left:3px;font-style:normal;font-weight:900}.k-lc-sub em.up{color:#7dffb0}.k-lc-sub em.down{color:#ff7a7a}
.k-lc:active{transform:translate(1px,1px)}
.k-lc.inteam{opacity:.75}
.mgrid{display:grid !important;grid-template-columns:repeat(4,1fr) !important;gap:var(--sp-2) 6px !important}
/* 列表页头：标题 + 持有数 + 排序 / 筛选 */
.k-lh2{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1) var(--sp-2);margin:0 0 var(--sp-3)}

.k-cnt{font:800 var(--fs-2)/1 var(--font-pop);color:#cfc4ff}
.k-lh2 .k-lbtns{margin-left:auto}
.k-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:4px;border-radius:50%;background:#e0322a;color:#fff;font:400 12px/1 var(--font-num);font-style:normal}
.k-h2{position:static;transform:none;margin:var(--sp-2) 0 var(--sp-2);display:inline-flex}
.k-p3 .k-elbar button{background:#d9d0ff}
.k-lh2{flex-wrap:nowrap}.k-lh2 .k-ptitle h2{font-size:22px}.k-lh2 .k-cnt{white-space:nowrap;font-size:var(--fs-1)}.k-lh2 .k-lbtns{gap:var(--sp-2)}.k-lh2 .k-btn.s{padding:0 var(--sp-2)}
.k-p3 .k-elbar button[aria-pressed=true]{background:#ffe066}.k-p3 .k-elbar button span{color:var(--ink2)}.k-p3 .k-fl{display:none}.k-p3 .k-elbar{flex-wrap:wrap}

/* ───────── 11/07 卡片改版样图（ki = 方图标、kt = 编成竖卡）───────── */
.kc-sw{display:flex;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.kc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-2) 6px}
.kc{display:grid;gap:2px;min-width:0}
.ki,.kt-card{position:relative;display:block;aspect-ratio:1;--rc1:#c9cfdb;--rc2:#6d7488}
.kt-card{aspect-ratio:3/5}
.r-R{--rc1:#a6f0ff;--rc2:#1f8ae8}.r-SR{--rc1:#e2b8ff;--rc2:#7a3ad6}.r-SSR{--rc1:#ffe066;--rc2:#ff5fb8}
.ki-img{position:absolute;inset:0;background-repeat:no-repeat;background-color:#2b1c6c}
.ki .ki-img[style*=weapons]{inset:10%;background-color:transparent}
.ki{background:radial-gradient(circle at 50% 45%,var(--rc1),var(--rc2) 90%)}
.ki.off .ki-img{filter:grayscale(1) brightness(.4)}
.ki-fr{position:absolute;inset:0;pointer-events:none}
/* 边框 1：贴纸边（品级色粗边 + 白色贴纸外圈 + 硬投影） */
.f1 .ki-fr,.f1.ki .ki-fr{box-shadow:inset 0 0 0 3px var(--rc2),inset 0 0 0 5px #120a30}
.f1.ki,.f1 .kt-card{outline:2px solid #fff;outline-offset:0;box-shadow:3px 3px 0 3px #120a30}
.r-SSR.f1 .ki-fr,.f1 .r-SSR .ki-fr{box-shadow:inset 0 0 0 3px #ffe066,inset 0 0 0 5px #120a30}
/* 边框 2：金属边（品级色渐变粗框，SSR 镭射，内侧墨线，四角小铆钉） */
.f2 .ki-fr,.f2.ki .ki-fr{border:4px solid transparent;border-image:linear-gradient(135deg,#fff 0%,var(--rc1) 25%,var(--rc2) 60%,#fff 80%,var(--rc2)) 1;box-shadow:inset 0 0 0 2px #120a30}
.r-SSR.f2 .ki-fr,.f2 .r-SSR .ki-fr{border-image:conic-gradient(from 30deg,#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8) 1}
.f2.ki,.f2 .kt-card{box-shadow:0 0 0 2px #120a30,3px 3px 0 2px #000}
.f2 .ki-fr::before,.f2 .ki-fr::after{content:"";position:absolute;width:5px;height:5px;background:#fff;box-shadow:0 0 0 1px #120a30;top:-2px;left:-2px}.f2 .ki-fr::after{left:auto;right:-2px;top:auto;bottom:-2px}
.ki-rar{position:absolute;right:2px;top:2px;z-index:2;height:22%;width:auto;filter:drop-shadow(1px 1px 0 #120a30)}
.kt-card .ki-rar{height:9%}
.ki-el{position:absolute !important;left:2px;bottom:2px;z-index:2;width:30% !important;height:auto !important;aspect-ratio:1;font-size:0 !important}
.kt-card .ki-el{width:22% !important}
.ki-plus{position:absolute;right:3px;bottom:2px;z-index:2;font:400 13px/1 var(--font-num);color:#ffe066;-webkit-text-stroke:2.5px #120a30;paint-order:stroke fill}
.ki-team{position:absolute;left:0;top:0;z-index:3;padding:1px 6px 1px 3px;font:900 10px/1.35 var(--font-pop);font-style:normal;color:#fff;background:#e0322a;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.ki-cap{display:flex;gap:3px;align-items:baseline;justify-content:center;min-width:0;font:900 var(--fs-1)/1.25 var(--font-pop);color:var(--ink2);white-space:nowrap;overflow:hidden}
.ki-cap em{font:400 11px/1 var(--font-num);font-style:normal;color:#e0322a}
.uk-dark .ki-cap{color:#fff}
.kt-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kt{display:grid;gap:3px;min-width:0}
.kt-role{display:flex;align-items:center;justify-content:center;gap:2px;height:22px;font:900 11px/1 var(--font-pop);color:#fff;background:var(--rc);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);text-shadow:0 1px 0 #0006}
.kt-ri{width:16px;height:16px}
.kt-row{display:flex;align-items:center;justify-content:space-between;gap:2px;height:22px;padding:0 5px;background:#120a30;font:900 11px/1 var(--font-pop);color:#fff}
.kt-row em{font:400 11px/1 var(--font-num);font-style:normal;color:#cfc4ff}.kt-row b{font:400 13px/1 var(--font-num);white-space:nowrap;overflow:hidden}
.kt-row.nm b{font:900 11px/1 var(--font-pop)}
.kt-row.hp i{color:#7dffb0;font-style:normal}.kt-row.hp b{color:#7dffb0}.kt-row.atk i{color:#ffb15f;font-style:normal}.kt-row.atk b{color:#ffb15f}
.kt-sk{display:flex;align-items:center;justify-content:space-between;gap:3px;height:24px;padding:0 6px;background:#5fd4ff;color:#120a30;font:400 11px/1 var(--font-logo);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%)}
.kt-sk b{font:900 10px/1 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ki-cap{display:block;text-align:center;text-overflow:ellipsis}.ki-cap em{margin-right:2px}
/* 边框 3「漫画格」（11/07 制作人参考《我的英雄学院》卡面）：粗黑框 + 右上斜切缺角（黄黑锯齿）、网点底、黑色硬投影；顶部黑条写出场顺序，底部黑条写等级 / 战力；队伍组用粉色网点框 + 笔刷字 */
.kt-no,.kt-lv{display:none}
.f3 .ki-fr,.f3.ki .ki-fr{box-shadow:inset 0 0 0 4px #120a30}
.f3.ki{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);background:radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,radial-gradient(circle at 50% 45%,var(--rc1),var(--rc2) 90%)}
.f3.ki::after{content:"";position:absolute;right:0;top:0;width:15px;height:15px;background:repeating-linear-gradient(-45deg,#ffe066 0 3px,#120a30 3px 6px);clip-path:polygon(0 0,100% 100%,100% 0)}
.f3.ki{filter:drop-shadow(3px 3px 0 #000)}
.f3 .ki-rar{right:auto;left:3px;top:3px;height:22%}
.f3 .ki-team{left:auto;right:0;top:auto;bottom:0;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%);padding:1px 3px 1px 7px}
.kt.f3{gap:0;filter:drop-shadow(4px 4px 0 #000)}
.f3 .kt-card{aspect-ratio:3/4.2;border:5px solid #120a30;border-top-width:18px;background:radial-gradient(#ffffff40 1.2px,transparent 1.8px) 0 0/6px 6px,linear-gradient(160deg,var(--rc1),var(--rc2));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 14px,100% 100%,0 100%);outline:0;box-shadow:none}
.f3 .kt-card::before{content:"";position:absolute;left:30%;right:22px;top:-18px;height:18px;background:repeating-linear-gradient(-60deg,#120a30 0 4px,#ffffff30 4px 6px)}
.f3 .kt-no{display:block;position:absolute;right:16px;top:-17px;z-index:3;font:400 13px/1 var(--font-num);font-style:italic;color:#fff}
.f3 .kt-lv{display:block;position:absolute;right:3px;bottom:2px;z-index:3;font:400 14px/1 var(--font-num);color:#ffe066;-webkit-text-stroke:3px #120a30;paint-order:stroke fill}
.f3 .kt-card .ki-rar{right:auto;left:2px;top:2px;height:10%}
.f3 .kt-card .ki-fr{box-shadow:none}
.f3 .kt-role{clip-path:none;height:20px;border-left:5px solid #120a30;border-right:5px solid #120a30}
.f3 .kt-row{height:21px;border-left:5px solid #120a30;border-right:5px solid #120a30;padding:0 3px}
.f3 .kt-row.nm em{display:none}.f3 .kt-row.nm{justify-content:center}
.f3 .kt-sk{clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));border:0;background:#120a30;color:#5fd4ff;height:22px}
.kt-grp.f3{position:relative;padding:22px 8px 10px;border:4px solid #ff3d8f;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;box-shadow:5px 5px 0 #000}
.kt-grp.f3 .kb-tape{position:absolute;left:-6px;top:-18px;background:none;clip-path:none;transform:rotate(-6deg);font:400 22px/1 var(--font-logo);color:#ff3d8f;-webkit-text-stroke:5px #fff;paint-order:stroke fill;filter:drop-shadow(2px 2px 0 #120a30)}
/* 11/07 制作人：品级右上、属性左下不变；品级靠「框 + 卡底背景」分出档次（漫画格 v2） */
.f3 .ki-rar,.f3 .kt-card .ki-rar{left:auto;right:3px;top:3px}
.f3 .kt-card .ki-rar{right:2px}
.f3 .ki-team{right:auto;left:0;top:0;bottom:auto;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:1px 7px 1px 3px}
.f3.ki::after,.f3 .kt-card::after{left:0;right:auto;top:auto;bottom:0}
.f3.ki{clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
.f3.ki::after{content:"";position:absolute;width:15px;height:15px;clip-path:polygon(0 0,0 100%,100% 100%)}
.kc-grid.c4{grid-template-columns:repeat(4,1fr);margin-bottom:var(--sp-3)}
.kt-lad .kt-card{aspect-ratio:3/4.2}
/* 卡底背景：N 水泥 / R 海报 / SR 霓虹喷漆 / SSR 镭射金箔 */
.f3.ki.r-N,.f3 .kt-card.r-N{background:radial-gradient(#00000022 1px,transparent 1.6px) 0 0/5px 5px,linear-gradient(0deg,#00000014 1px,transparent 1px) 0 0/100% 14px,linear-gradient(160deg,#c9ccd4,#8a8f9c)}
.f3.ki.r-R,.f3 .kt-card.r-R{background:radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,repeating-linear-gradient(120deg,transparent 0 22px,#ffffff22 22px 30px),linear-gradient(160deg,#7fe0ff,#1f78e0)}
.f3.ki.r-SR,.f3 .kt-card.r-SR{background:radial-gradient(circle at 20% 25%,#ff7ad9aa 0 12%,transparent 13%),radial-gradient(circle at 78% 70%,#7fe6ffaa 0 10%,transparent 11%),radial-gradient(#ffffff40 1.2px,transparent 1.8px) 0 0/6px 6px,linear-gradient(160deg,#d59bff,#5a1fb8)}
.f3.ki.r-SSR,.f3 .kt-card.r-SSR{background:radial-gradient(circle at 70% 20%,#fff 0 2%,transparent 3%),radial-gradient(circle at 25% 75%,#fff 0 1.5%,transparent 2.5%),radial-gradient(#ffffff55 1.2px,transparent 1.8px) 0 0/6px 6px,conic-gradient(from var(--ha,200deg) at 40% 40%,#ffe066,#ff7ad9,#7fe6ff,#b07bff,#ffe066)}
.f3.r-SSR,.f3 .r-SSR{animation:kHolo 5s linear infinite}
/* 框：N 纯黑框；R + 蓝胶带角；SR + 紫色铆钉 + 黄黑锯齿；SSR + 金色内线 + 皇冠 + 流光 */
.f3 .r-N .ki-fr,.f3.r-N .ki-fr{box-shadow:inset 0 0 0 4px #120a30}
.f3.ki.r-R::after,.f3 .r-R::after{background:#5fd4ff !important;width:22px !important;height:9px !important;clip-path:none !important;transform:rotate(-35deg) translate(-6px,-2px)}
.f3 .r-R .ki-fr,.f3.r-R .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 6px #5fd4ff80}
.f3 .r-SR .ki-fr,.f3.r-SR .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 6px #c06bff}
.f3 .r-SR .ki-fr::before,.f3.r-SR .ki-fr::before,.f3 .r-SSR .ki-fr::before,.f3.r-SSR .ki-fr::before{content:"";position:absolute;inset:7px;background:radial-gradient(circle,#fff 0 1.6px,#120a30 1.7px 2.6px,transparent 2.7px) 0 0/100% 100% no-repeat;pointer-events:none;
  -webkit-mask:radial-gradient(circle at 0 0,#000 4px,transparent 4.5px),radial-gradient(circle at 100% 100%,#000 4px,transparent 4.5px)}
.f3.ki.r-SR::after,.f3 .r-SR::after{background:repeating-linear-gradient(-45deg,#ffe066 0 3px,#120a30 3px 6px) !important}
.f3 .r-SSR .ki-fr,.f3.r-SSR .ki-fr{box-shadow:inset 0 0 0 4px #120a30,inset 0 0 0 7px #ffd23f,inset 0 0 0 8px #120a30,inset 0 0 14px #fff8}
.f3.ki.r-SSR::after,.f3 .r-SSR::after{background:conic-gradient(#ff5fb8,#ffe066,#5ff2ff,#b07bff,#ff5fb8) !important}
.f3.ki.r-SSR::before,.f3 .kt-card.r-SSR::before{content:"";position:absolute;z-index:3;left:-6px;top:-10px;width:30%;aspect-ratio:1.2;background:url(assets/frame_crown.webp) center/contain no-repeat;transform:rotate(-14deg);filter:drop-shadow(1px 1px 0 #120a30)}
.f3 .kt-card.r-SSR::before{left:-8px;top:-14px;width:28%;height:auto;right:auto;background-color:transparent}
.f3.ki.r-SSR .ki-img,.f3 .r-SSR .ki-img{mask:none}
.f3.ki.r-SSR .ki-fr::after,.f3 .r-SSR .ki-fr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff80 48%,transparent 60%) -150% 0/250% 100% no-repeat;animation:kShine 3.2s ease-in-out infinite}
.f3 .ki-img,.f3.ki .ki-img{background-color:transparent}
/* 11/07 制作人：太板正 → 参考《我英》外框：组框整体微斜 + 双层错位框，卡片上下边斜切（平行四边形），黑色投影也是斜的 */
.kt-grp.f3{transform:rotate(-1.6deg);border:0;padding:26px 10px 12px;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;
  clip-path:polygon(0 3%,100% 0,100% 97%,0 100%);box-shadow:none;outline:0}
.kt-grp.f3::before{content:"";position:absolute;inset:6px;border:4px solid #ff3d8f;clip-path:polygon(0 3%,100% 0,100% 97%,0 100%);pointer-events:none;transform:translate(-4px,3px)}
.kt-grp.f3::after{content:"";position:absolute;inset:10px;border:2px solid #ffffff90;pointer-events:none;transform:translate(5px,-3px)}
.kt-grp.f3 .kt-row4{transform:rotate(1.6deg)}
.kt-grp.f3 .kb-tape{transform:rotate(-8deg) skewX(-12deg);left:4px;top:-4px;z-index:2}
.kt-grp.f3 .uk-p{transform:rotate(1.6deg)}
.f3 .kt-card{clip-path:polygon(0 4%,calc(100% - 22px) 0,100% 14px,100% 100%,0 100%)}
.kt.f3{filter:none;position:relative}
.kt.f3::before{content:"";position:absolute;inset:6px -5px -6px 5px;background:#000;clip-path:polygon(0 4%,100% 0,100% 100%,0 98%);z-index:-1}
.f3 .kt-sk{clip-path:polygon(0 0,100% 0,100% 70%,0 100%);height:26px;padding-bottom:4px}
.f3 .kt-role{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:skewX(-8deg)}
/* 区块和方图标也带一点歪 */
.kc-grid .kc:nth-child(odd) .ki{transform:rotate(-1deg)}.kc-grid .kc:nth-child(even) .ki{transform:rotate(1deg)}
.uk-body .k-sec{transform:rotate(-.6deg);clip-path:polygon(0 1.5%,100% 0,100% 100%,0 98.5%)}
.uk-body .k-sec:nth-of-type(even){transform:rotate(.6deg)}
.uk-body .k-sec{clip-path:none}
.kt-grp.f3{clip-path:none;background:none;padding:40px 12px 14px;isolation:isolate}
.kt-grp.f3::before{inset:0;border:0;transform:none;z-index:-2;background:#ff3d8f;clip-path:polygon(0 18px,100% 0,100% calc(100% - 14px),0 100%)}
.kt-grp.f3::after{inset:5px;border:0;transform:none;z-index:-1;background:radial-gradient(#ff3d8f55 1.4px,transparent 2px) 0 0/7px 7px,#1d1140;clip-path:polygon(0 18px,100% 0,100% calc(100% - 14px),0 100%)}
.kt-grp.f3 .kb-tape{top:-14px;left:2px}
/* 11/07 制作人更正：卡牌本身是正的；斜的是卡后面那块黑色「卡套」（像从卡组里抽出来）——比卡大一圈、上下沿是斜线，顶上写顺序。组框也只是框线斜，内容不转 */
.uk-body .k-sec,.uk-body .k-sec:nth-of-type(even){transform:none}
.kc-grid .kc:nth-child(odd) .ki,.kc-grid .kc:nth-child(even) .ki{transform:none}
.kt-grp.f3,.kt-grp.f3 .kt-row4,.kt-grp.f3 .uk-p{transform:none}
.kt-grp.f3 .kb-tape{transform:rotate(-6deg) skewX(-12deg)}
/* 竖卡：卡面回到长方形；后面的黑卡套是斜的平行四边形，上沿露出 14px 写顺序，下沿包住信息栏 */
.f3 .kt-card{clip-path:none;border-top-width:5px}
.f3 .kt-card::before{display:none}
.kt.f3{padding:20px 0 10px;isolation:isolate}
.kt.f3::before{inset:0 -4px 0 -4px;z-index:-1;background:#120a30;clip-path:polygon(0 10px,100% 0,100% calc(100% - 10px),0 100%);transform:translate(3px,3px);box-shadow:none}
.kt.f3::after{content:"";position:absolute;z-index:-1;inset:0 -4px 0 -4px;clip-path:polygon(0 10px,100% 0,100% 18px,0 28px);background:repeating-linear-gradient(-60deg,#120a30 0 5px,#2b1c6c 5px 8px)}
.f3 .kt-no{right:6px;top:-17px}
.kt-lad .kt.f3,.kt-lad>.kt{padding-top:20px}
/* 方图标：图标是正方形；后面一块斜的黑卡套，左下角露出一截 */
.kc .ki.f3{clip-path:none;transform:none}
.kc:has(.ki.f3){position:relative;isolation:isolate}
.kc:has(.ki.f3)::before{content:"";position:absolute;z-index:-1;left:-3px;right:-3px;top:-4px;aspect-ratio:1;height:auto;background:#120a30;clip-path:polygon(0 8px,100% 0,100% calc(100% - 2px),0 100%);transform:translate(3px,5px)}
.f3.ki::after{width:13px;height:13px}
/* 11/07 制作人：卡套叠在一起没法比较；组框里的紫红网点和黑卡套冲突 → 卡之间留开间距，卡套只比卡宽 2px；组框里改成浅灰网点纸（像参考图），黑卡套更突出 */
.kt-row4{gap:14px}
.kt-lad{gap:14px}
.kc-grid{gap:14px 12px}
.kc-grid.c4{gap:14px 16px}
.kt.f3::before{inset:0 -2px 0 -2px;transform:translate(4px,4px)}
.kt.f3::after{inset:0 -2px 0 -2px}
.kc:has(.ki.f3)::before{left:-2px;right:-2px;transform:translate(4px,4px)}
.kt-grp.f3::after{background:radial-gradient(#120a3022 1.3px,transparent 1.9px) 0 0/7px 7px,#ece8f5}
.kt-grp.f3 .uk-p{color:#4a3d8c}
.kt-grp.f3 .kt-row4{padding:0 4px}

/* ───────── v4 平涂卡（11/07 制作人选：参考街头涂鸦卡 UI）───────── */

  clip-path:polygon(0 6px,100% 0,calc(100% - 2px) 100%,3px calc(100% - 3px));transform:rotate(-2.5deg)}

.c4-pat{position:absolute;inset:0 0 28% 0;background:radial-gradient(var(--pt) 1.2px,transparent 1.8px) 0 0/9px 9px}

.c4-img{position:absolute;inset:0 0 26% 0;background-repeat:no-repeat}
.c4.off .c4-img{filter:brightness(0) opacity(.55)}.c4.off{--pc:#b9b4c6}.c4.off .c4-pat{opacity:.25}
.c4 .ki-rar{position:absolute;right:2px;top:2px;z-index:2;height:15%;width:auto;filter:drop-shadow(1px 1px 0 #120a30)}

.c4 .ki-el{position:absolute !important;left:2px;bottom:calc(26% + 2px);z-index:2;width:26% !important;height:auto !important;aspect-ratio:1;font-size:0 !important}

.c4 .ki-plus{bottom:calc(26% + 2px)}
.c4-band{position:absolute;left:0;right:0;bottom:0;height:26%;display:grid;align-content:center;justify-items:center;gap:1px;background:#2a2340;border-top:3px solid #120a30;padding:0 3px}

.c4-team{position:absolute;left:0;top:0;z-index:3;padding:1px 6px 1px 3px;font:900 10px/1.35 var(--font-pop);font-style:normal;color:#fff;background:#e0322a;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.c4-bang{position:absolute;right:-1px;top:20%;z-index:3;width:18px;height:18px;display:grid;place-items:center;font:900 12px/1 var(--font-pop);font-style:normal;color:#120a30;background:#5ff2ff;border:2px solid #120a30;transform:rotate(45deg)}

.c4-band{height:30%;padding:2px 3px}
.c4-img,.c4-pat{bottom:30% !important}.c4 .ki-el,.c4 .ki-plus{bottom:calc(30% + 2px)}

.c4-band small{font:400 11px/1.1 var(--font-num)}

.c4-5 .c4{aspect-ratio:1/1.45}.c4-5 .c4-band{height:34%}.c4-5 .c4-img,.c4-5 .c4-pat{bottom:34% !important}.c4-5 .ki-el{bottom:calc(34% + 2px)}

.c4.tall .c4-band{height:19%}.c4.tall .c4-img,.c4.tall .c4-pat{bottom:19% !important}.c4.tall .ki-el{bottom:calc(19% + 2px)}
/* 11/07 制作人：卡里不放名字等级（只要美术 + 品级 + 属性）；后面的纸不是纯白，斜也有规律 → 米色带纸纹，固定「右上、左下两个角斜着伸出去，左上、右下贴紧」 */
.c4-band{display:none !important}
.c4-img,.c4-pat{bottom:0 !important}.c4 .ki-el,.c4-5 .ki-el,.c4.tall .ki-el{bottom:2px !important}.c4 .ki-plus{bottom:2px}
.c4{aspect-ratio:1/1.12}.c4-5 .c4{aspect-ratio:1/1.12}.c4.tall{aspect-ratio:3/5}

  background:radial-gradient(#b8a68230 1px,transparent 1.5px) 0 0/4px 4px,#f3e7cc}

/* 底牌 2：撕纸毛边 + 黄胶带 */

  clip-path:polygon(0 3%,6% 0,12% 2%,20% 0,28% 3%,36% 0,46% 2%,56% 0,66% 3%,76% 0,86% 2%,100% 0,98% 8%,100% 16%,97% 26%,100% 36%,98% 48%,100% 60%,97% 72%,100% 84%,98% 94%,100% 100%,88% 98%,78% 100%,66% 97%,54% 100%,42% 98%,30% 100%,18% 97%,8% 100%,0 100%,2% 90%,0 78%,3% 66%,0 54%,2% 42%,0 30%,3% 18%,0 8%);transform:rotate(-3deg)}
.b2 .c4w.on .c4p::after{display:block;inset:auto;right:-14px;top:-8px;width:44px;height:14px;z-index:3;transform:rotate(38deg);background:repeating-linear-gradient(-45deg,#ffe066 0 6px,#ffd21a 6px 12px);clip-path:var(--tape-cut);opacity:.95}

  radial-gradient(circle at 92% 6%,var(--sc) 0 5px,transparent 6px),radial-gradient(circle at 6% 94%,var(--sc) 0 4px,transparent 5px),radial-gradient(circle at 100% 70%,var(--sc) 0 3px,transparent 4px),radial-gradient(circle at 2% 20%,var(--sc) 0 3px,transparent 4px),
  radial-gradient(ellipse 58% 60% at 50% 50%,var(--sc) 0 88%,transparent 92%);filter:url(#none) blur(.3px)}

.b3 .c4w.on .c4p::before{inset:-12px -10px}.b3 .c4w.on .c4p::before{background:radial-gradient(circle at 96% 4%,var(--sc) 0 4px,transparent 5px),radial-gradient(circle at 3% 96%,var(--sc) 0 3px,transparent 4px),radial-gradient(circle at 102% 70%,var(--sc) 0 2.5px,transparent 3.5px),linear-gradient(var(--sc),var(--sc)) center/100% 100% no-repeat;clip-path:polygon(4% 8%,30% 2%,62% 6%,92% 0,98% 30%,100% 62%,96% 94%,64% 100%,30% 96%,6% 100%,0 66%,3% 34%)}
