/* 11/08 制作人 1A：卡片下面的字统一做成「深色名牌」——接在卡片下面的一块墨色牌子，白名字、黄 Lv、浅色属性。
   深色页面和白色弹窗上都一样清楚（以前按深色背景配色，放到白弹窗上第三行浅紫配白底看不见）。对标碧蓝幻想 / 怪物弹珠的名牌 */
.c4-cap{margin-top:0;padding:4px 3px 5px;background:#120a30;gap:2px;box-shadow:3px 3px 0 #00000055}
.c4w.on .c4-cap{margin-top:6px}
.c4-cap b,.k-p3 .c4-cap b,.scrim:not(.full) .c4-cap b{color:#fff;font-size:14px}
.c4-cap em,.k-p3 .c4-cap em,.scrim:not(.full) .c4-cap em{color:#ffe066;font-size:12px}
.c4-cap small,.c4-cap i,.k-p3 .c4-cap small,.k-p3 .c4-cap i{color:#e6deff;font-size:12px}
.c4-cap small b,.k-p3 .c4-cap small b{color:#ffb15f;font-size:13px}
.c4-cap small em{color:#7dffb0}.c4-cap small em.down{color:#ff8a8a}
.ov.gacha.spray .gc .c4-cap{margin-top:0}
.c4-cap b,.c4-cap em,.c4-cap small,.c4-cap i{text-shadow:-1px -1px 0 #120a30,1px -1px 0 #120a30,-1px 1px 0 #120a30,1px 1px 0 #120a30,0 2px 0 #120a30}

/* 散花一投 · 旧页面元素换成「街头贴纸」（11/07 UI 规范 v2 全局替换）
   app.css 里各页面原来的按钮、标签、弹窗、抽屉、卡片，统一在这里改成斜切角 + 硬投影 + 胶带；新写的页面直接用 kit.js 的组件，不要再往这里加 */

/* ── 按钮（.btn，旧写法）：和 k-btn 同一套样子 ── */
.btn{--cp:12px;--bf:#ff4d6a;--bo:var(--ink2);border:0 !important;border-radius:0 !important;background:none !important;box-shadow:none !important;isolation:isolate;
  color:#fff;text-shadow:var(--ol-xs);filter:drop-shadow(4px 4px 0 var(--ink2));min-height:var(--hit)}
.btn::before{content:"" !important;position:absolute;inset:0 !important;z-index:-1;border-radius:0 !important;opacity:1 !important;filter:none !important;-webkit-mask-image:none !important;mask-image:none !important;
  background:var(--bo) !important;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.btn::after{content:"";position:absolute;inset:3px;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 0 12%,#ffffff40 12% 16%,transparent 16%),var(--bf);
  clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.btn.gold{--bf:#ffe066;color:var(--ink2);text-shadow:none}
.btn.blue{--bf:#5fd4ff;color:var(--ink2);text-shadow:none}
.btn.green{--bf:#7dffb0;color:var(--ink2);text-shadow:none}
.btn.ghost,.btn.dk{--bf:var(--ink2);--bo:#fff;color:#fff;text-shadow:none}
.btn.warn{--bf:#ff4d6a;color:#fff}
.btn.small{--cp:8px;filter:drop-shadow(3px 3px 0 var(--ink2))}
.btn small{text-shadow:none;color:inherit;opacity:.85;font-size:var(--fs-1)}
.btn.ghost small{color:#cfc4ff}
.btn:active{transform:translate(3px,3px) !important;filter:drop-shadow(1px 1px 0 var(--ink2))}
.btn[disabled],.btn:disabled{--bf:repeating-linear-gradient(-45deg,#8e88a8 0 6px,#a49fbb 6px 12px);color:#3b3654;text-shadow:none;opacity:1;filter:drop-shadow(4px 4px 0 var(--ink2)) grayscale(.2)}

/* ── 标签：.chip（可点）= 斜贴纸；.tag（只看）= 小黑条 ── */
.chip,.k-filt .k-chip{border:var(--bd-1) solid var(--ink2) !important;border-radius:0 !important;background:#fff;color:var(--ink2);box-shadow:2px 2px 0 var(--ink2) !important;transform:skewX(-10deg);min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-2)}
.chip>*,.k-filt .k-chip>*{transform:skewX(10deg)}
.chip[aria-pressed="true"],.k-chip[aria-pressed="true"]{background:#ffe066 !important;transform:skewX(-10deg) translateY(-1px)}
.k-chip{cursor:pointer}
.tag{border-radius:0;border:0;background:var(--ink2);color:#fff;font-size:var(--fs-1);padding:2px 8px;transform:skewX(-10deg)}
.tag.hot{background:#ffe066;color:var(--ink2)}.tag.good{background:#2fd47a;color:var(--ink2);text-shadow:none}.tag.bad{background:#ff4d6a}.tag.big{background:#ff3d8f}
.k-filt{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.k-fl{font:900 var(--fs-1)/1 var(--font-pop);color:#cfc4ff;margin-right:2px}
.k-filt .role-ic{width:22px;height:22px}
.filters{gap:var(--sp-2)}

/* ── 一级页里的旧分页 .seg（地图等）→ 胶带 ── */
.seg{gap:var(--sp-1);padding:var(--sp-2) var(--sp-1);background:var(--dots),var(--ink2)}
.seg-b{border:0 !important;border-radius:0 !important;box-shadow:none !important;background:#9d90c8 !important;color:var(--ink2) !important;text-shadow:none !important;opacity:.78;clip-path:var(--tape-cut);transform:rotate(1.2deg)}
.seg-b[aria-pressed="true"]{opacity:1;background:var(--tape-y) !important;transform:rotate(-3deg) scale(1.06);filter:drop-shadow(3px 3px 0 #ff3d8f)}

/* ── 二级页（详情 .sheet.dp）：黑色网点顶栏 + 方角数值牌 ── */
.sheet.dp{background:#1d1140}
.dp-top.k-p2h{height:64px}
.dp-top.k-p2h b{font-size:var(--fs-4)}
.dp-stats div{border-radius:0 !important;border:0 !important;background:var(--dots),var(--ink2) !important;box-shadow:3px 3px 0 #000 !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.dp-stats span{font-size:var(--fs-1) !important;color:#cfc4ff !important}
.dp-body{padding-top:var(--sp-4)}
.dp-body .k-sec,.dp-card{margin-top:var(--sp-5)}
.dp-card{border-radius:0 !important;border:var(--bd-2) solid var(--ink2) !important;background:#fffdf7 !important;box-shadow:5px 5px 0 var(--ink2) !important}
.k-tip{margin:0 0 var(--sp-3);font:700 var(--fs-2)/1.5 var(--font-pop);color:#4a3d8c}
.k-rows{display:grid;gap:var(--sp-1);margin:var(--sp-3) 0}
.k-sec .k-cost,.k-sec .k-lvbar{margin:var(--sp-3) 0}
.k-sec .k-btns{margin-top:var(--sp-4)}
.k-row.low b{color:#e0322a}
.dp-note{font-size:var(--fs-1) !important;line-height:1.5}
.dp-foot.k-foot{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row}
.dp-foot.k-foot .wide,.dp-foot.k-foot .dp-state{grid-column:1/-1}
.dp-state{border-radius:0 !important;transform:skewX(-8deg)}

/* ── 三级抽屉（旧的 .scrim > .sheet.pop）：方纸片 + 斜切 + 黄色斜纹标题 ── */
.scrim:not(.full)>.sheet{border-radius:0 !important;border:0 !important;border-top:var(--bd-3) solid var(--ink2) !important;background:#fffdf7 !important;color:var(--ink2);box-shadow:none !important;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
.scrim:not(.full)>.sheet .sh-title{margin:-16px -12px var(--sp-3);padding:var(--sp-3) 60px var(--sp-3) var(--sp-4);background:var(--tape-y);border-bottom:var(--bd-2) solid var(--ink2)}
.scrim:not(.full)>.sheet .sh-title b{color:var(--ink2);text-shadow:none;font-size:var(--fs-4)}
.scrim:not(.full)>.sheet .sh-title small{color:#5a4a00;font-size:var(--fs-1)}
.scrim:not(.full)>.sheet .sh-tip{color:#4a3d8c;font-size:var(--fs-2)}
.sheet .close{border-radius:0 !important;background:#fff !important;color:var(--ink2) !important;text-shadow:none !important;box-shadow:3px 3px 0 var(--ink2) !important;clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
.sheet .sh-foot{gap:var(--sp-3)}

/* ── 弹窗 .ov .pnl（设置、暂停、反馈、说明…）：方角 + 硬投影，标题已经是胶带 ── */
.pnl{border-radius:0 !important;border:var(--bd-3) solid var(--ink2) !important;box-shadow:7px 7px 0 var(--ink2) !important;background:var(--dots),#231748 !important}
.pnl .btn,.pnl-btns .btn{border-radius:0}
.pnl .setopt{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.pnl .setlbl{font-size:var(--fs-2) !important}

/* ── 物品卡在旧网格里 ── */
.mgrid{gap:var(--sp-3) var(--sp-2) !important}
.k-card.capped{margin-bottom:40px}
.k-cap{position:absolute;z-index:2;left:-2px;right:-2px;bottom:-38px;display:grid;justify-items:center;gap:1px;line-height:1.2;text-align:center;pointer-events:none}
.k-cap b{max-width:100%;font:900 var(--fs-1)/1.25 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-cap i{font:800 var(--fs-1)/1.25 var(--font-pop);font-style:normal;color:#cfc4ff;white-space:nowrap}
.k-cap em{margin-left:3px;font-style:normal;font-weight:900}.k-cap em.up{color:#7dffb0}.k-cap em.down{color:#ff7a7a}.k-cap em.eq{color:#cfc4ff}
.k-p3 .k-cap b,.scrim:not(.full) .k-cap b{color:var(--ink2);text-shadow:none}.k-p3 .k-cap i,.scrim:not(.full) .k-cap i{color:#4a3d8c}
.k-card .k-role{position:absolute;z-index:3;left:-2px;top:calc(var(--cp) * 1.6 + 2px);width:calc(var(--cp) * 1.5);min-width:18px;height:auto;filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-card.locked .k-mat::after{filter:grayscale(1) brightness(.7)}
.k-empty{display:grid !important;place-items:center;background:var(--dots),#2b1c6c;border:var(--bd-2) dashed #8a7fb3 !important;color:#8a7fb3;font:900 var(--fs-4)/1 var(--font-pop);filter:none !important}
.k-empty span{font-size:var(--fs-2)}

/* ── 编成 · 装备盘页 ── */
.kw-sum{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:var(--sp-3) 0;padding:var(--sp-2) var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.kw-sum small{display:block;font:800 var(--fs-1)/1 var(--font-pop);color:#6a5ca8}.kw-sum b{font:400 var(--fs-5)/1.1 var(--font-num)}
.kw-how{display:flex;align-items:center;gap:var(--sp-1);font:800 var(--fs-1)/1.3 var(--font-pop);color:#6a5ca8;text-align:right}
.kw-tops{margin:0 0 var(--sp-3)}
.kw-grid{display:grid;grid-template-columns:1fr 1.55fr;gap:var(--sp-2);align-items:start}
.kw-main{display:grid;gap:var(--sp-1);justify-items:center}.kw-main small{font:900 var(--fs-1)/1 var(--font-pop);color:#fff59a}
.kw-btns{margin:var(--sp-4) 0 var(--sp-2)}
.kw-more{margin-top:var(--sp-5) !important}.kw-more summary{cursor:pointer;list-style:none}.kw-more summary::-webkit-details-marker{display:none}
.kw-p{margin:0 0 var(--sp-2);font:800 var(--fs-2)/1.5 var(--font-pop);color:#4a3d8c}
.kw-inv{margin-top:var(--sp-1)}

/* ── 主页 ── */
.sb .sbi{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:none !important}
.sb>span{border-radius:0;transform:skewX(-10deg);font-size:var(--fs-1)}
.goal{border-radius:0 !important;box-shadow:5px 5px 0 var(--ink2) !important}

/* ── 点击区补到 44：小按钮、可点的贴纸标签看起来 32～36 高，按得到的范围是 44 ── */
.k-btn.s{min-height:var(--hit)}
.k-btn.s::before{inset:4px 0}.k-btn.s::after{inset:7px 3px}
.chip,.k-filt .k-chip{position:relative;isolation:isolate;min-height:var(--hit);border:0 !important;background:none !important;box-shadow:none !important}
.chip::before,.k-filt .k-chip::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:6px;bottom:6px;border:var(--bd-1) solid var(--ink2);background:#fff;box-shadow:2px 2px 0 var(--ink2)}
.chip[aria-pressed="true"]::before,.k-filt .k-chip[aria-pressed="true"]::before{background:#ffe066}
.chip[aria-pressed="true"],.k-filt .k-chip[aria-pressed="true"]{background:none !important}

/* ── 功能开放卡、战力 UP：方纸片 + 硬投影 ── */
.unl-card{border-radius:0 !important;border:var(--bd-3) solid var(--ink2) !important;box-shadow:7px 7px 0 var(--ink2) !important}
.unl-new{border-radius:0 !important;background:var(--tape-y) !important;border:0 !important;clip-path:var(--tape-cut);box-shadow:none !important}
.unl-ic{border-radius:0 !important;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0 !important}
.unl-rew{border-radius:0 !important;transform:skewX(-10deg)}
.powpop{border-radius:0 !important;box-shadow:6px 6px 0 var(--ink2),0 0 30px #ffd23f88 !important;background:var(--dots),#231748 !important}

/* ── 11/07 碧蓝骨架：正式编成页 / 详情页 ── */
.kb{display:block}
.kb-heroBtn{position:absolute;inset:0;width:56%;padding:0;border:0;background:none;cursor:pointer}
.kb-hero.swapping{animation:wobble .6s ease-in-out infinite}.kb-hero.swapsel,.kb-cell.swapsel{outline:4px solid #ffe066;outline-offset:2px}
.kb-cell.swapping .k-card{animation:wobble .6s ease-in-out infinite}
.kb-sumline{width:100%;border:0;cursor:pointer;text-align:left}
.kb-go{margin-left:auto;font-style:normal;color:#ffe066;font-size:var(--fs-3)}
.kb-tip{margin:var(--sp-3) 0 0;font:700 var(--fs-1)/1.5 var(--font-pop);color:#cfc4ff}
.kb .swapbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:0 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);background:#ffe066;color:var(--ink2);font:900 var(--fs-2)/1.3 var(--font-pop)}
.kb-act .k-btn small{font-size:11px}
.kb .kw-more{margin-top:var(--sp-4) !important}
.kd-foot3{display:grid !important;grid-template-columns:none !important;grid-auto-flow:column !important;grid-auto-columns:1fr}
.kd-foot3 .k-btn{padding:0 var(--sp-1);font-size:var(--fs-2)}
.kd-foot3 .tag{display:grid;place-items:center;min-height:var(--btn-m);font-size:var(--fs-1);white-space:normal;text-align:center}
.sheet.dp .kd-banner,.sheet.dp .kd-art,.sheet.dp .kd-look{margin:var(--sp-3) var(--page-x) 0}
.sheet.dp .kd-look{margin-bottom:var(--sp-3)}
.kd-num{display:grid;gap:var(--sp-2)}
.kd-num .k-btn{min-height:40px;font-size:var(--fs-1);padding:0 var(--sp-2)}
.kd-mainNote{font:800 var(--fs-1)/1.4 var(--font-pop);color:#7dffb0}

/* 11/07 制作人：编组一行、加成并进总合行，装备盘整体上移 */
.kb .kb-set{flex-wrap:nowrap;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-2);padding:var(--sp-1) var(--sp-2)}
.kb .kb-setn{flex:none;font:900 var(--fs-3)/1 var(--font-pop);color:#ffe066;white-space:nowrap}
.kb .kb-set .psets{flex:1;min-width:0;margin:0;padding:3px 2px 5px;gap:4px}
.kb .kb-set .pset{flex:0 0 34px;min-width:34px;height:34px;font-size:15px}
.kb .kb-set .pset::before{content:"";position:absolute;inset:-5px -5px}
.kb .kb-hero{height:176px;margin-bottom:var(--sp-2)}
.kb .k-seg{margin-bottom:var(--sp-2)}
.kb-tot.c3 .kb-plate{grid-template-columns:1fr 1fr 1fr}
.kb-tot.c3 .kb-pr{display:grid;justify-content:stretch;align-content:center;gap:2px;min-height:44px;padding:3px 8px}
.kb-tot.c3 .kb-pr b{font-size:var(--fs-3)}
.kb-pr.bon b{font:900 var(--fs-1)/1.25 var(--font-pop);color:#7dffb0;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kb-mrow{display:flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-3)}.kb-mrow .kb-tape{margin:0;flex:none}.kb-mrow small{min-width:0;font:700 var(--fs-1)/1.3 var(--font-pop);color:#cfc4ff}

/* 11/07 制作人：详情页操作按钮钉在底栏；导航按钮挪到顶栏右边；「旧 → 新」三格并排，少滑一屏 */
.dp-top .kd-nav{display:flex;gap:6px;margin-left:auto;flex:none}
.dp-top .kd-nav .k-btn{min-height:36px;padding:0 10px;font-size:var(--fs-1);filter:drop-shadow(2px 2px 0 #000)}
.dp-top .kd-nav .k-btn small{display:none}
.dp-top .kd-nav .k-btn::before{inset:-4px 0}
.dp-top.k-p2h b{flex:1 1 auto}
.kd-foot3.acts{padding-top:var(--sp-3)}
.kd-foot3.acts .k-btn{font-size:var(--fs-3)}
.k-rows.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-1)}
.k-rows.c3 .k-row{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:52px;padding:6px 8px;margin:0}
.k-rows.c3 .k-row>span{font-size:var(--fs-1)}
.k-rows.c3 .k-row b{font-size:var(--fs-2);flex-wrap:wrap}
.dp-body .k-tip{margin-bottom:var(--sp-2)}
.dp-body .k-sec .k-cost{margin:var(--sp-2) 0}

/* ── 11/07 制作人确认：顶栏 / 底栏「街头贴纸」（黑色网点 + 黄黑警示线、斜切头像框和图标底座、战力黄胶带、选中项黄块 + 胶带字、主页粉色六边形）── */
.hd{background:radial-gradient(#ffffff14 1px,transparent 1.6px) 0 0/8px 8px,#120a30 !important;padding:8px 10px 10px !important;border-bottom:3px solid #000 !important}
.hd::after{content:"" !important;left:0 !important;right:0 !important;bottom:-8px !important;height:6px !important;background:repeating-linear-gradient(-45deg,#ffe066 0 10px,#120a30 10px 20px) !important;transform:none !important;filter:none !important}
.lord .head{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:none !important;border:3px solid #ffe066 !important}
.lord .lv::before{border-radius:0 !important;background:#ff3d8f !important;transform:rotate(45deg)}
.lord .pw{margin-left:-6px !important;border:0 !important;border-radius:0 !important;padding:3px 12px 3px 14px !important;background:repeating-linear-gradient(-45deg,#ffe066 0 12px,#ffd21a 12px 24px) !important;color:#120a30 !important;
  clip-path:polygon(2% 10%,6% 0,14% 7%,24% 0,36% 6%,50% 0,64% 6%,76% 0,88% 6%,96% 0,100% 12%,100% 90%,96% 100%,86% 94%,72% 100%,58% 94%,44% 100%,30% 94%,16% 100%,6% 95%,0 88%);transform:rotate(-2deg);text-shadow:none !important;font-size:15px !important}
.lord .pw i{background:#120a30 !important;color:#ffe066 !important;border:0 !important;border-radius:0 !important}
.curs .cur{border-radius:0 !important;border:2px solid #fff !important;background:#120a30 !important;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);height:28px !important}
.curs .cur::after{border-radius:0 !important;background:#7dffb0 !important;color:#120a30 !important;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0 !important;right:2px !important}
.curs .cur span{font-family:"PopNum",var(--font-pop) !important}
#hSet{border-radius:0 !important;box-shadow:none !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));background-color:#2b1c6c !important;filter:drop-shadow(3px 3px 0 #000) !important;width:44px !important;height:44px !important}
.tabs{background:radial-gradient(#ffffff14 1px,transparent 1.6px) 0 0/8px 8px,#120a30 !important;border-top:3px solid #000 !important;padding-top:10px !important}
.tabs::before{content:"" !important;left:0 !important;right:0 !important;top:-9px !important;height:6px !important;background:repeating-linear-gradient(-45deg,#ffe066 0 10px,#120a30 10px 20px) !important;transform:none !important;filter:none !important}
.tab .tico,.tab .tico.thead{border-radius:0 !important;border:0 !important;box-shadow:none !important;background:#2b1c6c !important;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));width:56px !important;height:56px !important}
.tab span{font-size:13px !important;text-shadow:none !important;color:#c3b8f0 !important;padding:2px 8px}
.tab[aria-selected="true"] .tico,.tab[aria-selected="true"] .tico.thead{background:#ffe066 !important;transform:translateY(-8px) rotate(-4deg) scale(1.08) !important}
.tab[aria-selected="true"] span{color:#120a30 !important;background:repeating-linear-gradient(-45deg,#ffe066 0 10px,#ffd21a 10px 20px);clip-path:polygon(2% 10%,6% 0,14% 7%,24% 0,36% 6%,50% 0,64% 6%,76% 0,88% 6%,96% 0,100% 12%,100% 90%,96% 100%,86% 94%,72% 100%,58% 94%,44% 100%,30% 94%,16% 100%,6% 95%,0 88%);transform:rotate(-3deg)}
.tab.mid .tico{width:78px !important;height:78px !important;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%) !important;background:#ff3d8f !important}
.tab.mid[aria-selected="true"] .tico{background:#ffe066 !important;transform:translateY(-6px) scale(1.06) !important}
.tab .dot{border-radius:0 !important;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* ── 11/07 制作人：其余页面统一（圆角已由 corners.css 改方角，这里补硬投影、斜贴纸、胶带）── */
.goal,.promo,.nextbig,.exp,.raid,.dq,.banner,.pickup,.lgc,.chapbtn,.sup-sheet .supr,.rpnl{box-shadow:5px 5px 0 var(--ink2) !important}
.goal .gr em,.exp-prog,.ep-go,.goal .gt,.pe-chip,.sumchip,.up-tag,.supr-tag,.rfirst,.raid-tip,.lg-done{transform:skewX(-10deg)}
.unl-nw:not(.k-btn)::after,.fc-new,.gc .front .new{border-radius:0 !important;border:0 !important;background:#ff3d5f !important;clip-path:var(--tape-cut);padding:1px 7px !important}
.sb>span{background:var(--ink2) !important;border-radius:0 !important}
.gobtn{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));filter:drop-shadow(5px 5px 0 var(--ink2))}
.backbar .back,.chnav button,.chnav .chapbtn{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.k-new{position:absolute;z-index:3;right:-6px;top:-10px;padding:1px 7px;font:900 10px/1.2 var(--font-pop);font-style:normal;color:#fff;background:#ff3d5f;clip-path:var(--tape-cut);transform:rotate(8deg);pointer-events:none}
/* 返回键（过渡版）：原来的箭头贴纸垫一块斜切黑底 + 黄边；模板喷字版箭头等 ChatGPT 出图后替换 */
.k-back,.dp-back.k-back{background:url(assets/ui_icons.webp) calc(36 * 100% / 69) 0/7000% 100% no-repeat,var(--ink2) !important;box-shadow:inset 0 0 0 3px #ffe066;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));filter:none !important}
.backbar .back{background:var(--ink2) !important;color:#ffe066 !important;box-shadow:inset 0 0 0 2px #ffe066 !important;text-shadow:none !important}
/* 返回键：模板喷字箭头贴纸（11/07 ChatGPT 出图，tools/art/make_back.py）；制作人选第 2 款（斜牌 + 粉色喷漆） */
.k-back,.dp-back.k-back{background:url(assets/ui_back2.webp) center/contain no-repeat !important;box-shadow:none !important;clip-path:none !important;filter:drop-shadow(2px 3px 0 #000) !important;width:64px !important}
.backbar .back{background:url(assets/ui_back2.webp) left center/auto 100% no-repeat !important;box-shadow:none !important;color:transparent !important;min-width:56px;min-height:40px}
/* 11/07 审查 P0-1：关卡列表「出击」以前是图片按钮（btn_go.webp），新皮把图擦掉、字又是透明的 → 空粉板。改成普通主按钮 + 字 */
.btn.gob{width:132px;min-height:52px;font-size:22px}
/* 11/07 审查顺带：吸顶返回键的图被 .btn 的底色板（::before / ::after）盖住，成了一块空蓝板 */
.backbar .back::before,.backbar .back::after{display:none !important}
/* 11/07 审查 P1-2：抽屉被关卡列表的吸顶返回条（z 30）压住 → 和全屏层同一级，靠先后顺序叠 */
.scrim{z-index:30}
/* 11/07 审查 P1-4：字号底线统一（UI 规范：正文 12；卡上的标签、角标、小数字 11）。下面这些以前是 9～10.5px，qa_shots 现在按 11 拦 */
.up-own,.tn b,.bchip *,.stat-tbl small,.pw>i,.nextbig small,.nextbig .nb-t,.chapbtn small,.gd-bt small,.gd-plate small,.pk-t small,.promo small,.promo .pt,.rn small,.rn em,.sumchip small,.tn small,.tn,.rs-c em,.rs-d small,.c4-cap small,.c4-team,.k-new,.lkn,.bchip,.skind,.rfirst,.btn small,.rs-stats small,.dp-plate small{font-size:11px !important}
/* 11/07 审查 P1-6：锁的「第 N 关」以前压在页签名字上（底栏读起来是「第1关 / 第1关 / 主页」）→ 挪到图标上，名字照显 */
.tab .lkn,.sb .lkn{bottom:auto;top:36%}
/* 11/07 审查 P2-10：顶栏右边以前挤 2～3 个按钮（规范：最多一个），360 上标题被截成「烟花颜…」→ 导航按钮挪到顶栏下面单独一行，靠右 */
.dp-top:has(.kd-nav){flex-wrap:wrap;row-gap:6px}
.dp-top .kd-nav{order:3;flex-basis:100%;justify-content:flex-end;margin-left:0}
.dp-top.k-p2h:has(.kd-nav){height:auto;min-height:64px;padding-block:6px}
/* 11/07 战斗画面新风格：暂停键改成斜切黑块 + 实色硬阴影（以前是白边圆角块） */
#bPause{border-radius:0 !important;box-shadow:3px 3px 0 #000 !important;background:#120a30 !important;border:2.5px solid #ffd23f !important;clip-path:none;filter:none !important;transform:skewX(-6deg)}
#bPause::before,#bPause::after{display:block !important;content:"";position:absolute;top:11px;width:6px;height:18px;background:#ffd23f;border-radius:0;box-shadow:none}
#bPause::before{left:13px}#bPause::after{right:13px}

/* ───────── 11/08 制作人 2C：白色底板换成三种彩色海报纸（ChatGPT 出图，撕边九宫格）─────────
   用途分工（UI 规范 §纸张）：
   · 旧海报纸（淡奶黄）= 关卡 / 讨伐 / 说明类信息卡：关卡卡、出击准备的关卡卡和新对手、战力、概率、预测
   · 牛皮纸（暖棕）    = 队伍与养成的分区面板：.k-sec（出击队伍、编成各分区）
   · 贴纸纸（淡紫）    = 弹窗、抽屉、角色详情里的技能 / 台词 / 羁绊等说明格
   文字一律墨色，三种纸的中间都很淡，对比度够。黄色标签纸（ui_label_y）仍用于「重点 / 大关」 */
:root{--pp-kraft:url(assets/ui_label_kraft.webp);--pp-poster:url(assets/ui_label_poster.webp);--pp-lilac:url(assets/ui_label_lilac.webp)}
.prep-st,.k-sec,.dp-card,.stage,.pstat,.power,.rates,.gstat,.gpred>div,.scard:not(.supr),.sum-list,.gd-skills>div,.gd-quote,.gd-join,.bond,.sheet .sec,.empty:not(.wc){
  background:none!important;border-style:solid!important;border-width:3px!important;border-color:transparent!important;border-image:var(--pp-poster) 34 fill / 14px / 5px stretch!important;box-shadow:none!important;filter:drop-shadow(3px 4px 0 #00000070);border-radius:0!important}
.k-sec{border-image-source:var(--pp-kraft)!important}
.k-sec::after{display:none}
.scard:not(.supr),.sum-list,.gd-skills>div,.gd-quote,.gd-join,.bond,.sheet .sec,.empty:not(.wc){border-image-source:var(--pp-lilac)!important}
.stage.big,.gd-skills .ssk{border-image-source:url(assets/ui_label_y.webp)!important}
/* 大面积（抽屉、三级页、弹窗）用纸的中间部分铺底，不拉伸撕边 */
.scrim:not(.full)>.sheet,.k-p3s,.k-popc{background:#ecdfff url(assets/ui_tex_lilac.webp) center/cover!important}
/* 牛皮纸上的次要文字加深一点 */
.k-sec small,.k-sec .k-fl{color:#4a2e14}

/* ───────── 11/08 制作人「报纸里刊登的那种设计感」：出击准备页做成街头小报（先只做这一页，满意再推广）─────────
   头版 = 关卡卡（旧海报纸）：报头「散花日报」+ 期号、双线、衬线大标题、白边现场照片 + 图注
   剪报 = 贴在牛皮纸分区上的海报纸片（微微歪、四角胶带）：「今日出场阵容」专栏、「通缉令」
   字：报头 / 标题 / 图注用思源宋体特粗（PaperSerif），其余照旧 */
.np-front{padding-top:10px!important}
.np-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-bottom:5px;border-bottom:5px double #120a30}
.np-logo{font:900 28px/1 "PaperSerif",serif;letter-spacing:3px;color:#120a30}
.np-iss{font:900 11px/1.2 "PaperSerif",serif;color:#5a4630;white-space:nowrap}
.np-hl{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.np-h1{font:900 23px/1.15 "PaperSerif",serif;color:#120a30;letter-spacing:.5px}
.np-hl .prep-no{flex:none}
.np-photo{margin:0 0 8px;padding:5px 5px 4px;background:#fffdf6;border:1.5px solid #120a30;box-shadow:2px 3px 0 #00000040;transform:rotate(-.6deg)}
.np-photo .prep-ban{height:104px;margin:0;padding:0;border:0}
.np-photo .prep-ban::after{background:radial-gradient(circle,#120a3026 1px,transparent 1.4px) 0 0/4px 4px}   /* 网点：像印在报纸上 */
.np-photo figcaption{margin-top:3px;font:900 11px/1.3 "PaperSerif",serif;color:#3b2a1a}
.np-front .prep-row:first-of-type{padding-top:6px;border-top:1px solid #120a3055}
/* 剪报：牛皮纸分区里贴一张海报纸片 */
.prep-team,.prep-new{padding:14px 10px 12px!important}
.np-clip{position:relative;padding:12px 10px 10px;background:#f6e7bf url(assets/ui_tex_poster.webp) center/cover;box-shadow:2px 3px 0 #00000045;transform:rotate(.5deg)}
.np-clip::before,.np-clip::after{content:"";position:absolute;top:-9px;width:58px;height:18px;background:url(assets/ui_tape_y.webp) center/100% 100%;opacity:.92}
.np-clip::before{left:-10px;transform:rotate(-24deg)}.np-clip::after{right:-10px;transform:rotate(22deg)}
.np-colh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;padding:4px 0 3px;border-top:3px solid #120a30;border-bottom:1px solid #120a30}
.np-colh b{font:900 19px/1 "PaperSerif",serif;color:#120a30;letter-spacing:2px}
.np-colh span{font:900 11px/1 "PaperSerif",serif;color:#5a4630}
.np-photos{gap:0!important;margin-top:8px}
.np-ph{padding:0 4px;gap:3px!important}
.np-ph+.np-ph{border-left:1px solid #120a3040}
.np-ph .c4p{padding:3px;background:#fffdf6;border:1.5px solid #120a30}
.np-ph b{max-width:100%;font:900 13px/1.2 "PaperSerif",serif!important;color:#120a30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ph small{font:900 10.5px/1 "PaperSerif",serif!important;color:#5a4630!important}
/* 通缉令 */
.np-wanted{transform:rotate(-.8deg)}
.np-wh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:4px;border-bottom:3px double #120a30}
.np-wh b{font:900 26px/1 "PaperSerif",serif;letter-spacing:8px;color:#c8102e}
.np-wh i{font:400 14px/1 var(--font-num);font-style:normal;color:#120a30;letter-spacing:2px}
.np-wh small{margin-left:auto;font:900 11px/1 "PaperSerif",serif;color:#5a4630}
.np-wanted .prep-nf img{background:#fffdf6;border:1.5px solid #120a30;padding:2px}
.np-wanted .prep-nf b{font-family:"PaperSerif",serif}
.np-stamp{position:absolute;left:22px;bottom:8px;padding:2px 8px;border:3px solid #c8102e;font:900 18px/1 "PaperSerif",serif;letter-spacing:4px;color:#c8102e;transform:rotate(-14deg);opacity:.8;pointer-events:none}
/* 11/08 制作人：详情页右上「回编成 / 编入队伍」太小、「回编成」白边太刺眼 → 和标题同一行、加大到 44 高 15 号字；深色按钮去掉白描边 */
.dp-top:has(.kd-nav){flex-wrap:nowrap}
.dp-top .kd-nav{order:0;flex-basis:auto;margin-left:auto;gap:8px}
.dp-top.k-p2h:has(.kd-nav){height:64px;min-height:64px;padding-block:0}
.dp-top .kd-nav .k-btn{min-height:44px;padding:0 14px;font-size:15px}
.dp-top .kd-nav .k-btn.sub{--bg:#3a2a8e;--fg:#fff;--ol:#120a30}

/* ───────── 11/08 制作人 1A 2A 3A：界面互通（参照碧蓝幻想）───────── */
/* 返回条：除主页外每一页最上面，左返回 + 页名；贴在页顶（滚动时不跑） */
.navbar{position:sticky;top:-12px;z-index:31;display:flex;align-items:center;gap:8px;height:56px;margin:-12px -12px 10px;padding:0 12px 0 6px;background:var(--dots,none),#1b0f3d;border-bottom:3px solid #120a30;box-shadow:0 3px 0 #00000055}
.navbar .nb-back{width:52px;height:52px}
.navbar b{font:900 20px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.navbar small{margin-left:auto;font:900 12px/1 var(--font-pop);color:#ffe066}
.backbar .back{display:none}.backbar{position:static;margin-top:0}   /* 远征子页自己的返回键交给返回条 */
/* 编成 · 涂鸦手分页 */
.kb-gen .k-seg{margin-bottom:10px}
/* 菜单页 */
.menu{display:grid;gap:12px;padding:4px 2px 20px}
.mn-i{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 14px;border:3px solid #120a30;background:#2e1f72;color:#fff;text-align:left;box-shadow:4px 5px 0 #00000080;cursor:pointer}
.mn-i:active{transform:translate(2px,2px);box-shadow:2px 3px 0 #00000080}
.mn-ic{flex:none;display:grid;place-items:center;width:52px;height:52px}.mn-ic .uic{width:48px;height:48px}
.mn-i span{flex:1;display:grid;gap:4px;min-width:0}
.mn-i b{font:900 18px/1.1 var(--font-pop)}
.mn-i small{font:800 12px/1.3 var(--font-pop);color:#cfc4ff}
.mn-go{font:900 26px/1 var(--font-pop);font-style:normal;color:#ffe066}
/* 主页 · 当前队伍卡（替代以前的装备盘 / 队伍 / 壁画兽三个入口） */
.home .hteam{position:absolute;right:8px;bottom:250px;z-index:3;width:132px;display:grid;gap:4px;padding:6px 6px 7px;border:3px solid #120a30;background:#2e1f72;color:#fff;box-shadow:3px 4px 0 #00000080;cursor:pointer}
.hteam .ht-t{justify-self:start;padding:1px 8px;font:900 12px/1.3 var(--font-pop);font-style:normal;color:#120a30;background:#ffe066;transform:skewX(-10deg)}
.hteam .ht-h{display:flex;justify-content:center}
.hteam .ht-h .head{width:30px;height:30px;border:2px solid #120a30;border-radius:50%;margin-left:-8px;box-shadow:1px 1px 0 #000}
.hteam .ht-h .head:first-child{margin-left:0;width:34px;height:34px}
.hteam .ht-b{display:flex;align-items:center;justify-content:space-between;gap:4px}
.hteam .ht-b img{width:42px;height:30px;object-fit:cover;border:2px solid #120a30}
.hteam .ht-b b{display:grid;justify-items:end;font:400 17px/1 var(--font-num);color:#ffe066}.hteam .ht-b b i{font:900 10px/1 var(--font-pop);font-style:normal;color:#cfc4ff}
/* 编成 4 个分页时字和图标收小，不换行 */
.k-seg[style*="--n:4"] button{gap:2px;padding:0 2px;font-size:15px;white-space:nowrap}
.k-seg[style*="--n:4"] button[aria-pressed=true]{font-size:16px;transform:rotate(-3deg) scale(1.04)}
.k-seg[style*="--n:4"] button .uic{width:22px;height:22px}
@media (max-width:380px){.k-seg[style*="--n:4"] button .uic{display:none}}
/* ───────── 11/08 制作人 1A 2A：换人整页（参照怪物弹珠 / 公主连结）───────── */
.k-p2.pickp{background:linear-gradient(180deg,#160d3366,#160d3300 18%,#160d3300 80%,#160d3399),url(assets/bg_wall.webp) center top/cover,#1b1258}
.pickp .k-p2b{padding-top:0}
.pk-help{flex:none;width:40px;height:40px;margin-left:auto;border:3px solid #120a30;border-radius:50%;background:#ffe066;font:900 20px/1 var(--font-pop);color:#120a30;box-shadow:2px 2px 0 #000}
/* 顶上固定当前队伍 */
.pk-team{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 calc(-1 * var(--page-x)) 8px;padding:10px var(--page-x) 10px;background:#1b0f3df0;border-bottom:3px solid #120a30;box-shadow:0 3px 0 #00000055}
.pk-slot{position:relative;display:grid;grid-template-rows:auto auto;gap:2px;padding:7px 7px 4px;border:0;background:none;color:#fff;cursor:pointer}
.pk-slot::after{content:"";position:absolute;inset:0 0 18px;pointer-events:none;border-style:solid;border-width:12px;border-image:url(assets/ui_slot.webp) 44 / 12px / 0 stretch}
.pk-slot.on::after{inset:-9px -9px 10px;border-width:22px;border-image:url(assets/ui_slot_on.webp) 70 / 22px / 0 stretch}
.pk-face{display:block;aspect-ratio:1/1;background-color:#241a3e;border:0}
.pk-slot i{position:absolute;left:4px;top:3px;z-index:2;padding:1px 5px;font:400 13px/1.2 var(--font-num);font-style:normal;color:#120a30;background:#ffe066}
.pk-slot b{padding:2px 0 0;max-width:100%;font:900 12px/1.1 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--ol-xs)}
.pk-slot em{display:none}
.pk-slot.on b{color:#ffe066}
/* 换掉谁 + 排序 + 筛选（和涂鸦手一览同样的按钮） */
.pk-bar{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.pk-cur{flex:1;display:flex;align-items:baseline;gap:6px;min-width:0;font:900 13px/1.2 var(--font-pop);color:#cfc4ff}
.pk-cur b{font-size:18px;color:#fff;text-shadow:var(--ol-xs)}
.pk-cur small{font:400 14px/1 var(--font-num);color:#ffe066}
/* 11/08 制作人「筛选抽屉满屏紫色」：三级抽屉按内容决定高度（最高 88%），内容少的筛选只占下面一小块 */
.k-p3s{height:auto!important;max-height:88%}

/* ───────── 11/08 制作人定稿（视觉契约 · 换人页 A 喷漆贴纸风）：列表卡 = 多角形模切贴纸框 + 颜料团名牌 ─────────
   素材：ui_frame_{ssr,sr,r,lock}（空心框，九宫格拉伸，角上的皇冠 / 滴落不变形）、ui_plate_{属性}（名牌颜料团）
   卡里角色身后统一暗底（不按稀有度变色）；稀有度看框；属性看名牌颜色 */
.c4w:has(>.c4-cap){position:relative;isolation:isolate;padding:6px 6px 5px;background:none;border:0;box-shadow:none}
.c4w:has(>.c4-cap)::after{content:"";display:block!important;background:none!important;clip-path:none!important;transform:none!important;box-shadow:none!important;position:absolute;inset:-3px -3px -7px;z-index:8;pointer-events:none;border-style:solid;border-width:17px;border-image:url(assets/ui_frame_r.webp) 52 / 17px / 0 stretch}
.c4w.cr-SSR:has(>.c4-cap)::after{inset:-7px -7px -9px;border-width:22px;border-image:url(assets/ui_frame_ssr.webp) 64 / 22px / 0 stretch}
.c4w.cr-SR:has(>.c4-cap)::after{border-image-source:url(assets/ui_frame_sr.webp)}
.c4w.cr-N:has(>.c4-cap)::after,.c4w.locked:has(>.c4-cap)::after{border-image-source:url(assets/ui_frame_lock.webp)}
.c4w:has(>.c4-cap)::before{content:"";display:block!important;position:absolute;inset:2px 2px 0;transform:none;clip-path:none;box-shadow:none;z-index:-1;background:radial-gradient(#ffffff10 1px,transparent 1.5px) 0 0/6px 6px,#241a3e}   /* 卡里统一暗底 */
.c4w:has(>.c4-cap) .c4{border:0!important;border-radius:0;box-shadow:none!important;background:transparent!important;overflow:visible}
.c4w:has(>.c4-cap) .c4-pat{display:none}
.c4w:has(>.c4-cap) .c4p::before,.c4w:has(>.c4-cap) .c4p::after{display:none!important}
/* 名牌：颜料团压在立绘下沿 */
.c4w:has(>.c4-cap) .c4-cap{position:relative;z-index:6;margin:-14px -3px 0!important;padding:7px 6px 11px!important;background:url(assets/ui_plate_lock.webp) center/100% 100% no-repeat!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.c4w.ce-huo:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_huo.webp)!important}
.c4w.ce-shui:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_shui.webp)!important}
.c4w.ce-mu:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_mu.webp)!important}
.c4w.ce-jin:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_jin.webp)!important}
.c4w.ce-tu:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_tu.webp)!important}
.c4w.locked:has(>.c4-cap) .c4-cap{background-image:url(assets/ui_plate_lock.webp)!important}
.c4w:has(>.c4-cap) .c4-cap b{color:#fff!important;font-size:14px}
.c4w:has(>.c4-cap) .c4-cap em{color:#fff!important}
.c4w:has(>.c4-cap) .c4-cap small{color:#fff!important}.c4w:has(>.c4-cap) .c4-cap small b{color:#ffe066!important}
/* 编成中 / 选中：整张卡外面一圈黄光（不再垫纸） */
.c4w.on:has(>.c4-cap){border:0;box-shadow:none;filter:drop-shadow(0 0 5px #ffe066cc)}
.c4w.on:has(>.c4-cap) .c4-cap{background-color:transparent}
.c4w.inteam:has(>.c4-cap){opacity:.8}
/* 名牌两行：名字一行，Lv 和攻击并排一行（和定稿一样，名牌不会太高） */
.c4w:has(>.c4-cap) .c4-cap{display:flex!important;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 6px}
.c4w:has(>.c4-cap) .c4-cap>b{flex-basis:100%;text-align:center;line-height:1.15}
.c4w:has(>.c4-cap) .c4-cap>em,.c4w:has(>.c4-cap) .c4-cap>small,.c4w:has(>.c4-cap) .c4-cap>i{font-size:11.5px!important;line-height:1.2}

/* ───────── 视觉契约第 4 条：三区轻分区（展示区稍亮 / 黄黑细胶带 / 列表区稍暗 / 操作区暗横条）───────── */
.zone-show{background:radial-gradient(#ffffff0d 1px,transparent 1.5px) 0 0/6px 6px,linear-gradient(180deg,#4a3596e6,#35247ed9)!important;border-bottom:0!important;box-shadow:none!important;padding-bottom:12px!important}
.zone-show::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffd21a 0 8px,#120a30 8px 16px)}
.zone-list{margin:14px 0 6px;padding:10px 8px 14px;border-radius:10px;background:#0b061ca6;box-shadow:inset 0 2px 0 #00000066}
.zone-list .pk-bar{margin-top:0}
/* 操作区 */
.k-ab{display:flex;align-items:center;gap:6px;width:100%}
.k-ab-l{display:flex;gap:4px;flex:none}
.k-ab-i{display:grid;justify-items:center;gap:1px;width:56px;padding:0;border:0;background:none;color:#fff;cursor:pointer}
.k-ab-c{display:grid;place-items:center;width:46px;height:48px;background:url(assets/ui_circ.webp) center/contain no-repeat}
.k-ab-c .uic{width:28px;height:28px}
.k-ab-i small{font:900 11px/1.1 var(--font-pop);text-shadow:var(--ol-xs)}
.k-ab-i:active .k-ab-c{transform:translateY(2px)}
.k-ab-main{flex:1;min-width:0;height:62px;display:grid;place-items:center;align-content:center;padding:0 18px 6px;border:0;background:url(assets/ui_main.webp) center/100% 100% no-repeat;color:#120a30;cursor:pointer;filter:drop-shadow(0 2px 0 #00000055)}
.k-ab-main b{font:900 20px/1 var(--font-pop);letter-spacing:1px}
.k-ab-main small{font:800 11px/1.2 var(--font-pop)}
.k-ab-main:active{transform:translateY(3px);filter:none}
.k-foot:has(.k-ab){display:block;background:#0b061cd9;border-top:2px solid #ffffff55}
/* 列表卡：立绘区再高一点（和定稿比例接近）；未获得的 SSR 不用大框 */
.c4w:has(>.c4-cap) .c4{aspect-ratio:1/1.22}
.c4w.locked:has(>.c4-cap)::after{inset:-3px -3px -7px;border-width:17px;border-image:url(assets/ui_frame_lock.webp) 52 / 17px / 0 stretch}
/* 换掉谁：放在展示区（队伍下面一条白色贴纸条）；列表区的排序 / 筛选靠右 */
.zone-show .pk-cur{grid-column:1/-1;justify-self:start;margin-top:4px;padding:5px 14px 6px 12px;background:#fff;color:#120a30;clip-path:polygon(0 8%,96% 0,100% 50%,97% 100%,2% 92%);font-size:13px}
.zone-show .pk-cur b{color:#120a30;text-shadow:none}.zone-show .pk-cur small{color:#c4410c;font-size:15px}
.zone-list .pk-bar{justify-content:flex-end}

/* 散花一投 · UI 统一规范 v0.2（11/08 制作人定稿，文档「BLOOM SHOT! UI 统一规范（草案 v0.2）」）
   母版：SWAP 换人页（素材库 gpt_1108_mock_swap_A_edit2）。组件全游戏统一，只按功能区换背景墙和主色调。
   这份文件最后加载：新写 / 改造的界面只用这里的 token 和组件，不再在单个界面里另起样式 */
:root{
  /* 色彩 token（规范 §3） */
  --c-bg:#2a1840; --c-panel:rgba(30,20,48,.85); --c-accent:#ffe600; --c-mag:#ff2ea6; --c-cyan:#2ee6ff; --c-stroke:#111; --c-sticker:#fff;
  /* 字号（规范 §4，390 宽手机） */
  --f-h1:30px; --f-h2:17px; --f-btn:26px; --f-name:14px; --f-stat:11px; --f-tag:11px; --f-body:14px; --f-min:10px;
  /* 间距（规范 §5：只用 4 / 8 / 12 / 16 / 24） */
  --g-1:4px; --g-2:8px; --g-3:12px; --g-4:16px; --g-5:24px; --g-page:12px; --g-panel:12px;
  --card-gx:8px; --card-gy:10px; --rd-panel:12px; --rd-card:6px;
  /* 组件尺寸（规范 §7） */
  --btn-main-h:56px; --btn-circ:50px;
  /* 功能分区（规范 §3.5）：默认 = 角色区紫色水泥墙 */
  --zone-bg:url(assets/bg_wall.webp); --zone-tint:linear-gradient(180deg,#2a184066,#2a184000 25%,#2a184000 75%,#2a1840aa); --zone-c1:#9b5be0; --zone-c2:var(--c-accent); --zone-spray:var(--c-mag);
}
/* 四个功能区：只换背景墙和主色调 */
.z-lobby{--zone-bg:url(assets/title_bg.webp);--zone-tint:linear-gradient(180deg,#3a1a0a33,#3a1a0a00 30%,#2a184000 70%,#2a1840cc);--zone-c1:#ff9a2e;--zone-c2:#ffe600;--zone-spray:#ff7a1a}
.z-char{--zone-bg:url(assets/bg_wall.webp);--zone-c1:#9b5be0;--zone-c2:#ffe600;--zone-spray:var(--c-mag)}
.z-gacha{--zone-bg:url(assets/load_bg4.webp);--zone-tint:linear-gradient(180deg,#ff2ea633,#2a184099 40%,#2a1840cc);--zone-c1:#ff2ea6;--zone-c2:#2ee6ff;--zone-spray:#ff2ea6}
.z-stage{--zone-bg:url(assets/load_bg3.webp);--zone-tint:linear-gradient(180deg,#0c5a8ab3,#0a2a5acc 40%,#081830e0);--zone-c1:#2ee6ff;--zone-c2:#ffffff;--zone-spray:#2ea6ff}
.zone{background:var(--zone-tint),var(--zone-bg) center top/cover,var(--c-bg)}

/* ── H1 页面标题：白字黑描边，后面垫一道分区色喷漆 ── */
.s-h1{position:relative;display:inline-block;margin:0;padding:0 6px;font:900 var(--f-h1)/1 var(--font-pop);color:#fff;letter-spacing:1px;
  text-shadow:-2px -2px 0 var(--c-stroke),2px -2px 0 var(--c-stroke),-2px 2px 0 var(--c-stroke),2px 2px 0 var(--c-stroke),0 4px 0 var(--c-stroke)}
.s-h1::before{content:"";position:absolute;z-index:-1;left:-4px;right:-10px;bottom:-2px;height:42%;background:var(--zone-spray);border-radius:40% 60% 50% 30%/60% 40% 60% 40%;transform:rotate(-2deg);opacity:.9}
/* ── 贴纸标签（排序、筛选、页签）：小号喷漆块，黄 / 绿底黑字 ── */
.s-tag{display:inline-flex;align-items:center;gap:var(--g-1);height:30px;padding:0 var(--g-3);border:2px solid var(--c-stroke);background:var(--c-accent);color:var(--c-stroke);
  font:900 var(--f-h2)/1 var(--font-pop);clip-path:polygon(3% 8%,97% 0,100% 55%,96% 100%,4% 94%,0 45%);box-shadow:none;cursor:pointer}
.s-tag.alt{background:#8dff6a}.s-tag.on{background:#fff}
.s-tag .uic{width:18px;height:18px}
/* ── 说明条（OUT: 影 攻 125）：白色撕纸条 + 黑字 ── */
.s-strip{display:inline-flex;align-items:baseline;gap:var(--g-2);padding:6px var(--g-4) 7px var(--g-3);background:#fff;color:var(--c-stroke);font:900 var(--f-body)/1.1 var(--font-pop);
  clip-path:polygon(0 10%,97% 0,100% 45%,98% 100%,3% 92%)}
.s-strip b{font-size:18px}.s-strip em{font:400 18px/1 var(--font-num);font-style:normal;color:#d41d4f}
/* ── 分隔线：黄黑斜纹警戒胶带 ── */
.s-tape{height:8px;margin:0 calc(-1 * var(--g-page));background:repeating-linear-gradient(-45deg,#ffd21a 0 9px,var(--c-stroke) 9px 18px);box-shadow:0 2px 0 #00000066}
/* ── 面板：深紫半透明 + 细边框，圆角 12，内边距 12 ── */
.s-panel{padding:var(--g-panel);border:1.5px solid #ffffff26;border-radius:var(--rd-panel);background:var(--c-panel);box-shadow:inset 0 2px 0 #00000066}
.s-panel-h{display:flex;justify-content:flex-end;gap:var(--g-2);margin-bottom:var(--g-3)}
/* ── 底栏：左小圆按钮组 + 右大主按钮（主按钮约半屏宽、高 56；小圆按钮 50，白底黑描边） ── */
.k-ab{gap:var(--g-2)}
.k-ab-l{flex:1;justify-content:space-around}
.k-ab-i{width:auto;gap:2px}
.k-ab-c{width:var(--btn-circ);height:var(--btn-circ);border:3px solid var(--c-stroke);border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--c-stroke)}
.k-ab-c .uic{width:30px;height:30px}
.k-ab-i small{font:900 var(--f-tag)/1.1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.k-ab-main{flex:0 0 50%;height:var(--btn-main-h);padding:0 var(--g-4) 4px}
.k-ab-main b{font-size:var(--f-btn);letter-spacing:2px;text-shadow:none}
.k-foot:has(.k-ab){padding:var(--g-2) var(--g-page) calc(var(--g-2) + env(safe-area-inset-bottom,0px))}
/* ── 角色卡（规范 §7）：名牌 ≤ 卡高 28%，名字 14 / 数值 11 一行写完；涨跌放卡图右下角标 ── */
.c4w:has(>.c4-cap) .c4{aspect-ratio:1/1.12}
.c4w:has(>.c4-cap) .c4-cap{margin:-10px -2px 0!important;padding:4px 4px 8px!important;gap:0 4px;background:none!important}
.c4w:has(>.c4-cap) .c4-cap::before{content:"";position:absolute;inset:0;z-index:-1;background:url(assets/ui_plate_lock.webp) center/100% 100% no-repeat;filter:saturate(.72) brightness(1.04)}
.c4w.ce-huo:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_huo.webp)}
.c4w.ce-shui:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_shui.webp)}
.c4w.ce-mu:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_mu.webp)}
.c4w.ce-jin:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_jin.webp)}
.c4w.ce-tu:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_tu.webp)}
.c4w.locked:has(>.c4-cap) .c4-cap::before{background-image:url(assets/ui_plate_lock.webp);filter:none}
.c4w:has(>.c4-cap) .c4-cap>b{font-size:var(--f-name)!important;line-height:1.15}
.c4w:has(>.c4-cap) .c4-cap>em,.c4w:has(>.c4-cap) .c4-cap>small,.c4w:has(>.c4-cap) .c4-cap>i{font-size:var(--f-stat)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.c4w:has(>.c4-cap) .c4-cap small b{font-size:var(--f-stat)!important}
.c4-dl{position:absolute;right:2px;bottom:12px;z-index:5;padding:1px 5px;border:2px solid var(--c-stroke);border-radius:4px;font:400 12px/1.2 var(--font-num);font-style:normal;color:var(--c-stroke);background:#7dffb0}
.c4-dl.down{background:#ff8a8a}.c4-dl.eq{background:#ddd}
/* 选中态：黄色爆炸星外框 + 轻微放大 */
.c4w.sel:has(>.c4-cap){transform:scale(1.04);filter:drop-shadow(0 0 0 #ffe600) drop-shadow(0 0 6px #ffe600)}
.mgrid:has(>.c4w){gap:var(--card-gy) var(--card-gx)}
/* ── 弹窗：深紫面板，标题贴在黄胶带上；主按钮黄色在右，次按钮深色在左 ── */
.s-pop{position:relative;padding:var(--g-5) var(--g-4) var(--g-4);border:3px solid var(--c-stroke);border-radius:var(--rd-panel);background:#1e1430f2;box-shadow:0 0 0 3px #fff,6px 8px 0 3px #00000088;color:#fff}
.s-pop-t{position:absolute;left:var(--g-4);top:-16px;padding:4px var(--g-4);font:900 var(--f-h2)/1 var(--font-pop);color:var(--c-stroke);background:var(--c-accent);border:2px solid var(--c-stroke);transform:rotate(-2deg)}
.s-pop p{margin:0 0 var(--g-4);font:700 var(--f-body)/1.5 var(--font-ui)}
.s-pop-b{display:grid;grid-template-columns:1fr 1fr;gap:var(--g-3)}
.s-btn2{height:48px;border:3px solid var(--c-stroke);background:#3a2a6e;color:#fff;font:900 18px/1 var(--font-pop);clip-path:polygon(2% 6%,98% 0,100% 90%,0 100%)}
.s-btn2.main{background:var(--c-accent);color:var(--c-stroke)}
/* ── 提示（Toast）：深紫胶囊、白字、顶部弹出 ── */
.s-toast{display:inline-block;padding:var(--g-2) var(--g-4);border-radius:999px;background:#1e1430f2;border:2px solid #ffffff40;color:#fff;font:800 var(--f-body)/1.2 var(--font-pop)}
/* 名牌底图交给 ::before（为了降饱和），本体不再铺图 */
.c4w[class*=" ce-"]:has(>.c4-cap) .c4-cap,.c4w.locked:has(>.c4-cap) .c4-cap{background-image:none!important}
/* ── 二级页套用分区背景 + H1 标题（母版：换人页） ── */
.k-p2.zone{background:var(--zone-tint),var(--zone-bg) center top/cover,var(--c-bg)!important}
.k-p2.zone .k-p2h{background:transparent;border-bottom:0}
.k-p2.zone .k-p2h b{flex:none;overflow:visible;padding:0 8px;font:900 var(--f-h1)/1 var(--font-pop);color:#fff;letter-spacing:1px;
  text-shadow:-2px -2px 0 var(--c-stroke),2px -2px 0 var(--c-stroke),-2px 2px 0 var(--c-stroke),2px 2px 0 var(--c-stroke),0 4px 0 var(--c-stroke)}
.k-p2.zone .k-p2h b::after{left:-2px;right:-8px;bottom:-2px;width:auto;height:44%;z-index:-1;background:var(--zone-spray);border-radius:40% 60% 50% 30%/60% 40% 60% 40%;transform:rotate(-2deg);opacity:.9}
.k-p2.zone .k-p2h b{position:relative;isolation:isolate}
.k-p2.zone .pk-help{margin-left:auto}
.k-p2.zone .k-p2b{padding:0 var(--g-page) var(--g-4);scrollbar-width:none}.k-p2.zone .k-p2b::-webkit-scrollbar{display:none}
.k-p2.zone .zone-show{margin:0 calc(-1 * var(--g-page));padding:var(--g-2) var(--g-page) var(--g-3)!important;background:#ffffff0f!important}
.k-p2.zone .zone-show::after{display:none}
.k-p2.zone .zone-list{margin:var(--g-3) 0 0}
.k-p2.zone .pk-out{grid-column:1/-1;justify-self:start;margin-top:var(--g-2)}
.k-p2.zone .k-foot{background:#120a30cc;border-top:1.5px solid #ffffff40}
.s-panel .mgrid{padding:6px 2px 4px!important;gap:calc(var(--card-gy) + 4px) var(--card-gx)!important}   /* 卡框的滴落往下伸 4，纵向多留 4 */
/* ── 样张页 ── */
.specp .sp-zones{display:flex;flex-wrap:wrap;gap:var(--g-2);margin:var(--g-2) 0 var(--g-3)}
.specp .sp-sec{margin-top:var(--g-3)}
.specp .sp-h{margin-bottom:var(--g-3);font-size:var(--f-h2)}
.sp-fs{display:flex;align-items:baseline;justify-content:space-between;gap:var(--g-2);padding:var(--g-1) 0;border-bottom:1px dashed #ffffff26;color:#fff;font-family:var(--font-pop);font-weight:900}
.sp-fs i{font:400 13px/1 var(--font-num);font-style:normal;color:var(--zone-c2)}
.sp-gaps{display:flex;align-items:flex-end;gap:var(--g-4);color:#fff;font:400 12px/1 var(--font-num)}
.sp-gaps span{display:grid;justify-items:center;gap:var(--g-1)}.sp-gaps i{display:block;background:var(--zone-c2)}
.sp-note{margin:var(--g-3) 0 0;font:700 var(--f-body)/1.5 var(--font-pop);color:#d9d0ff}
.sp-pop{padding-top:var(--g-4)}.sp-toast{margin-top:var(--g-4);text-align:center}
.k-p2.zone .zone-show{position:relative!important;top:auto}   /* 半透明的信息区不吸顶（吸顶时下面内容透上来很乱） */

/* 散花一投 · 主界面 v2 + QUEST 入口页 + 颜色特训（11/09 制作人定稿，效果图 gpt_1109_home_mock_v4 / gpt_1109_quest_hub_v2）
   最后加载；只用 spec.css 的 token。主页：左系统功能、右活动展示区 + 当前队伍、中间主将；底栏 5 格，出击在正中间凸起 */

/* ── 顶栏右上角 ≡ 菜单 ── */
.hd #hSet.hmenu{background:#fff !important;clip-path:none !important;border:2.5px solid var(--c-stroke) !important;border-radius:50% !important;width:42px !important;height:42px !important;
  font:900 26px/1 var(--font-pop) !important;color:var(--c-stroke) !important;text-shadow:none !important;filter:none !important;box-shadow:0 0 0 2px #fff,0 3px 0 2px #000a !important;display:grid;place-items:center;padding:0 0 3px}

/* ── 主页 ── */
.home.hv2{position:relative;height:100%;overflow:hidden}
.hv2 .hbg2{position:absolute;inset:0;background:linear-gradient(180deg,#1a0e2a55 0%,#1a0e2a00 22%,#1a0e2a00 62%,#1a0e2acc 100%),url(assets/home_bg_roof.webp) center 38%/cover,var(--c-bg)}
.hv2 .scol.l{position:absolute;left:var(--g-2);top:var(--g-3);z-index:4;display:grid;gap:var(--g-4)}
.hv2 .hero{position:absolute;left:-2%;right:auto;top:auto;bottom:72px;width:60%;height:70%;z-index:2;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;border:0;background:none;padding:0}
.hv2 .hero img{height:100%;max-height:none;max-width:120%;object-fit:contain;object-position:center bottom;pointer-events:auto}
.hv2 .bubble{left:var(--g-3);right:auto;width:56%;top:auto;bottom:46%;z-index:5}

/* 右边一列：轮播横幅 + 两张入口卡 + 当前队伍 */
.hv2 .h2-r{position:absolute;right:var(--g-2);top:var(--g-3);bottom:var(--g-3);z-index:3;width:47%;display:flex;flex-direction:column;gap:var(--g-2)}
.h2-car{position:relative;aspect-ratio:16/10;flex:none}
.h2-sl{position:absolute;inset:0;padding:var(--g-2);border:3px solid #fff;outline:2.5px solid var(--c-stroke);background:#000 center/cover;color:#fff;text-align:left;
  display:flex;flex-direction:column;justify-content:flex-end;gap:2px;opacity:0;pointer-events:none;transition:opacity .45s;
  clip-path:polygon(0 6px,6px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 6px),calc(100% - 6px) 100%,14px 100%,0 calc(100% - 14px))}
.h2-sl.on{opacity:1;pointer-events:auto}
.h2-sl::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#000c);z-index:0}
.h2-sl>*{position:relative;z-index:1}
.h2-sl .h2-tag{align-self:flex-start;margin-bottom:auto;padding:2px var(--g-2);font:900 var(--f-tag)/1.2 var(--font-pop);font-style:normal;color:var(--c-stroke);background:var(--c-accent);transform:skewX(-10deg)}
.h2-sl b{font:900 var(--f-h2)/1.1 var(--font-pop);text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.h2-sl small{font:700 var(--f-min)/1.3 var(--font-pop);color:#ffe9a8}
.h2-sl .dot{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;background:var(--red-2,#ff3b5c);border:2px solid #000}
.h2-dots{position:absolute;left:0;right:0;bottom:-14px;display:flex;justify-content:center;gap:6px}
.h2-dots i{width:9px;height:9px;border-radius:50%;background:#ffffff66;border:1.5px solid #000;cursor:pointer}
.h2-dots i.on{background:var(--c-accent)}
.h2-ent{position:relative;flex:none;height:56px;margin-top:var(--g-1);padding:var(--g-1) var(--g-2);border:2.5px solid #fff;outline:2px solid var(--c-stroke);background:#000 right center/cover;color:#fff;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.h2-car+.h2-ent{margin-top:var(--g-4)}
.h2-ent::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#120a24ee 0,#120a24aa 55%,#120a2422);z-index:0}
.h2-ent>*{position:relative;z-index:1}
.h2-ent b{font:900 var(--f-h2)/1 var(--font-pop);text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.h2-ent small{display:flex;align-items:center;gap:4px;font:700 var(--f-tag)/1.2 var(--font-pop);color:#ffe9a8}
.h2-ent small .el{width:16px;height:16px}
.h2-ent.off{filter:saturate(.3) brightness(.8)}
.h2-lock{display:flex;align-items:center;gap:3px;font:900 var(--f-tag)/1 var(--font-pop);font-style:normal;color:#ddd}
.h2-lock .uic,.qh-info.lk .uic{width:16px;height:16px}
.hv2 .hteam{position:relative;right:auto;bottom:auto;width:auto;margin-top:auto;z-index:3}
.hv2 .hteam .ht-h .head{width:34px;height:34px;margin-left:-6px}
.hv2 .hteam .ht-h .head:first-child{width:38px;height:38px}

/* 左下：主将名牌 + 新手的「下一步」 */
.hv2 .h2-bot{position:absolute;left:var(--g-2);bottom:var(--g-2);z-index:4;width:49%;display:grid;gap:var(--g-2);justify-items:start}
.hv2 .hname{position:static;transform:none}
.h2-goal{display:flex;align-items:center;gap:var(--g-2);max-width:100%;padding:6px var(--g-3) 6px 6px;border:2.5px solid var(--c-stroke);background:var(--c-accent);color:var(--c-stroke);
  font:900 var(--f-tag)/1.25 var(--font-pop);text-align:left;box-shadow:0 0 0 2px #fff,3px 4px 0 2px #0009;animation:h2bob 1.6s ease-in-out infinite}
.h2-goal b{flex:none;padding:2px 6px;background:var(--c-stroke);color:var(--c-accent);font-size:var(--f-min)}
.h2-goal span{font-size:11px}
.h2-goal i{font:900 18px/1 var(--font-pop);font-style:normal}
@keyframes h2bob{50%{transform:translateY(-3px)}}

/* ── 底栏：5 格，出击在正中间 ── */
.tabs{grid-template-columns:1fr 1fr 1.35fr 1fr 1fr !important}
.tab.mid span{color:var(--c-accent) !important;font-size:15px !important}

/* ── QUEST 入口页：三张大卡 ── */
#hub[data-tab="quest"] .panel{background:linear-gradient(180deg,#0c3a6acc,#0a1e3ae6 45%,#081428f2),url(assets/load_bg3.webp) center top/cover,#081428}
.qhub{display:grid;gap:var(--g-5);padding:var(--g-3) var(--g-1) var(--g-5)}
.qh-card{--qc:var(--c-accent);position:relative;min-height:132px;padding:var(--g-3) var(--g-4);border:3px solid var(--qc);outline:3px solid var(--c-stroke);box-shadow:0 0 0 6px #fff,0 0 18px 6px color-mix(in srgb,var(--qc) 45%,transparent);
  background:#000 right center/cover;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:var(--g-1);
  clip-path:polygon(0 12px,12px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 12px),calc(100% - 12px) 100%,22px 100%,0 calc(100% - 22px))}
.qh-card::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000c 0,#0008 45%,#0000 75%),linear-gradient(0deg,#000a,#0000 50%)}
.qh-card>*{position:relative;z-index:1}
.qh-c{--qc:var(--c-cyan)}.qh-m{--qc:var(--c-mag)}
.qh-t{display:flex;flex-direction:column;margin-bottom:auto}
.qh-t i{font:900 12px/1 var(--font-pop);font-style:normal;letter-spacing:2px;color:var(--qc)}
.qh-t b{font:900 var(--f-h1)/1.05 var(--font-pop);text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.qh-sub{font:700 12px/1.3 var(--font-pop);color:#e8e2ff}
.qh-info{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;padding:3px var(--g-2);background:#fff;color:var(--c-stroke);font:900 var(--f-tag)/1.2 var(--font-pop);clip-path:polygon(0 8%,97% 0,100% 60%,96% 100%,3% 92%)}
.qh-info.lk{background:#ddd}
.qh-chip{position:absolute;top:var(--g-3);right:var(--g-3);display:inline-flex;align-items:center;gap:4px;padding:3px var(--g-2);background:var(--c-accent);color:var(--c-stroke);font:900 var(--f-tag)/1 var(--font-pop);transform:rotate(3deg)}
.qh-chip .el{width:20px;height:20px}
.qh-bar{display:block;width:62%;height:7px;border:2px solid #000;background:#0008}
.qh-bar i{display:block;height:100%;background:var(--c-accent)}
.qh-card.off{filter:saturate(.25) brightness(.75)}

/* ── 颜色特训页 ── */
.trp{display:grid;gap:var(--g-4);padding-bottom:var(--g-5)}
.tr-hero{position:relative;height:150px;overflow:hidden;border:3px solid var(--c-cyan);outline:3px solid #000;box-shadow:0 0 0 6px #fff;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.tr-hero img{width:100%;height:100%;object-fit:cover;object-position:70% center}
.tr-el{position:absolute;left:var(--g-3);bottom:var(--g-3);display:flex;align-items:center;gap:var(--g-2);padding:4px var(--g-3) 4px 4px;background:#fff;color:#000;font:900 var(--f-h2)/1 var(--font-pop)}
.tr-el .el{width:30px;height:30px}
.tr-box{display:grid;gap:var(--g-3)}
.tr-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--g-2);font:700 13px/1.2 var(--font-pop);color:#fff}
.tr-row>span:first-child{min-width:64px;color:#bcd6ff}
.tr-row b{font:400 22px/1 var(--font-num)}.tr-row b.ok{color:#8dff6a}.tr-row b.lo{color:#ff6a8a}
.tr-row small{color:#bbb;font-size:11px}
.tr-rw{display:inline-flex;align-items:center;gap:2px;padding:2px var(--g-2) 2px 2px;background:#ffffff1a;border-radius:4px}
.tr-rw .uic{width:24px;height:24px}
.tr-tip{margin:0;font-size:11px;line-height:1.5;color:#c9c2e8}
.tr-week{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--g-2)}
.tr-d{display:grid;justify-items:center;gap:4px;padding:var(--g-2) 0;background:#ffffff12;border:1.5px solid #ffffff22;border-radius:6px;color:#ccc;font:700 var(--f-min)/1 var(--font-pop)}
.tr-d .el{width:26px;height:26px}
.tr-d.on{background:var(--c-accent);color:#000;border-color:#000}
.tr-go{display:grid;justify-items:center;gap:var(--g-2)}
.tr-go small{color:#ffe9a8;font:700 12px/1 var(--font-pop)}
.tr-go .btn{min-width:56%;height:var(--btn-main-h)}
.prep-st.trial{padding:var(--g-3);border:3px solid var(--ec);background:linear-gradient(90deg,#0a1830ee,#0a183088),url(assets/qb_trial.webp) right center/cover;color:#fff}
/* 选中的「出击」：黄底上的字改黑；斜切卡片上的 NEW 小标挪进卡里（不被切角切掉） */
.tab.mid[aria-selected="true"] span{color:var(--c-stroke) !important}
.qh-card.unl-nw::after{top:10px !important;right:26px !important}

/* 散花一投 · 卡框（11/09 制作人语音定稿：角色、武器各两种形状——竖长 + 正方形，各配卡内背景，SSR/SR/R/N 四档）
   素材：fr_{g|w}_{档}（竖长，素材表 gpt_1109_frames_tall）、fq_{g|w}_{档}（方形，gpt_1109_frames_sq）、cb_{g|w}_{档}（卡内背景，gpt_1109_card_bg）
   框图左上多留了装饰（皇冠 / 喷嘴）的位置：竖长框多 14%、方形框多 16%，所以框往左上偏这么多。
   全游戏凡是角色、武器、壁画兽的卡都走 kit.js 的 itemCard，这里一处改全部跟着变；最后加载 */

/* 先把旧的几套卡面（平涂板、剪纸底牌、border-image 框）关掉 */
.c4w::before,.c4w::after,.c4p::before,.c4p::after{content:none!important;display:none!important}
.c4w{position:relative;isolation:isolate;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important}
.c4p{display:block;position:relative;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;clip-path:none!important;overflow:visible!important}
.c4{position:relative!important;display:block;width:100%;height:auto!important;aspect-ratio:1/1.02!important;overflow:visible!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;background:none!important;clip-path:none!important;outline:0!important;transform:none}
.c4.tall{aspect-ratio:1/1.32!important}
.c4 .c4-pat{display:none!important}

/* 卡内背景：贴着框的内圈，切角和框一致 */
.c4 .c4-bg{position:absolute;inset:3.5%;z-index:0;background:url(assets/cb_w_n.webp) center/cover;clip-path:polygon(9% 0,100% 0,100% 91%,91% 100%,0 100%,0 9%)}
.c4.tall .c4-bg{clip-path:polygon(9% 0,100% 0,100% 93%,91% 100%,0 100%,0 7%)}
.c4.k-wep.r-SSR .c4-bg{background-image:url(assets/cb_w_ssr.webp)}.c4.k-wep.r-SR .c4-bg{background-image:url(assets/cb_w_sr.webp)}.c4.k-wep.r-R .c4-bg{background-image:url(assets/cb_w_r.webp)}
.c4.k-gen .c4-bg,.c4.k-sum .c4-bg{background-image:url(assets/cb_g_n.webp)}
.c4.k-gen.r-SSR .c4-bg,.c4.k-sum.r-SSR .c4-bg{background-image:url(assets/cb_g_ssr.webp)}.c4.k-gen.r-SR .c4-bg,.c4.k-sum.r-SR .c4-bg{background-image:url(assets/cb_g_sr.webp)}.c4.k-gen.r-R .c4-bg,.c4.k-sum.r-R .c4-bg{background-image:url(assets/cb_g_r.webp)}

/* 立绘 / 武器图：放在框里面，压住背景、被框盖住边 */
.c4 .c4-img{position:absolute!important;inset:5%!important;z-index:1!important;border-radius:0!important;clip-path:polygon(9% 0,100% 0,100% 91%,91% 100%,0 100%,0 9%);background-repeat:no-repeat}
.c4.k-sum .c4-img{background-size:cover!important}.c4.k-gen .c4-img{background-size:cover}
.c4.tall .c4-img{clip-path:polygon(9% 0,100% 0,100% 93%,91% 100%,0 100%,0 7%)}

/* 框（素材，盖在最上面） */
.c4 .c4-fr{position:absolute;z-index:4;left:-16%;top:-16%;width:116%;height:116%;pointer-events:none;background:url(assets/fq_w_n.webp) 0 0/100% 100% no-repeat}
.c4.tall .c4-fr{left:-14%;top:-14%;width:114%;height:114%;background-image:url(assets/fr_w_n.webp)}
.c4.k-wep.r-SSR .c4-fr{background-image:url(assets/fq_w_ssr.webp)}.c4.k-wep.r-SR .c4-fr{background-image:url(assets/fq_w_sr.webp)}.c4.k-wep.r-R .c4-fr{background-image:url(assets/fq_w_r.webp)}
.c4.tall.k-wep.r-SSR .c4-fr{background-image:url(assets/fr_w_ssr.webp)}.c4.tall.k-wep.r-SR .c4-fr{background-image:url(assets/fr_w_sr.webp)}.c4.tall.k-wep.r-R .c4-fr{background-image:url(assets/fr_w_r.webp)}
.c4.k-gen .c4-fr,.c4.k-sum .c4-fr{background-image:url(assets/fq_g_n.webp)}
.c4.k-gen.r-SSR .c4-fr,.c4.k-sum.r-SSR .c4-fr{background-image:url(assets/fq_g_ssr.webp)}.c4.k-gen.r-SR .c4-fr,.c4.k-sum.r-SR .c4-fr{background-image:url(assets/fq_g_sr.webp)}.c4.k-gen.r-R .c4-fr,.c4.k-sum.r-R .c4-fr{background-image:url(assets/fq_g_r.webp)}
.c4.tall.k-gen .c4-fr,.c4.tall.k-sum .c4-fr{background-image:url(assets/fr_g_n.webp)}
.c4.tall.k-gen.r-SSR .c4-fr,.c4.tall.k-sum.r-SSR .c4-fr{background-image:url(assets/fr_g_ssr.webp)}.c4.tall.k-gen.r-SR .c4-fr,.c4.tall.k-sum.r-SR .c4-fr{background-image:url(assets/fr_g_sr.webp)}.c4.tall.k-gen.r-R .c4-fr,.c4.tall.k-sum.r-R .c4-fr{background-image:url(assets/fr_g_r.webp)}

/* 没获得：N 框 + 立绘剪影 */
.c4.off .c4-fr{background-image:url(assets/fq_g_n.webp)!important;filter:brightness(.7)}
.c4.tall.off .c4-fr{background-image:url(assets/fr_g_n.webp)!important}
.c4.off .c4-img{filter:brightness(0) opacity(.55)!important}
.c4.off .c4-bg{filter:grayscale(1) brightness(.6)}

/* 卡上的小件：都压在框上面 */
.c4 .ki-rar{position:absolute!important;z-index:6!important;top:1%!important;right:2%!important;left:auto!important;width:34%!important;height:auto!important;filter:drop-shadow(1px 1px 0 #000)}
.c4 .ki-el{position:absolute!important;z-index:6!important;left:5%!important;bottom:5%!important;top:auto!important}
.c4 .c4-st,.c4 .c4-team,.c4 .c4-bang,.c4 .ki-plus,.c4 .role-ic,.c4 .c4-dl{z-index:7!important}
.c4 .c4-team{left:9%!important;top:6%!important}

/* 名牌：竖长卡（角色一览、换人）的名牌贴在卡里下沿，属性色笔刷条（ui_plate_*），不超过卡高 28% */
.c4w:has(>.c4-cap) .c4-cap{position:absolute!important;z-index:6!important;left:3%!important;right:3%!important;bottom:3%!important;top:auto!important;margin:0!important;padding:5px 6px 7px!important;
  max-height:28%;display:grid;justify-items:center;align-content:center;background:none!important}
.c4w:has(>.c4-cap) .c4p+.c4-cap{transform:none!important}

/* 选中 / 编成中：框外一圈黄光（不另画方块） */
.c4w.on .c4-fr,.c4w.sel .c4-fr{filter:drop-shadow(0 0 0 #ffe600) drop-shadow(0 0 5px #ffe600)}
.c4w:active .c4{transform:translateY(1px)}

/* 卡里的数值名牌（装备盘、装备库：「攻 27」写在卡里下沿，深色笔刷条，不再挂在卡下面单独一条） */
.c4 .c4-val{position:absolute;z-index:6;left:8%;right:8%;bottom:6%;padding:2px 4px 3px;text-align:center;font:900 11px/1.2 var(--font-pop);color:#fff;font-style:normal;
  background:url(assets/ui_plate_lock.webp) center/100% 100% no-repeat;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;white-space:nowrap}
.c4.k-wep .ki-el{bottom:22%!important}
/* 空格子：N 框 + 暗底 + 大「+」 */
.kw-empty .c4-bg{filter:brightness(.45)}
.kw-empty .kw-plus{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font:900 28px/1 var(--font-pop);color:#ffffff88;text-shadow:0 2px 0 #000}
.kw-empty .c4.tall .kw-plus{font-size:15px}

/* ═══ 11/09 名牌照母版换人页（制作人「这不对啊」）：干净的圆角色块（np_*，素材表 gpt_1109_nameplates），名字一行白字、等级攻击一行小深字，属性图标贴在名牌左边；卡外面不挂任何东西 ═══ */
.c4w:has(>.c4-cap) .c4-cap{left:6%!important;right:4%!important;bottom:4.5%!important;height:24%!important;max-height:none!important;padding:0 4px 0 18%!important;
  display:flex!important;flex-direction:column;justify-content:center;align-items:center;gap:1px;filter:none!important}
.c4w:has(>.c4-cap) .c4-cap::before{content:""!important;display:block!important;position:absolute!important;inset:0!important;z-index:-1!important;background:url(assets/np_lock.webp) center/100% 100% no-repeat!important;filter:none!important}
.c4w.ce-huo:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_huo.webp)!important}
.c4w.ce-shui:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_shui.webp)!important}
.c4w.ce-mu:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_mu.webp)!important}
.c4w.ce-tu:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_tu.webp)!important}
.c4w.ce-jin:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_jin.webp)!important}
.c4w.locked:has(>.c4-cap) .c4-cap::before{background-image:url(assets/np_lock.webp)!important}
.c4w:has(>.c4-cap) .c4-cap>b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:900 14px/1.1 var(--font-pop)!important;color:#fff!important;
  text-shadow:-1.5px -1.5px 0 #1a1030,1.5px -1.5px 0 #1a1030,-1.5px 1.5px 0 #1a1030,1.5px 1.5px 0 #1a1030!important}
.c4w:has(>.c4-cap) .c4-cap>em,.c4w:has(>.c4-cap) .c4-cap>small,.c4w:has(>.c4-cap) .c4-cap>i{display:inline;font:800 10px/1.15 var(--font-pop)!important;color:#1a1030!important;text-shadow:none!important;background:none!important;padding:0!important;font-style:normal}
.c4w:has(>.c4-cap) .c4-cap{flex-wrap:wrap}
.c4w:has(>.c4-cap) .c4-cap>b{flex:0 0 100%;text-align:center}
.c4w:has(>.c4-cap) .c4-cap>em+small::before{content:" "}
.c4w:has(>.c4-cap) .c4-cap small b{color:#1a1030!important;font-size:10px!important;text-shadow:none!important}
/* 属性图标：贴在名牌左边，压住名牌 */
.c4w:has(>.c4-cap) .c4 .ki-el{left:1%!important;bottom:9%!important;width:26%!important;height:auto!important;aspect-ratio:1;z-index:8!important}
/* 列表卡不挂定位图标、突破星（母版没有），卡下面不留东西 */
.c4w:has(>.c4-cap) .c4 .role-ic,.c4w:has(>.c4-cap) .c4 .c4-st,.c4w:has(>.c4-cap) .k-lc-role{display:none!important}
.c4w:has(>.c4-cap){padding-bottom:0!important;margin-bottom:0!important}

/* ── 按钮：先关掉旧的斜切色块（::before 描边 / ::after 底色） ── */

  padding:6px 18px 10px!important;min-height:46px;font-weight:900}

#app{position:fixed!important;top:0!important;bottom:0!important;left:0!important;right:0!important;margin:0 auto!important;height:auto!important;max-height:none!important}

@font-face{font-family:"Graf";font-display:swap;src:url(assets/font/g0.woff2) format("woff2");unicode-range:U+0000-00FF,U+2013,U+2014,U+2018,U+2019,U+201C,U+201D,U+00B7}

.hd{grid-template-columns:auto auto 1fr auto!important;gap:6px!important;padding:6px 8px 8px!important}
