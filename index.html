<style>/* 散花一投 · UI 规范值（11/07 制作人选 1A：先定规范再全局替换）。说明见 docs/UI规范.md
   所有新写的样式只能用这里的变量；以手机 390 宽为基准（px 是 CSS 像素） */
:root{
  /* 字号 6 级：最小 12，不再有 9～11 的字 */
  --fs-1:12px;   /* 标注：角标、单位、小说明 */
  --fs-2:14px;   /* 正文 */
  --fs-3:16px;   /* 强调：列表名字、小按钮、区块标题 */
  --fs-4:20px;   /* 按钮、二级页标题 */
  --fs-5:26px;   /* 一级页大标题、重要数字 */
  --fs-6:40px;   /* 演出数字（战力 UP、伤害） */
  /* 行高 */
  --lh-tight:1.15; --lh-body:1.5;
  /* 间距 5 档 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --page-x:12px;         /* 页面左右留白 */
  /* 圆角 3 档 */
  --rd-1:8px;    /* 角标、小标签 */
  --rd-2:14px;   /* 卡片、按钮 */
  --rd-3:22px;   /* 面板、弹窗、抽屉 */
  /* 描边 3 档（全部用墨紫 --ink） */
  --bd-1:2px; --bd-2:3px; --bd-3:4px;
  /* 点击区最小 44；按钮三种高度 */
  --hit:44px; --btn-l:56px; --btn-m:48px; --btn-s:36px;
  /* 层级（z-index） */
  --z-page2:40; --z-page3:50; --z-pop:60; --z-show:80; --z-toast:90;
  /* 动画时长 */
  --t-fast:.16s; --t-mid:.24s; --t-slow:.36s;
  /* 遮罩 */
  --dim:rgba(19,11,51,.66);
  /* 数字字体 */
  --font-num:"PopNum","PopSans",sans-serif;
}

/*FONTS-END*/
:root{
  /* 描边和底色 */
  --ink:#231748; --ink-2:#3a2b78; --cream:#fffaf0; --cream-2:#fff0d2; --text:#2a1f52; --muted:#7c6fa6;
  --bg-1:#5a3fd0; --bg-2:#2d1f86; --bg-3:#1b1258;
  /* 糖果色 */
  --yel-1:#fff59a; --yel-2:#ffd23f; --yel-3:#ff9f1c;
  --red-1:#ffa38a; --red-2:#ff5a5f; --red-3:#de2348;
  --blu-1:#a6ecff; --blu-2:#3ec1ff; --blu-3:#1f78e0;
  --grn-1:#c4ffa6; --grn-2:#4fd66a; --grn-3:#1f9a45;
  --pnk:#ff7ac6; --pur:#a66bff;
  /* 五行 */
  --jin:#dfe8f2; --mu:#4fd66a; --shui:#3ea2ff; --huo:#ff5a45; --tu:#f0a83a;
  /* 稀有度 */
  --r-n:#a9b3c2; --r-r:#49b6ff; --r-sr:#c06bff; --r-ssr:#ffcf3a;
  /* 兼容旧变量（战斗以外少量地方还在用） */
  --gold:#ffd23f; --gold-2:#fff59a; --paper:#ffffff; --paper-dim:#d9d0ff; --cinnabar:#ff5a5f; --line:#3a2b78; --line-2:#5b4aa8;
  --font-pop:"PopSans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-logo:"PopLogo","PopSans","PingFang SC",sans-serif;
  --font-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --font-ui:"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  /* 描边字：粗 / 中 / 细 */
  --ol:-2px -2px 0 var(--ink),0 -2px 0 var(--ink),2px -2px 0 var(--ink),2px 0 0 var(--ink),2px 2px 0 var(--ink),0 2px 0 var(--ink),-2px 2px 0 var(--ink),-2px 0 0 var(--ink),0 4px 0 var(--ink);
  --ol-s:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),0 -1.5px 0 var(--ink),0 1.5px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 3px 0 var(--ink);
  --ol-xs:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),0 2px 0 var(--ink);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#130b33 radial-gradient(circle at 1px 1px,#ffffff10 1.2px,transparent 1.6px) 0 0/16px 16px;color:#fff;font-family:var(--font-ui);overflow:hidden;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yel-2);outline-offset:2px}
img{max-width:100%}
#app{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:100dvh;overflow:hidden;background:var(--bg-3);font-size:13px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-aspect-ratio:10/16){#app{box-shadow:0 0 0 3px var(--ink),0 20px 60px #000c}}
.view{position:absolute;inset:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-bottom:14px}

/* ---------- 战斗：画布固定 9:16，居中 ---------- */
#battle{display:grid;place-items:end center;padding-bottom:env(safe-area-inset-bottom,0px);background:#1b1258}
#battle::before{content:"";position:absolute;inset:-20px;background:var(--bbg,none) center top/cover no-repeat;filter:blur(12px) brightness(.55) saturate(1.2)}
#battle::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:#1b1258}
#battle[hidden]{display:none!important}
.bstage{position:relative;z-index:1;width:var(--bw,min(100%,calc(100dvh * 9 / 16)));aspect-ratio:9/16;max-height:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bstage::before{content:"";position:absolute;left:0;right:0;top:0;height:3%;z-index:2;pointer-events:none;background:linear-gradient(180deg,#1b125899,#1b125800)}
.icon-btn{position:absolute;top:10px;z-index:6;width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);font:900 16px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);
  background:linear-gradient(180deg,#ffffff70 0 45%,#fff0 45%),linear-gradient(180deg,var(--blu-1),var(--blu-2) 55%,var(--blu-3));box-shadow:inset 0 -3px 0 #0003,0 3px 0 var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0003,0 1px 0 var(--ink)}
#bMute{right:10px} #bPause{right:54px}

/* ---------- 糖果按钮 ---------- */
.btn{--b1:var(--red-1);--b2:var(--red-2);--b3:var(--red-3);position:relative;border:3px solid var(--ink);border-radius:14px;padding:8px 14px 9px;
  font:900 16px/1.15 var(--font-pop);letter-spacing:.04em;color:#fff;text-shadow:var(--ol-s);white-space:nowrap;
  background:linear-gradient(180deg,#ffffff6a 0 44%,#fff0 44%),linear-gradient(180deg,var(--b1),var(--b2) 55%,var(--b3));box-shadow:inset 0 -4px 0 #0000002e,0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 #0000002e,0 1px 0 var(--ink)}
.btn.gold{--b1:var(--yel-1);--b2:var(--yel-2);--b3:var(--yel-3)}
.btn.blue{--b1:var(--blu-1);--b2:var(--blu-2);--b3:var(--blu-3)}
.btn.green{--b1:var(--grn-1);--b2:var(--grn-2);--b3:var(--grn-3)}
.btn.ghost{--b1:#ffffff;--b2:#f2ecff;--b3:#d6caff;color:var(--text);text-shadow:none}
.btn.big{font-size:24px;padding:10px 18px 11px;border-radius:18px}
.btn.small{font-size:13px;padding:4px 10px 5px;border-radius:10px;box-shadow:inset 0 -3px 0 #0000002e,0 3px 0 var(--ink)}
.btn small{display:block;font:800 10px/1.2 var(--font-ui);letter-spacing:0;margin-top:3px;text-shadow:var(--ol-xs)}
.btn.ghost small{text-shadow:none;color:var(--muted)}
.btn[disabled]{filter:grayscale(.8) brightness(.85);opacity:.6;pointer-events:none}

/* ---------- 属性球、稀有度、标签 ---------- */
.el{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;line-height:1;font-size:11px;font-weight:900;color:#fff;text-shadow:var(--ol-xs);
  border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ffffffcc 0 14%,transparent 15%),radial-gradient(circle at 50% 50%,var(--ec1),var(--ec2))}
.el.jin{--ec1:#e3c8ff;--ec2:#7a3ad6}.el.mu{--ec1:#a8ff9a;--ec2:#1f9a45}.el.shui{--ec1:#9fe2ff;--ec2:#1f6fe0}.el.huo{--ec1:#ffb08a;--ec2:#e0322a}.el.tu{--ec1:#ffe08a;--ec2:#c2780f}
.el.none{--ec1:#8a7fb3;--ec2:#3a2b78}
.el.orb{width:26px;height:26px;font-size:14px;border-width:2.5px;box-shadow:0 2px 0 var(--ink)}
.rar{display:inline-block;font:900 11px/16px var(--font-pop);padding:0 5px;border-radius:5px;border:2px solid var(--ink);color:#fff;text-shadow:var(--ol-xs);letter-spacing:.02em}
.rar.N,.N-c .cc-rar{background:linear-gradient(180deg,#d9dee6,#8f99a8)}
.rar.R,.R-c .cc-rar{background:linear-gradient(180deg,#9fe0ff,#2b8fe0)}
.rar.SR,.SR-c .cc-rar{background:linear-gradient(180deg,#f0b8ff,#9b4be0)}
.rar.SSR,.SSR-c .cc-rar{background:linear-gradient(135deg,#fff7a8,#ffcf3a 35%,#ff8ad0 65%,#7ad7ff)}
.N-c{--rc:var(--r-n)}.R-c{--rc:var(--r-r)}.SR-c{--rc:var(--r-sr)}.SSR-c{--rc:var(--r-ssr)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--text);white-space:nowrap;line-height:1.35}
.tag.hot{background:var(--yel-2)}
.tag.good{background:var(--grn-2);color:#fff;text-shadow:var(--ol-xs)}
.tag.bad{background:var(--red-2);color:#fff;text-shadow:var(--ol-xs)}
.tag.big{background:var(--pnk);color:#fff;text-shadow:var(--ol-xs)}
.stars{color:var(--yel-2);letter-spacing:1px;text-shadow:var(--ol-xs)}
.stars .off{color:#ffffff40;text-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:900;color:var(--text);box-shadow:0 2px 0 var(--ink)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--yel-1),var(--yel-2));transform:translateY(-1px)}
.chip .el{width:18px;height:18px;font-size:10px}
.filters{display:flex;gap:5px;margin:4px 0 10px;flex-wrap:wrap;align-items:center}
.filters .sorts{display:flex;gap:5px;margin-left:auto}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--cream);border:3px dashed var(--ink-2);border-radius:14px;font-size:12px;font-weight:700}

/* ---------- 大厅 ---------- */
#hub{display:grid;grid-template-rows:auto 1fr auto;
  background:radial-gradient(130% 55% at 50% -5%,#8b6dff 0%,#8b6dff00 62%),repeating-conic-gradient(from 0deg at 50% -8%,#ffffff0c 0 5deg,#fff0 5deg 10deg),
  radial-gradient(circle at 1px 1px,#ffffff14 1.2px,transparent 1.6px) 0 0/15px 15px,linear-gradient(180deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3))}
#hub[hidden]{display:none!important}
/* 顶栏：主公 + 货币 + 设置 */
.hd{position:relative;z-index:3;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px 9px;
  background:linear-gradient(180deg,#7458f0,#4430b8);border-bottom:3px solid var(--ink);box-shadow:0 3px 0 #0000003a}
.lord{position:relative;display:flex;align-items:center;gap:0;border:0;background:none;padding:0;text-align:left;min-width:0}
.lord .head{position:relative;z-index:1;width:46px;height:46px;flex:none;border-radius:13px;border:3px solid var(--ink);box-shadow:0 0 0 2px #fff inset,0 3px 0 var(--ink)}
.lord .lv{position:absolute;z-index:2;left:-5px;top:-5px;display:grid;place-items:center;width:22px;height:22px;font-style:normal;font:900 11px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.lord .lv::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--blu-2);border:2.5px solid var(--ink);border-radius:6px;transform:rotate(45deg)}
.lord .pw{margin-left:-8px;padding:2px 9px 2px 12px;border-radius:0 999px 999px 0;background:#231748cc;border:2px solid var(--ink);font:900 13px/1.2 var(--font-pop);color:var(--yel-1);font-variant-numeric:tabular-nums;white-space:nowrap}
.lord .pw i{font-style:normal;color:#fff;margin-right:4px;font-size:9px;padding:1px 4px;border-radius:5px;background:var(--red-2);border:1.5px solid var(--ink);vertical-align:2px}   /* 战力：以前用 ⚡ 像体力（审查 P2-3） */
.curs{display:flex;gap:7px;justify-content:flex-end}
.curs .cur{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:80px;height:24px;padding:0 22px 0 24px;border-radius:999px;background:#231748b0;border:2.5px solid var(--ink);
  font-weight:900;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--ink)}
.curs .cur::after{content:"+";position:absolute;right:-3px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font:900 16px/1 var(--font-pop);color:#fff;background:linear-gradient(180deg,#9cffb0,#2bbf6a);border:2px solid var(--ink)}
.curs .cur i,.ico{display:inline-block;width:22px;height:22px;background:url(assets/icons.webp) 0 0/198px 22px no-repeat;flex:none}
.curs .cur i{position:absolute;left:-8px;top:-4px;width:28px;height:28px;background-size:252px 28px;filter:drop-shadow(0 1px 0 var(--ink))}
.curs .cur.coin i{background-position:-140px 0}.ico.coin{background-position:-110px 0}
#hSet{position:static;width:34px;height:34px;font-size:15px}
.panel{overflow-y:auto;overflow-x:hidden;padding:12px 12px 18px;scrollbar-width:none;overscroll-behavior:contain}
.panel::-webkit-scrollbar{display:none}
/* 底部页签：插画图标放在圆角方块里，选中的方块变黄、浮起来 */
.tabs{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 2px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#4a35c2,#2a1c86);border-top:3px solid var(--ink);box-shadow:0 -3px 0 #0000003a}
.tab{position:relative;border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;color:#fff;min-height:72px;align-content:end}
.tab .tico{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;border:3px solid var(--ink);background:linear-gradient(180deg,#fff,#e6defc);box-shadow:inset 0 -3px 0 #0000001f,0 3px 0 var(--ink);transition:transform .15s}
.tab span{font:900 15px/1 var(--font-pop);letter-spacing:.06em;text-shadow:var(--ol-s)}
.tab[aria-selected="true"] .tico{transform:translateY(-6px) scale(1.08);background:linear-gradient(180deg,var(--yel-1),var(--yel-2) 60%,var(--yel-3))}
.uic{display:block;width:118%;height:118%;flex:none;background:url(assets/ui_icons.webp) 0 0/7000% 100% no-repeat;background-position:calc(var(--i) * 100% / 69) 0;filter:drop-shadow(0 2px 0 #23174866)}
.tab .tico .uic{width:62px;height:62px;margin-top:-6px}
.tab[aria-selected="true"] span{color:var(--yel-1)}
.tab.mid .tico{width:78px;height:78px;margin-top:-34px;border-radius:50%;background:linear-gradient(180deg,var(--yel-1),var(--yel-2) 55%,var(--yel-3));box-shadow:inset 0 -4px 0 #0000002a,0 4px 0 var(--ink),0 0 0 4px #4a35c2}
.tab.mid[aria-selected="true"] .tico{transform:translateY(-4px) scale(1.06)}
.tab.mid .tico .uic{width:76px;height:76px}
.tab .dot{position:absolute;top:-4px;right:18%;width:14px;height:14px;border-radius:50%;background:var(--red-2);border:2.5px solid var(--ink);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
/* 页标题：红色飘带 */
h2{margin:2px 0 8px;font:900 22px/1.1 var(--font-pop);color:#fff;text-shadow:var(--ol-s);letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
h2 small{font:700 11px var(--font-ui);color:#e6deff;text-shadow:none;letter-spacing:0}
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ptitle h2{margin:0}
.ptip{font-size:11px;font-weight:700;color:#e6deff}
.rib{position:relative;z-index:0;display:inline-block;padding:3px 16px 4px;background:linear-gradient(180deg,#ff8a95,var(--red-2) 60%,var(--red-3));border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink)}

/* ---------- 编成：分页 ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.seg-b{--b1:#8f7fe8;--b2:#5a44c8;--b3:#3a2a9a;display:flex;align-items:center;justify-content:center;gap:5px;height:42px;border:3px solid var(--ink);border-radius:14px;
  font:900 16px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s);background:linear-gradient(180deg,#ffffff40 0 44%,#fff0 44%),linear-gradient(180deg,var(--b1),var(--b2) 55%,var(--b3));box-shadow:inset 0 -3px 0 #0000002e,0 4px 0 var(--ink)}
.seg-b[aria-pressed="true"]{--b1:var(--blu-1);--b2:var(--blu-2);--b3:var(--blu-3);transform:translateY(-2px)}
.sico{display:inline-block;width:28px;height:28px;flex:none;background:url(assets/icons.webp) 0 0/900% 100% no-repeat;filter:drop-shadow(0 1px 0 var(--ink))}
/* 战力 / 编队属性 / 羁绊 */
.pstat{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:0;margin-bottom:6px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);overflow:hidden;color:var(--text)}
.pstat>*{display:grid;align-content:center;gap:1px;padding:5px 10px;border:0;background:none;text-align:left;color:inherit;min-width:0}
.pstat>*+*{border-left:2px dashed #d6caff}
.pstat span{font-size:10px;font-weight:900;color:var(--muted)}
.ps-pw b{font:900 26px/1 var(--font-pop);color:var(--yel-2);text-shadow:var(--ol-s);font-variant-numeric:tabular-nums}
.pstat em{display:flex;align-items:center;gap:4px;font-style:normal}
.ps-el b{font-size:12px;font-weight:900;color:var(--grn-3)}
.ps-el b.off{color:var(--muted)}
.ps-bond b{font:900 22px/1 var(--font-pop);color:var(--pnk);text-shadow:var(--ol-xs)}
.ps-bond small{font-size:11px;font-weight:900;color:var(--muted)}
.plaque{position:relative;z-index:0;display:flex;justify-content:center;margin:12px 0 10px}
.plaque span{position:relative;padding:3px 26px 4px;font:900 17px/1 var(--font-pop);letter-spacing:.16em;color:#fff;text-shadow:var(--ol-s);
  background:linear-gradient(180deg,#ff9aa5,var(--red-2) 60%,var(--red-3));border:3px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink)}
.plaque span::before,.plaque span::after{content:"";position:absolute;top:7px;z-index:-1;width:22px;height:calc(100% + 2px);background:#b81c3c;border:3px solid var(--ink)}
.plaque span::before{left:-15px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.plaque span::after{right:-15px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.swapbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 8px 6px 12px;border-radius:12px;background:var(--yel-2);border:3px solid var(--ink);color:var(--text);font-weight:900;font-size:12px;box-shadow:0 3px 0 var(--ink)}
.swapbar span{flex:1}
/* ---------- 武将大卡 ---------- */
.team6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 7px}
.cc{position:relative;display:flex;flex-direction:column;min-width:0;padding:0;border:3px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--text);text-align:left;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.cc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.cc-pic,.mc-pic{position:relative;display:block;aspect-ratio:3/3.7;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 50% 38%,#ffffff22 0 8deg,#fff0 8deg 16deg),radial-gradient(circle at 50% 38%,var(--e1) 0%,var(--e2) 78%);
  box-shadow:inset 0 0 0 2px var(--rc),inset 0 -14px 14px -10px #0007}
.e-jin{--e1:#ecd9ff;--e2:#6a2fc4}.e-mu{--e1:#c9ffb8;--e2:#1c8a3e}.e-shui{--e1:#b5ecff;--e2:#1d63d0}.e-huo{--e1:#ffc3a3;--e2:#d02a2a}.e-tu{--e1:#ffe7a3;--e2:#b46b0c}
.SSR-c .cc-pic,.SSR-c .mc-pic{box-shadow:inset 0 0 0 2px var(--r-ssr),inset 0 0 18px #ffcf3a88,inset 0 -14px 14px -10px #0007}
.cc-art img{position:absolute;left:50%;top:-1%;height:138%;width:auto;max-width:none;transform:translateX(calc(var(--ax) * -100%));filter:drop-shadow(0 3px 2px #0005)}
.cc-rar{position:absolute;right:3px;top:3px;z-index:1;font:900 12px/16px var(--font-pop);padding:0 5px;border-radius:5px;border:2px solid var(--ink);color:#fff;text-shadow:var(--ol-xs)}
.cc-pic>.el.orb,.mc-pic>.el.orb{position:absolute;left:3px;top:3px;z-index:1}
.cc-bt{position:absolute;left:4px;bottom:2px;z-index:1;font-size:10px;letter-spacing:-.5px;color:var(--yel-2);text-shadow:var(--ol-xs)}
.cc-bt i{font-style:normal;color:#ffffff55;text-shadow:none}
.cc-plus{position:absolute;right:4px;bottom:0;z-index:1;font:900 17px/1.1 var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-s)}
.cc-lead{position:absolute;left:3px;top:32px;z-index:2;padding:0 5px 1px;font:900 11px/1.3 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:var(--red-2);border:2px solid var(--ink);border-radius:6px;writing-mode:vertical-rl;letter-spacing:.1em}
.cc-type{position:relative;z-index:1;align-self:center;margin:-9px 0 0;padding:1px 10px 2px;font:900 11px/1.2 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:linear-gradient(180deg,#ff9a6a,#e0452a);border:2px solid var(--ink);border-radius:999px}
.cc-name{display:flex;align-items:baseline;justify-content:space-between;gap:3px;padding:3px 6px 1px;min-width:0}
.cc-name i{font-style:normal;font-size:9.5px;font-weight:900;color:var(--muted)}
.cc-name b{font:900 14px/1.1 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-row{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 0;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#3a2b78,#231748);color:#fff;font-weight:900;font-size:12px;font-variant-numeric:tabular-nums}
.cc-row i{font-style:normal;font-size:9px;opacity:.75}
.cc-row.atk b{color:#ffb44a}.cc-row.crit b{color:#8dff9a}
.cc-skill{display:flex;align-items:center;justify-content:space-between;gap:2px;margin:4px 4px 5px;padding:2px 7px;border-radius:999px;border:2px solid var(--ink);color:#fff;text-shadow:var(--ol-xs);
  background:linear-gradient(180deg,#ffffff5a 0 45%,#fff0 45%),linear-gradient(180deg,var(--blu-1),var(--blu-2) 55%,var(--blu-3))}
.cc-skill b{font:900 11.5px/1.2 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-skill i{font-style:normal;font-size:9px}
.cc.sumc .cc-pic{background:radial-gradient(circle at 50% 40%,#3a2b78,#120a32)}
.cc.sumc .sumart{position:absolute;inset:6%;border-radius:50%;background:#000 center/120% no-repeat;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--yel-2),0 0 18px #ffd23f88}
.cc.sumc .cc-rar{background:linear-gradient(180deg,var(--yel-1),var(--yel-3))}
.cc.sumc.none .sumart{background:repeating-linear-gradient(45deg,#ffffff10 0 6px,#fff0 6px 12px);box-shadow:none}
.cc.swapping{animation:wobble .6s ease-in-out infinite}
.cc.swapsel{box-shadow:0 0 0 3px var(--yel-2),0 4px 0 var(--ink);transform:translateY(-4px)}
@keyframes wobble{25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
/* 一键编成 + 两个圆章 */
.pact{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:14px 0 8px}
.medal{display:grid;place-items:center;align-content:center;width:62px;height:62px;border-radius:50%;padding:0;border:3px solid var(--ink);color:#fff;text-shadow:var(--ol-xs);
  background:linear-gradient(180deg,#ffffff50 0 44%,#fff0 44%),linear-gradient(180deg,#9f8ff0,#5a44c8 60%,#3a2a9a);box-shadow:inset 0 0 0 3px #ffffff40,0 4px 0 var(--ink)}
.medal b{font:900 16px/1 var(--font-pop)}
.medal small{font-size:9px;font-weight:900;margin-top:1px}
.medal.on{background:linear-gradient(180deg,#ffffff60 0 44%,#fff0 44%),linear-gradient(180deg,var(--yel-1),var(--yel-2) 60%,var(--yel-3))}
.medal:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px #ffffff40,0 2px 0 var(--ink)}
.autob{width:100%;letter-spacing:.12em}
.bondline{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:0 0 10px}
.bondline span{font:900 12px/1.4 var(--font-pop);padding:0 10px;border-radius:999px;color:#fff;text-shadow:var(--ol-xs);background:linear-gradient(180deg,#ffb0e0,var(--pnk));border:2px solid var(--ink)}
.fns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:9px 8px;background:#ffffff18;border:3px solid var(--ink);border-radius:16px;box-shadow:inset 0 0 0 2px #ffffff22}
.fn{display:grid;justify-items:center;gap:3px;padding:6px 0 5px;border:3px solid var(--ink);border-radius:12px;color:#fff;text-shadow:var(--ol-xs);
  background:linear-gradient(180deg,#ffffff5a 0 44%,#fff0 44%),linear-gradient(180deg,var(--blu-1),var(--blu-2) 55%,var(--blu-3));box-shadow:inset 0 -3px 0 #0000002e,0 3px 0 var(--ink)}
.fn span{font:900 11px/1 var(--font-pop);white-space:nowrap}
.fn .sico{width:30px;height:30px}
.fn:last-child{background:linear-gradient(180deg,#ffffff5a 0 44%,#fff0 44%),linear-gradient(180deg,var(--red-1),var(--red-2) 55%,var(--red-3))}
.fn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0000002e,0 1px 0 var(--ink)}

/* ---------- 小卡（武将一览、换人选择） ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.mc{position:relative;display:flex;flex-direction:column;min-width:0;padding:0;border:3px solid var(--ink);border-radius:10px;background:var(--cream);color:var(--text);box-shadow:0 3px 0 var(--ink);overflow:hidden;text-align:left}
.mc:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mc-pic{aspect-ratio:1/1.12}
.mc .cc-rar{font-size:10.5px;line-height:14px;padding:0 4px}
.mc .el.orb{width:21px;height:21px;font-size:11px}
.mc .cc-bt{font-size:8.5px}
.mc-name{display:flex;align-items:baseline;justify-content:space-between;gap:2px;padding:2px 5px 3px;min-width:0}
.mc-name i{font-style:normal;font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap}
.mc-name b{font:900 12.5px/1.15 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-tag{position:absolute;right:2px;bottom:2px;z-index:1;font:900 10px/1.3 var(--font-pop);padding:0 5px;border-radius:5px;color:#fff;text-shadow:var(--ol-xs);background:var(--red-2);border:2px solid var(--ink)}
.mc-delta{position:absolute;left:50%;bottom:2px;z-index:1;transform:translateX(-50%);font:900 12px/1.3 var(--font-pop);padding:0 6px;border-radius:999px;color:#fff;text-shadow:var(--ol-xs);border:2px solid var(--ink);white-space:nowrap}
.mc-delta.up{background:var(--grn-2)}.mc-delta.down{background:var(--red-2)}.mc-delta.eq{background:#8a7fb3}
.mc.locked .mc-pic{filter:grayscale(1) brightness(.4)}
.mc.locked{background:#d9d2ee}
.mc.inteam{opacity:.85}

/* ---------- 头像、队伍小条 ---------- */
.head{position:relative;display:block;width:52px;height:52px;border-radius:50%;background:url(assets/heads.webp) 0 0/2500% 100% no-repeat #3a2b78;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--rc,#fff)}
.head .el{position:absolute;left:-5px;bottom:-4px;width:19px;height:19px;font-size:10px}
.head.off{filter:grayscale(1) brightness(.5)}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slot{position:relative;border:0;padding:0;background:none;display:grid;justify-items:center;gap:3px}
.slot .head{width:48px;height:48px}
.slot .nm{font:900 12px/1 var(--font-pop);color:var(--text)}
.emb{position:relative;display:grid;place-items:center;border-radius:50%;flex:none;border:3px solid var(--ink);background:radial-gradient(circle at 50% 40%,var(--c),#120a32 72%);box-shadow:0 0 0 2px var(--c),0 3px 0 var(--ink)}
.emb.off{filter:grayscale(1) brightness(.45)}
.emb.img{background-color:#000;background-size:118%;background-position:center;background-repeat:no-repeat}

/* ---------- 弹层 ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:#120a32b0;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;color:var(--text);padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;overscroll-behavior:contain;
  background:radial-gradient(circle at 1px 1px,#5a44c814 1.2px,transparent 1.6px) 0 0/14px 14px,linear-gradient(180deg,var(--cream),var(--cream-2));border:3px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -4px 0 #0003;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .close{position:absolute;right:8px;top:8px;z-index:4;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);font:900 20px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);
  background:linear-gradient(180deg,#ffffff60 0 44%,#fff0 44%),linear-gradient(180deg,var(--red-1),var(--red-2) 55%,var(--red-3));box-shadow:0 3px 0 var(--ink)}
.sh-title{display:flex;align-items:baseline;gap:10px;padding-right:44px;margin-bottom:4px}
.sh-title b{font:900 24px/1.1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.sh-title small{font-size:11px;font-weight:900;color:var(--muted)}
.sh-tip{margin:0 0 10px;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.5}
.sh-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sheet .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.sheet .stat div{background:linear-gradient(180deg,#3a2b78,#231748);border:3px solid var(--ink);border-radius:10px;padding:4px 8px;color:#fff}
.sheet .stat span{display:block;font-size:10px;font-weight:900;color:#d9d0ff}
.sheet .stat b{font:900 18px/1.1 var(--font-pop);color:var(--yel-2);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions .wide{grid-column:1/-1}
.tag.wide{justify-content:center;padding:6px;font-size:12px}
.burst{position:absolute;left:0;right:0;top:120px;z-index:5;text-align:center;font:900 44px/1 var(--font-pop);pointer-events:none;animation:burst 1.2s ease-out forwards;text-shadow:var(--ol)}
.burst small{display:block;font-size:24px;margin-top:4px}
.affix{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:2px dashed #d6caff;font-size:12.5px;font-weight:800}
.affix b{color:#e0322a;font-variant-numeric:tabular-nums}
.affix.flash b{animation:flash .9s}
.sec .affix:last-child{border-bottom:0}
.sheet .sec{background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);overflow:hidden}
.whead{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-right:44px}
.whead .wi{width:78px;height:78px;flex:none}
.whead b{font:900 26px/1.1 var(--font-pop);color:#fff;text-shadow:var(--ol-s)}
.whead .row{margin-top:4px}
.whead .muted{font-size:11px;font-weight:800}

/* ---------- 武将详情 ---------- */
.sheet.gd{padding-top:0}
.gd-hero{position:relative;height:300px;margin:0 -12px 0;overflow:hidden;border-bottom:3px solid var(--ink);
  background:radial-gradient(circle at 1.5px 1.5px,#ffffff40 1.4px,#fff0 1.6px) 0 0/9px 9px,linear-gradient(115deg,color-mix(in srgb,var(--ec) 85%,#fff) 0 38%,color-mix(in srgb,var(--ec) 60%,#231748) 38% 100%)}
.gd-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(180deg,#23174800,#231748b0);pointer-events:none}
.gd-en{position:absolute;left:-6%;top:16%;font:900 112px/0.9 var(--font-pop);letter-spacing:-.02em;color:#fff0;-webkit-text-stroke:3px #ffffffb0;transform:rotate(-12deg);white-space:nowrap;pointer-events:none;text-shadow:6px 6px 0 #23174833}
.gd-slash{position:absolute;left:-20%;right:-20%;top:58%;height:34px;background:#231748;transform:rotate(-12deg);box-shadow:0 0 0 4px #fff3}
.gd-hero img{z-index:1}
.gd-plate small{display:block;font-size:10px;font-weight:900;color:var(--yel-1);margin-left:2px;letter-spacing:.02em;text-shadow:none}
.gd-plate{position:absolute;z-index:2;left:10px;bottom:10px;flex-wrap:wrap;max-width:70%;display:flex;align-items:center;gap:6px;padding:5px 14px 5px 6px;border-radius:14px;background:#231748e6;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.gd-plate b{font:900 30px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s);letter-spacing:.04em}
.gd-plate .cc-rar{position:static;font-size:14px;line-height:18px}
.gd-bt{position:absolute;z-index:2;left:10px;top:12px;display:grid;gap:2px;justify-items:start}
.gd-bt .cc-bt{position:static;font-size:16px}
.gd-bt small{font-size:10px;font-weight:900;color:#fff;background:#231748cc;border-radius:6px;padding:0 6px;border:2px solid var(--ink)}
.gd-plus{position:absolute;z-index:2;right:10px;bottom:14px;font:900 15px/1.2 var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-s);background:#231748aa;border:2px solid var(--ink);border-radius:10px;padding:2px 8px}
.gd-tabs{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 -12px 10px;background:#231748;border-bottom:3px solid var(--ink)}
.gd-tabs button{border:0;background:none;padding:9px 0 8px;font:900 15px/1 var(--font-pop);color:#b9aee8;letter-spacing:.1em;position:relative}
.gd-tabs button[aria-pressed="true"]{color:#fff;text-shadow:var(--ol-xs)}
.gd-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:4px;border-radius:2px;background:var(--yel-2)}
.gd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gd-stats div{position:relative}
.gd-gain{position:absolute;right:6px;top:-10px;font-style:normal;font:900 15px/1 var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-xs);animation:gainUp 1.1s ease-out forwards}
@keyframes gainUp{0%{transform:translateY(8px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.25);opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
.gd-lvbar{position:relative;margin:8px 0 2px;height:22px;border-radius:11px;background:#231748;border:3px solid var(--ink);overflow:hidden}
.gd-lvbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blu-1),#7fe8ff);border-radius:8px}
.gd-lvbar span{position:absolute;left:10px;top:0;line-height:16px;font:900 11px/16px var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.gd-lvbar em{position:absolute;right:8px;top:0;font-style:normal;font:900 11px/16px var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-xs)}
.gd-prof{display:grid;gap:7px;padding:12px 10px;border-radius:14px;background:#231748;border:3px solid var(--ink);transform:rotate(-1deg);box-shadow:0 4px 0 var(--ink)}
.gd-prof div{display:flex;align-items:center;gap:10px}
.gd-prof i{flex:none;min-width:82px;text-align:center;font-style:normal;font:900 13px/1.7 var(--font-pop);color:var(--text);background:var(--yel-2);border:2px solid var(--ink);border-radius:7px;padding:0 8px}
.gd-prof b{font:900 15px/1.3 var(--font-pop);color:#fff}
.gd-quote{position:relative;margin:14px 4px 6px;padding:12px 14px 12px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:900 15px/1.5 var(--font-pop);color:var(--text)}
.gd-quote i{position:absolute;left:12px;top:-12px;font-style:normal;font:900 11px/1.5 var(--font-pop);color:#fff;background:var(--pnk);border:2px solid var(--ink);border-radius:6px;padding:0 6px}
.bchip small{margin-left:4px;font-size:10px;opacity:.75}
.gd-stats div{display:grid;gap:1px;padding:5px 9px;border-radius:12px;background:linear-gradient(180deg,#3a2b78,#231748);border:3px solid var(--ink);color:#fff;box-shadow:0 3px 0 var(--ink)}
.gd-stats span{font-size:10px;font-weight:900;color:#d9d0ff}
.gd-stats b{font:900 22px/1.05 var(--font-pop);font-variant-numeric:tabular-nums;color:#fff}
.gd-stats b small{font-size:13px;color:#d9d0ff}
.gd-stats .atk b{color:#ffb44a}.gd-stats .crit b{color:#8dff9a}
.gd-break{margin:7px 2px 9px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.5}
.gd-skills{display:grid;gap:6px;margin-bottom:12px}
.gd-skills>div{position:relative;padding:7px 10px 8px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.gd-skills b{font:900 17px/1.2 var(--font-pop);color:var(--text);margin-left:4px}
.gd-skills p{margin:3px 0 0;font-size:12px;font-weight:700;line-height:1.55;color:#4a3f78}
.sk-t{display:inline-block;font-style:normal;font:900 11px/1.4 var(--font-pop);padding:0 8px;border-radius:999px;color:#fff;text-shadow:var(--ol-xs);background:var(--blu-2);border:2px solid var(--ink);vertical-align:2px}
.sk-t.fs{background:#e0452a}.sk-t.bd{background:var(--pnk)}
.bchip{display:inline-block;margin:2px 4px 0 0;font:900 12px/1.4 var(--font-pop);padding:0 9px;border-radius:999px;background:#ece6ff;color:var(--muted);border:2px solid #c9bdf5}
.bchip.on{background:var(--pnk);color:#fff;text-shadow:var(--ol-xs);border-color:var(--ink)}
.gd-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gd-acts .wide{grid-column:1/-1}
.gd-in{margin-top:12px;text-align:center;font:900 15px/1 var(--font-pop);padding:9px;border-radius:12px;background:var(--grn-2);color:#fff;text-shadow:var(--ol-xs);border:3px solid var(--ink)}

/* ---------- 主页（11/04：休闲手游大厅式布局——左右功能列、展台主将、章节进度、底部开始大按钮） ---------- */
#hub[data-tab="home"] .panel{padding:0;overflow:hidden}
.home{position:relative;height:100%;overflow:hidden}
.home .hbg{position:absolute;inset:0;background:radial-gradient(46% 30% at 50% 56%,color-mix(in srgb,var(--ec) 50%,transparent),transparent 72%),radial-gradient(60% 40% at 50% 0%,#a07cff55,transparent 70%),linear-gradient(180deg,#23174866 0%,#23174800 30%,#23174800 58%,#231748f0 100%),url(assets/lobby_bg.webp) center/cover no-repeat}
/* 目标卡（右上） */
.home .goal{position:absolute;right:8px;top:10px;width:min(56%,230px);display:grid;gap:4px;padding:0 0 7px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--text);text-align:left;box-shadow:0 4px 0 var(--ink);overflow:hidden;z-index:2}
.goal .gt{display:block;padding:3px 10px 3px 26px;font:900 13px/1.3 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:linear-gradient(90deg,var(--pur),var(--pnk));position:relative}

.goal .gd{padding:0 10px;font-size:12px;font-weight:900;line-height:1.35}

.goal .gr{display:flex;align-items:center;gap:3px;margin:0 8px;padding:3px 4px 3px 6px;border-radius:9px;background:#eee8ff;font:900 13px/1 var(--font-pop)}

.goal .gr em{margin-left:auto;font-style:normal;font-size:11px;padding:3px 8px;border-radius:999px;color:#fff;text-shadow:var(--ol-xs);background:linear-gradient(180deg,var(--blu-1),var(--blu-2));border:2px solid var(--ink)}
.goal:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
/* 左右功能列 */
.home .scol{position:absolute;top:10px;display:grid;gap:14px;z-index:2}
.home .scol.l{left:8px}.home .scol.r{right:8px;top:136px}
.sb{position:relative;width:54px;display:grid;justify-items:center;border:0;background:none;padding:0}
.sb .sbi{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;border:3px solid var(--ink);font:900 26px/1 var(--font-pop);font-style:normal;color:var(--ink);
  background:linear-gradient(180deg,#ffffffb0 0 46%,#fff0 46%),linear-gradient(180deg,#fff,#d9ccff);box-shadow:inset 0 -4px 0 #00000018,0 3px 0 var(--ink);transform:rotate(-3deg)}

.sb>span{position:relative;margin-top:-9px;padding:1px 6px;border-radius:7px;background:var(--ink);font:900 11px/1.25 var(--font-pop);color:#fff;white-space:nowrap;letter-spacing:.04em}
.sb .dot,.promo .dot{position:absolute;top:-4px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--red-2);border:2.5px solid var(--ink);animation:bob 1s ease-in-out infinite}
.sb:active .sbi{transform:translateY(2px) scale(.96)}
/* 展台 + 主将 */
.home .podium{position:absolute;left:50%;bottom:184px;width:min(74%,300px);height:62px;transform:translateX(-50%);pointer-events:none}
.podium .pd{position:absolute;inset:0;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(60% 55% at 50% 38%,#ffffff70,#fff0 70%),linear-gradient(180deg,color-mix(in srgb,var(--ec) 55%,#fff),color-mix(in srgb,var(--ec) 70%,#231748));box-shadow:0 10px 0 -2px var(--ink),0 18px 22px #000a}
.podium .ps{position:absolute;border-radius:50%;border:2.5px solid var(--ink)}
.podium .s1{left:-6%;top:40%;width:26px;height:16px;background:var(--yel-2)}.podium .s2{right:-4%;top:22%;width:20px;height:13px;background:#3ad1ff}.podium .s3{right:14%;bottom:-14px;width:30px;height:18px;background:var(--pnk)}
.home .hero{position:absolute;left:0;right:0;bottom:214px;top:96px;border:0;padding:0;background:none;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.home .hero img{height:100%;max-height:430px;max-width:none;object-fit:contain;pointer-events:auto;filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 10px 10px #0008);animation:heroIn .5s ease-out,breatheHero 4s ease-in-out .5s infinite}
@keyframes heroIn{from{transform:translateY(24px) scale(.92);opacity:0}}

.home .hname{position:absolute;left:50%;bottom:172px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:2px 12px 2px 5px;border-radius:999px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--text);white-space:nowrap;z-index:1}

.home .bubble{position:absolute;left:72px;right:72px;top:178px;padding:8px 12px;border-radius:16px;background:#fff;color:var(--text);font-size:12.5px;font-weight:800;line-height:1.5;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);animation:pop .25s;z-index:3;text-align:center}
.home .bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
/* 左边限定招募、右边召唤兽 */
.home .promo{position:absolute;left:8px;bottom:250px;width:88px;height:96px;display:grid;align-content:end;padding:4px 5px;border-radius:13px;border:3px solid var(--ink);background:#231748 center/cover no-repeat;text-align:left;box-shadow:0 4px 0 var(--ink);z-index:2;transform:rotate(-3deg)}
.promo::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,transparent 30%,#231748f0)}
.promo>*{position:relative}
.promo .pt{position:absolute;left:-6px;top:-8px;font-style:normal;font:900 11px/1.3 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:var(--red-2);border:2px solid var(--ink);border-radius:6px;padding:0 5px;transform:rotate(-8deg)}
.promo b{font:900 15px/1.1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.promo small{font-size:8.5px;font-weight:900;color:var(--yel-1);line-height:1.25}
.home .sumchip{position:absolute;right:8px;bottom:250px;width:88px;display:grid;justify-items:center;gap:2px;padding:4px;border-radius:13px;border:3px solid var(--ink);background:#2a1c86e0;box-shadow:0 4px 0 var(--ink);z-index:2;transform:rotate(3deg)}
.sumchip img{width:70px;height:50px;object-fit:cover;border-radius:8px;border:2px solid var(--ink)}
.sumchip small{font-size:9px;font-weight:900;line-height:1.25;color:#fff;text-align:center}
/* 章节进度条 */
.home .track{position:absolute;left:10px;right:10px;bottom:92px;height:70px;z-index:2}
.track .tl{position:absolute;left:4px;right:4px;top:30px;display:flex;align-items:center;justify-content:space-between}
.track .tl::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:repeating-linear-gradient(90deg,#ffffffb0 0 8px,#fff0 8px 13px)}
.track .td{position:relative;width:11px;height:11px;border-radius:50%;background:#3a2b78;border:2.5px solid #fff}
.track .td.done{background:var(--yel-2);border-color:var(--ink)}
.track .now{animation:bob 1s ease-in-out infinite}
.track .td.now{width:17px;height:17px;background:var(--red-2);border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 0 12px var(--red-2)}
.track .tn{position:relative;width:40px;height:11px}
.tn .tr{position:absolute;left:50%;top:-30px;transform:translateX(-50%);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);font:900 20px/1 var(--font-pop);font-style:normal;color:#fff;text-shadow:var(--ol-xs);background:radial-gradient(circle at 40% 30%,#fff,#ffe58a 45%,var(--yel-3));box-shadow:0 3px 0 var(--ink)}
.tn .tr .ico{width:26px;height:26px;background-size:234px 26px}
.tn.done .tr{background:linear-gradient(180deg,#9cffb0,#2bbf6a)}
.tn.now .tr{box-shadow:0 0 0 3px #fff,0 0 16px var(--yel-2)}
.tn small{position:absolute;left:50%;top:2px;transform:translateX(-50%);font:900 10px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);white-space:nowrap}
.tn b{position:absolute;left:50%;top:15px;transform:translateX(-50%);padding:1px 6px;border-radius:6px;background:#ffffffe6;border:2px solid var(--ink);font:900 10px/1.2 var(--font-pop);color:var(--text);white-space:nowrap}
/* 底部：章节选择 / 开始大按钮 / 下个关隘 */
.home .hfoot{position:absolute;left:8px;right:8px;bottom:12px;display:grid;grid-template-columns:76px 1fr 76px;gap:7px;align-items:stretch;z-index:2}
.chapbtn{display:grid;place-content:center;gap:2px;border-radius:16px;border:3px solid var(--ink);color:#fff;background:linear-gradient(180deg,#ffffff55 0 46%,#fff0 46%),linear-gradient(180deg,#8f7bff,#5a42d6);box-shadow:inset 0 -4px 0 #0000002e,0 4px 0 var(--ink);padding:4px}
.chapbtn .uic{width:34px;height:34px;margin:-14px auto -2px}
.chapbtn b{font:900 13px/1.05 var(--font-pop);text-shadow:var(--ol-xs);letter-spacing:.04em}
.chapbtn small{font-size:9.5px;font-weight:900;color:var(--yel-1)}
.nextbig{position:relative;display:grid;place-content:center;justify-items:center;gap:1px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--text);box-shadow:0 4px 0 var(--ink);padding:10px 3px 4px}
.nextbig .nb-t{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);font-style:normal;font:900 10px/1.3 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:var(--pnk);border:2px solid var(--ink);border-radius:6px;padding:0 5px;white-space:nowrap}
.nextbig b{font:900 15px/1.1 var(--font-pop)}
.nextbig small{font-size:9.5px;font-weight:900;color:var(--muted)}
.chapbtn:active,.nextbig:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.questbtn{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;min-height:66px;border:3px solid var(--ink);border-radius:20px;color:#fff;
  background:linear-gradient(180deg,#ffffff66 0 44%,#fff0 44%),linear-gradient(180deg,#ffb08a,var(--red-2) 55%,var(--red-3));box-shadow:inset 0 -5px 0 #0000002e,0 5px 0 var(--ink);animation:qglow 1.6s ease-in-out infinite}
.questbtn b{font:900 30px/1 var(--font-pop);letter-spacing:.24em;padding-left:.24em;text-shadow:var(--ol)}
.questbtn small{font-size:10.5px;font-weight:900;text-shadow:var(--ol-xs)}
.questbtn.big{background:linear-gradient(180deg,#ffffff66 0 44%,#fff0 44%),linear-gradient(180deg,#e0b0ff,#a14bff 55%,#6a1fd0)}
.questbtn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 #0000002e,0 2px 0 var(--ink)}
@media (max-height:700px){.home .scol{gap:9px}.home .scol.r{top:122px}.sb .sbi{width:44px;height:44px}.home .promo,.home .sumchip{display:none}.sb .sbi .uic{width:46px;height:46px}.home .podium{bottom:170px;height:52px}.home .hero{bottom:196px}.home .hname{bottom:160px}.home .track{bottom:84px}}

@keyframes qglow{50%{filter:brightness(1.12)}}

/* ---------- 远征入口 ---------- */
.exps{display:grid;gap:10px}
.exp{position:relative;display:grid;align-content:end;justify-items:start;gap:3px;min-height:112px;padding:10px 12px 11px;border-radius:16px;border:3px solid var(--ink);background:#231748 center/cover no-repeat;text-align:left;overflow:hidden;color:#fff;box-shadow:0 5px 0 var(--ink)}

.exp .en{font:900 11px/1 var(--font-pop);letter-spacing:.2em;color:var(--yel-1);text-shadow:var(--ol-xs)}

.power{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:6px 10px;border-radius:14px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--text)}

.pe-chip{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:0 6px;color:inherit}

/* ---------- 武器盘（碧蓝幻想式：顶部数值、左竖主手、右 3×3、卡下数值、预测伤害） ---------- */
.gbf{padding:9px;border-radius:16px;background:linear-gradient(180deg,#3a2b9a,#231768);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #ffffff22,0 5px 0 var(--ink)}

.ggrid{display:grid;grid-template-columns:31% 1fr;gap:6px;align-items:stretch}

.gv{display:flex;align-items:center;justify-content:space-between;padding:0 6px;border-radius:6px;background:#120a32;border:2px solid var(--ink);font:900 13px/1.35 var(--font-pop);color:#ffb44a;font-variant-numeric:tabular-nums}

.wc.N-c{--wc1:#eef0f4;--wc2:#9aa4b2}.wc.R-c{--wc1:#dff3ff;--wc2:#58aef0}.wc.SR-c{--wc1:#f6e2ff;--wc2:#b06ff0}.wc.SSR-c{--wc1:#fff9d6;--wc2:#f0bf3a}

.gbtns .btn{padding:8px 6px 9px}
.gpred{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gpred>div{position:relative;display:grid;gap:2px;padding:5px 10px 7px;border-radius:12px;background:var(--cream);border:2.5px solid var(--ink);color:var(--text)}
.gpred span{font-size:10px;font-weight:900;color:var(--muted)}
.gpred b{font:900 30px/1 var(--font-pop);color:var(--red-2);text-align:right;text-shadow:var(--ol-s);font-variant-numeric:tabular-nums}
.gpred em{justify-self:start;margin:1px 0 -4px;font:900 12px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:var(--red-2);padding:2px 6px;border-radius:6px;border:2px solid var(--ink);transform:rotate(-6deg)}

.sum-list{display:grid;gap:4px;font-size:12px;font-weight:800;padding:8px 10px;border-radius:12px;background:var(--cream);border:2.5px solid var(--ink);color:var(--text);margin-top:8px}

.wi{position:relative;display:block;border-radius:10px;background-color:#fff;background-image:url(assets/weapons.webp);background-repeat:no-repeat;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--rc,#ccc),0 3px 0 var(--ink)}

/* ---------- 召唤兽 ---------- */
.scard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;border:3px solid var(--ink);background:var(--cream);color:var(--text);margin-bottom:10px;box-shadow:0 4px 0 var(--ink)}

/* ---------- 招募 ---------- */
.banner{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:5/4;background:#231748 center/cover no-repeat;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#23174899,transparent 30%,transparent 62%,#231748e6)}
.banner .ttl{position:absolute;left:12px;top:10px;z-index:3;font:900 36px/1 var(--font-pop);color:#fff;text-shadow:var(--ol);letter-spacing:.04em}
.banner .sub{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;font-size:11px;font-weight:900;color:var(--text);background:var(--yel-2);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;text-align:center}
.pullrow{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;margin:14px 0 10px}

.rates{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.7;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:9px 12px;margin:0;box-shadow:0 3px 0 var(--ink)}

/* ---------- 全屏弹层（结算、招募结果、暂停、设置） ---------- */
.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;overflow-y:auto;animation:fade .2s;
  background:repeating-conic-gradient(from 0deg at 50% 22%,#ffffff0d 0 6deg,#fff0 6deg 12deg),radial-gradient(80% 50% at 50% 22%,#6a4dff,#231748f2 70%),#231748}
.ov h1{font:400 76px/1 var(--font-logo);margin:0;color:var(--yel-1);text-shadow:var(--ol),0 0 30px #ffd23f88;letter-spacing:.08em;animation:pop .35s ease-out}
.ov .stars{font-size:40px;letter-spacing:6px}
.ov .stars .off{color:#ffffff30}
.ov h2{justify-content:center}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:380px}
.rstats div{border:3px solid var(--ink);border-radius:12px;padding:4px 2px;background:var(--cream);color:var(--text);box-shadow:0 3px 0 var(--ink)}
.xprow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:380px}
.xprow span{font:900 12px/1 var(--font-pop);padding:5px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);color:var(--text)}
.xprow .lvup{background:var(--yel-1);animation:pop .35s ease-out both}.xprow .lvup b{color:var(--red-2)}
.rstats span{display:block;font-size:10px;font-weight:900;color:var(--muted)}
.rstats b{font:900 20px/1.1 var(--font-pop);color:var(--yel-2);text-shadow:var(--ol-xs);font-variant-numeric:tabular-nums}
.rew{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rew span{display:flex;align-items:center;gap:4px;padding:3px 12px 3px 6px;border-radius:999px;background:#fff;border:3px solid var(--ink);color:var(--text);font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink)}
.loot{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:100%}
.loot .wi{width:54px;height:54px;animation:pop .4s backwards}
.loot .wi.SSR-c{box-shadow:inset 0 0 0 2px var(--r-ssr),0 0 16px var(--r-ssr),0 3px 0 var(--ink)}
.loot .wi.SR-c{box-shadow:inset 0 0 0 2px var(--r-sr),0 0 10px var(--r-sr),0 3px 0 var(--ink)}
.ov>.tag.hot{font-size:13px;padding:4px 12px}
.ov>.row .btn{min-width:96px}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:400px}
.gres.one{grid-template-columns:140px;justify-content:center}
.gc{position:relative;aspect-ratio:3/4.4;perspective:600px}
.gc .fc{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s;border:3px solid var(--ink)}
.gc .back{background:url(assets/ui_cardback.webp) center/cover}
.gc .front{transform:rotateY(180deg);background:repeating-conic-gradient(from 0deg at 50% 35%,#ffffff22 0 8deg,#fff0 8deg 16deg),radial-gradient(circle at 50% 35%,#fff7c8,var(--rc) 80%);background-size:auto;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:3px;gap:1px}
.gc .front .gart{position:absolute;inset:0;background:center 6%/170% auto no-repeat}
.gc .front::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#231748e0)}
.gc .front>*{position:relative;z-index:1}
.gc .front b{font:900 12px/1.2 var(--font-pop);color:#fff;text-shadow:var(--ol-xs)}
.gc .front .new{position:absolute;top:3px;left:3px;font:900 10px/1.3 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);background:var(--red-2);border:2px solid var(--ink);border-radius:5px;padding:0 4px}
.gc .front .sub{font-size:9px;font-weight:900;color:var(--yel-1)}
.gc .front .rar{font-size:10px;line-height:14px}
.gc.open .back{transform:rotateY(-180deg)} .gc.open .front{transform:rotateY(0)}
.gc.SSR.open .front{box-shadow:0 0 0 2px var(--r-ssr),0 0 24px var(--r-ssr)}
.gc.SR.open .front{box-shadow:0 0 0 2px var(--r-sr),0 0 12px var(--r-sr)}
.gflash{position:absolute;inset:0;z-index:31;pointer-events:none;background:radial-gradient(circle,#fff6d0,#ffcf4a88 40%,transparent 70%);animation:gflash 1s forwards}
#toast{position:absolute;left:50%;transform:translateX(-50%);z-index:40;background:#fff;color:var(--text);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:900;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:toastIn .25s;pointer-events:none;box-shadow:0 4px 0 var(--ink)}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:50;background:linear-gradient(#231748aa,#231748ee),url(assets/lobby_bg.webp) center/cover,var(--bg-3);font:900 30px var(--font-pop);color:#fff;text-shadow:var(--ol)}
.pausebox{display:grid;gap:12px;width:220px}
.setbox{display:grid;gap:8px;width:100%;max-width:330px;text-align:left;background:var(--cream);color:var(--text);border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--ink)}
.setlbl{font-size:11px;font-weight:900;color:var(--muted);margin-top:2px}
.setopt{display:grid;gap:3px;text-align:left;padding:9px 12px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--text)}
.setopt b{font:900 16px/1.2 var(--font-pop)}.setopt span{font-size:11px;font-weight:700;color:var(--muted);line-height:1.5}
.setopt.on{background:linear-gradient(180deg,var(--yel-1),var(--yel-2));box-shadow:0 3px 0 var(--ink)}
.setopt.on span{color:var(--text)}
.helpbox{display:grid;gap:8px;width:100%;max-width:340px;text-align:left}
.helpc{padding:9px 12px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);color:var(--text);box-shadow:0 3px 0 var(--ink)}
.helpc b{display:block;font:900 16px/1.2 var(--font-pop);color:#e0322a;margin-bottom:3px}.helpc p{margin:0;font-size:12px;font-weight:700;line-height:1.6}
/* 失败后的变强指引 */
.guide{display:grid;gap:7px;width:100%;max-width:370px;text-align:left;background:var(--cream);color:var(--text);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.guide>b{font:900 17px/1.1 var(--font-pop);color:#e0322a}
.guide .gl{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;line-height:1.45}
.guide .gl span{flex:1;min-width:0}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes burst{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes flash{0%{color:#fff;text-shadow:0 0 10px #fff}}
@keyframes gflash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 结算：胜利金光旋转，失败偏冷灰 */
.ov .muted{color:#d9d0ff;font-weight:800}
.ov.win h1{font-size:84px}
.winrays{position:absolute;left:50%;top:16%;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:-1;pointer-events:none;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#fff59a55 0 8deg,#fff0 8deg 20deg);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent);animation:spin 14s linear infinite}
.ov.win{isolation:isolate}
@keyframes spin{to{transform:rotate(360deg)}}
.ov.lose{background:radial-gradient(80% 50% at 50% 22%,#5a4a7a,#1d1636f2 70%),#1d1636}
.ov.lose h1{color:#c9c0e6;text-shadow:var(--ol),0 0 24px #ff5a5f55}

/* 招募页：SSR 登场武将 */
.pickup{margin:0 0 10px;padding:9px 10px 10px;border-radius:16px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--text)}
.pk-t{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pk-t b{font:900 17px/1 var(--font-pop)}
.pk-t small{font-size:10.5px;font-weight:800;color:var(--muted)}
.pk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pk{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:0;color:var(--text)}
.pk .head{width:42px;height:42px;filter:grayscale(.85) brightness(.85)}
.pk.own .head{filter:none;box-shadow:inset 0 0 0 2px var(--r-ssr),0 0 10px #ffcf3a99}
.pk span:last-child{font:900 11px/1 var(--font-pop)}
.pk .head .el{width:16px;height:16px;font-size:9px}

/* 回合制战斗：画布铺满整屏（多出来的高度给战场），顶部让开刘海 */

#battle.tall .bstage{width:100%;height:100%;aspect-ratio:auto}

/* 卡上等级上限、小屏 */
.cc-name i small{font-size:8.5px;opacity:.8}
@media (max-width:380px){.pstat{grid-template-columns:1.1fr 1fr .7fr}.ps-el b{font-size:10.5px}.ps-pw b{font-size:22px}.cc-name b{font-size:12.5px}.cc-row{font-size:11px;padding:1px 4px}.fn span{font-size:10px}.seg-b{font-size:14px}.seg-b .sico{width:22px;height:22px}}
/* 结算掉落：图标 + 名字 */
.lw{display:grid;justify-items:center;gap:3px;width:62px;animation:pop .4s backwards}
.lw .wi{width:54px;height:54px}
.lw small{font:900 10.5px/1.2 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);white-space:nowrap;max-width:68px;overflow:hidden;text-overflow:ellipsis}
.lw small.SSR{color:var(--yel-1)}.lw small.SR{color:#f0b8ff}
.loot .lw .wi.SSR-c{box-shadow:inset 0 0 0 2px var(--r-ssr),0 0 16px var(--r-ssr),0 3px 0 var(--ink)}
/* 招募结果：属性球、SSR 全屏立绘出场 */
.gc .front .gel{position:absolute;left:3px;top:3px;width:18px;height:18px;font-size:10px}
.gc .front .new{left:auto;right:3px}
.ssrsplash{position:absolute;inset:0;z-index:35;cursor:pointer;display:grid;place-items:center;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff2a 0 7deg,#fff0 7deg 14deg),radial-gradient(circle at 50% 45%,var(--e1),var(--e2) 75%);animation:splash 2.1s ease-in-out forwards}
.ssrsplash img{position:absolute;left:50%;bottom:0;height:88%;width:auto;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink));animation:heroIn .5s ease-out}
.ss-n{position:absolute;left:16px;bottom:18%;display:grid;gap:4px;justify-items:start}
.ss-n b{font:900 54px/1 var(--font-pop);color:#fff;text-shadow:var(--ol)}
.ss-n small{font:900 22px/1 var(--font-pop);color:var(--yel-1);text-shadow:var(--ol-s)}
.ss-n .rar{font-size:18px;line-height:24px;padding:0 10px}
@keyframes splash{0%{opacity:0;transform:scale(1.1)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;visibility:hidden}}
/* 标题画面 */
.title{position:absolute;inset:0;z-index:60;display:grid;place-items:center;align-content:center;gap:10px;cursor:pointer;
  background:repeating-conic-gradient(from 0deg at 50% 40%,#ffffff12 0 6deg,#fff0 6deg 12deg),linear-gradient(180deg,#231748aa,#231748ee),url(assets/lobby_bg.webp) center/cover,var(--bg-3)}
.title .tl{font:400 76px/1 var(--font-logo);color:var(--yel-1);text-shadow:var(--ol),0 0 30px #ffd23f99;letter-spacing:.06em;animation:pop .5s ease-out}
.title .ts{font:900 18px/1 var(--font-pop);color:#fff;text-shadow:var(--ol-s);letter-spacing:.2em}

@keyframes fadeOut{to{opacity:0;visibility:hidden}}
/* 暂停按钮画两条竖线 */
#bPause{font-size:0}

#bPause::before{left:10px}#bPause::after{right:10px}

/* 第二轮：一键编成那一行固定在底栏上方 */
.pact{position:sticky;bottom:-18px;z-index:4;margin:10px -12px 6px;padding:8px 12px 12px;background:linear-gradient(180deg,#2d1f8600,#2d1f86f2 28%,#2a1c80)}
/* Pop 小图标 */
.pi{width:26px;height:26px;flex:none;filter:drop-shadow(0 1.5px 0 #231748)}

.fn:first-child{background:linear-gradient(180deg,#ffffff5a 0 44%,#fff0 44%),linear-gradient(180deg,var(--yel-1),var(--yel-2) 55%,var(--yel-3))}
/* 武将页签：主将头像 */
.tab .tico.thead{display:grid;place-items:center;background:linear-gradient(180deg,#fff,#e6defc)}

.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}

.wpa{font:900 12px/1.2 var(--font-pop);color:#e0322a;margin-top:3px}
.wpn{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 小修 */
.gstat span{white-space:nowrap}
.cc-bt{background:#231748b0;border-radius:6px;padding:0 3px;line-height:1.3}
.cc-bt i{color:#ffffff70}
.rew em{font-style:normal;font-size:12px}
.gc .front .new{top:auto;bottom:22px;left:50%;right:auto;transform:translateX(-50%);white-space:nowrap}

.gc.pre .back{box-shadow:0 0 0 3px var(--rc),0 0 22px var(--rc);animation:shake .35s ease-in-out}

.gres{gap:7px 5px}
