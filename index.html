/* ───────── 11/08 出击准备（制作人 1A：碧蓝幻想选支援 + 确认队伍合成一页）───────── */
.prep .k-p2b{display:grid;gap:14px;padding-bottom:16px}
.prep-st{position:relative;display:grid;gap:7px;padding:14px 12px 12px;background:#fff8e6;color:#120a30;border:3px solid #120a30;box-shadow:5px 5px 0 #120a30}
.prep-st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--pc,#b45cff)}
.prep-st.e-huo{--pc:#ff4b3a}.prep-st.e-shui{--pc:#2f8cff}.prep-st.e-mu{--pc:#3fbf5a}.prep-st.e-jin{--pc:#ffc61a}.prep-st.e-tu{--pc:#a35cff}
.prep-tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prep-no{padding:2px 10px;background:#120a30;color:#ffd23f;font:900 15px/1.3 var(--font-pop);transform:rotate(-2deg)}
.prep-nm{font:900 20px/1.2 var(--font-pop)}
.prep-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:800 13px/1.3 var(--font-pop)}
.prep-st .row.foes{margin:0}
.prep-rw{display:inline-flex;align-items:center;gap:4px;font:900 13px/1 var(--font-pop);color:#b0560a}
.prep-pw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:2px}
.prep-pw span{display:grid;gap:1px}.prep-pw i{font:800 11px/1 var(--font-pop);font-style:normal;color:#5a4e86}.prep-pw b{font:400 20px/1 var(--font-num)}
.prep-pw span:last-child{text-align:right}
.prep-bar{height:12px;background:#120a30;border:2px solid #120a30;transform:skewX(-14deg);overflow:hidden}
.prep-bar i{display:block;height:100%;background:linear-gradient(90deg,#57e389,#3fc4ff)}
.prep-pw.low .prep-bar i{background:linear-gradient(90deg,#ff7a3a,#e2264d)}.prep-pw.low span:first-child b{color:#e2264d}
.prep-warn{margin:0;font:800 12px/1.4 var(--font-pop);color:#e2264d}
.prep-tm{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.prep-pe{display:flex;align-items:center;gap:6px;font:900 13px/1 var(--font-pop)}
.prep-ms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.prep-m{display:grid;justify-items:center;gap:2px;min-width:0}
.prep-m b{max-width:100%;font:900 12px/1.2 var(--font-pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prep-m small{font:400 11px/1 var(--font-num);color:#b0560a}
.prep-sl{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.prep-s{flex:none;display:grid;justify-items:center;gap:3px;width:86px;padding:8px 4px 6px;background:#fff8e6;border:3px solid #120a30;box-shadow:3px 3px 0 #120a30;color:#120a30;cursor:pointer}
.prep-s b{font:900 12px/1.2 var(--font-pop);white-space:nowrap}.prep-s small{font:400 13px/1 var(--font-num);color:#1f9e6a}
.prep-s.off{filter:grayscale(.8);opacity:.7}.prep-s.off small{font:800 11px/1 var(--font-pop);color:#7a7096}
.prep-s.on{background:#ffd23f;box-shadow:3px 3px 0 #120a30,0 0 0 3px #ff3d8f;transform:translateY(-2px)}
.prep-s.none i{display:grid;place-items:center;width:52px;height:52px;font:900 30px/1 var(--font-pop);font-style:normal;color:#7a7096}
.prep .k-foot .k-btn.wide{width:100%}
.prep-ret{position:sticky;top:0;z-index:5;display:block;width:100%;min-height:44px;margin-bottom:8px;background:#ffd23f;color:#120a30;border:3px solid #120a30;box-shadow:4px 4px 0 #120a30;font:900 16px/1 var(--font-pop);cursor:pointer}
.prep .k-p2b>*{min-width:0}
.prep-ms{grid-template-columns:repeat(5,minmax(0,1fr))}
.prep-st .row.foes small{font-size:11px}
.prep-s{width:78px;padding:6px 3px 5px}.prep-s .emb{width:44px !important;height:44px !important}

/* 11/08 马格纳一阶 · 讨伐页：素材背包条、四档阶梯（2×2）、召集令 */
.rinv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.rinv .rmat{display:grid;grid-template-columns:28px 1fr;align-items:center;column-gap:3px;row-gap:1px;padding:5px 5px 4px;border:2.5px solid var(--ink);border-radius:10px;background:#1b1238;box-shadow:0 3px 0 var(--ink);color:#fff}
.rinv .rmat .uic{width:28px;height:28px}
.rinv .rmat b{font:900 16px/1 var(--font-pop);text-align:center}
.rinv .rmat small{grid-column:1/-1;text-align:center;font-size:11px;font-weight:800;color:#cfc4ff;white-space:nowrap}
.raid .rh .rcall{margin-left:auto;display:flex;align-items:center;gap:2px;padding:2px 8px 2px 2px;border:2.5px solid var(--ink);border-radius:10px;background:#fff8e6}
.raid .rh .rcall .uic{width:26px;height:26px}
.raid .rh .rcall b{font:900 16px/1 var(--font-pop);color:var(--ink);text-shadow:none}
.raid .rtiers{grid-template-columns:1fr 1fr;gap:8px}
.raid .rt{grid-template-columns:1fr auto;align-items:center;text-align:left;padding:8px 10px;row-gap:3px}
.raid .rt b{font-size:16px}
.raid .rt .rms{display:flex;gap:1px;justify-self:end}
.raid .rt .rmi{display:block;width:24px;height:24px}
.raid .rt .rmi .uic{width:24px;height:24px}
.raid .rt small{grid-column:1/-1;font-size:11px}
.raid .rt .rhq{grid-column:1/-1;display:flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:900}
.raid .rt .rhq .uic{width:18px;height:18px}
.raid .rt .rhq.no{color:#ffb3b3}
.raid .rt.t0{--bf:#2f9e5a}.raid .rt.t1{--bf:#2f7ae0}.raid .rt.t2{--bf:#e08a12}.raid .rt.t3{--bf:#5a1650}
.raid .rt.t3 b{color:#ffd23f}
.raid .rt:disabled{--bf:#6b6680}
.raid .rt .rwon{position:absolute;right:-4px;top:-10px;font-style:normal;font-size:11px;font-weight:900;color:var(--ink) !important;-webkit-text-stroke:0;text-shadow:none;background:#7dffa0;border:2px solid var(--ink);border-radius:8px;padding:1px 5px;transform:rotate(4deg)}

/* 11/08 马格纳一阶 · 讨伐结算：标题、讨伐贡献排名、宝箱（先晃再开，金箱带光） */
.rs-raid{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;background:#120a30;border:2.5px solid #ffd23f;box-shadow:3px 3px 0 #0008;transform:rotate(-1.5deg);color:#fff;animation:rsUp .3s .4s both}
.rs-raid .uic{width:30px;height:30px}
.rs-raid b{font:900 18px/1 var(--font-pop);color:#ffd23f}
.rs-raid span{font:900 16px/1 var(--font-pop)}
.rs-raid small{font-size:12px;font-weight:800;color:#cfc4ff;margin-left:4px}
.rs-rank{display:grid;gap:5px}
.rs-rank .rk{position:relative;display:grid;grid-template-columns:22px 34px 1fr auto;align-items:center;gap:6px;padding:4px 6px;background:#2a1d55;border:2px solid #120a30;animation:rsUp .3s var(--d) both}
.rs-rank .rk.me{grid-template-columns:22px 1fr auto;background:#4a1d6a;border-color:#ffd23f}
.rs-rank .rk-n{font:900 16px/1 var(--font-pop);font-style:normal;color:#ffd23f;text-align:center}
.rs-rank .rk-f{width:34px;height:34px;border:2px solid #120a30;background-color:#5a4a8a}
.rs-rank .rk b{position:relative;z-index:1;display:grid;justify-items:start;text-align:left;font-size:13px;font-weight:900;color:#fff;line-height:1.15}
.rs-rank .rk b small{font-size:11px;font-weight:800;color:#cfc4ff}
.rs-rank .rk-bar{position:absolute;left:0;top:0;bottom:0;width:100%;pointer-events:none}
.rs-rank .rk-bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#ff3d8f33,#ff3d8f11);animation:rsBar .6s var(--d) both}
@keyframes rsBar{from{width:0}}
.rs-rank .rk em{position:relative;z-index:1;display:grid;justify-items:end;font-style:normal;font:900 15px/1.05 var(--font-pop);color:#fff}
.rs-rank .rk em small{font-size:11px;color:#ffd23f}
.rs-rank .rk-mvp{position:absolute;left:-12px;top:-16px;width:46px;transform:rotate(-10deg);z-index:2;animation:rsSlam .35s calc(var(--d) + .4s) both}
.rs-chest{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:2px 0 8px;padding:6px;background:#120a30;border:2px solid #3a2a6a}
.rs-chest .ch-box{position:relative;display:grid;justify-items:center}
.rs-chest .ch-box .uic{position:relative;z-index:1;width:84px;height:84px;animation:chShake .9s 1.2s both,chPop .35s 2.1s both}
.rs-chest .ch-nm{font:900 13px/1 var(--font-pop);color:#fff;margin-top:-4px;animation:rsUp .3s 2.1s both}
.rs-chest.c-silver .ch-nm{color:#8fd8ff}.rs-chest.c-gold .ch-nm{color:#ffd23f}
.rs-chest.c-gold{border-color:#ffd23f;background:radial-gradient(circle at 18% 50%,#5a3d0a,#120a30 60%)}
.rs-chest .ch-rays{position:absolute;left:50%;top:42%;width:150px;height:150px;margin:-75px;background:repeating-conic-gradient(#ffd23f88 0 10deg,transparent 10deg 24deg);border-radius:50%;-webkit-mask:radial-gradient(#000 20%,transparent 70%);mask:radial-gradient(#000 20%,transparent 70%);animation:chRays 4s linear infinite,rsUp .4s 2.1s both}
.rs-chest .ch-got{display:flex;flex-wrap:wrap;gap:6px}
.rs-chest .ch-m{display:grid;grid-template-columns:30px auto;grid-template-rows:auto auto;align-items:center;column-gap:3px;color:#fff;animation:rsDrop .42s cubic-bezier(.3,1.6,.6,1) var(--d) both}
.rs-chest .ch-m .uic{grid-row:1/3;width:30px;height:30px}
.rs-chest .ch-m b{font:900 16px/1 var(--font-pop)}
.rs-chest .ch-m small{font-size:11px;font-weight:800;color:#cfc4ff}
@keyframes chShake{0%,100%{transform:none}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg) scale(1.05)}60%{transform:rotate(6deg) scale(1.08)}75%{transform:rotate(-4deg) scale(1.1)}}
@keyframes chPop{0%{transform:scale(1.1)}40%{transform:scale(1.35);filter:brightness(1.8)}100%{transform:none}}
@keyframes chRays{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rs-chest .ch-box .uic,.rs-chest .ch-rays{animation:none}}
.prep-mat{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:900}
.prep-mat .uic{width:22px;height:22px}
.prep-hq{display:grid !important;grid-template-columns:1fr 1fr;gap:4px 8px}
.prep-hq span{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:900}
.prep-hq .uic{width:22px;height:22px}

/* 11/08 马格纳二期 · 天井条（扭蛋页）、天井兑换面板、神装标签和立绘 */
.spark{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:6px;margin:8px 0 2px;padding:6px 8px;background:#1b1238;border:2.5px solid var(--ink);box-shadow:3px 3px 0 #0008;color:#fff}
.spark .sp-ic .uic{width:34px;height:34px}
.spark .sp-m{display:grid;gap:2px}
.spark .sp-m b{font:900 13px/1 var(--font-pop);color:#ffd23f}
.spark .sp-bar{display:block;height:8px;background:#0b0620;border:2px solid var(--ink);transform:skewX(-12deg)}
.spark .sp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff3d8f)}
.spark .sp-m small{font-size:11px;font-weight:800;color:#cfc4ff}
.spark .sp-sh{display:flex;align-items:center;gap:1px}
.spark .sp-sh .uic{width:26px;height:26px}
.spark .sp-sh b{font:900 14px/1 var(--font-pop)}
.spark .sp-go{min-width:64px;padding:8px 10px;font-size:13px}
.spark.full{border-color:#ffd23f;animation:spGlow 1.4s ease-in-out infinite}
@keyframes spGlow{50%{box-shadow:3px 3px 0 #0008,0 0 14px #ffd23f99}}
.spsheet .sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.spsheet .sp-c{padding:0;border:0;background:none;position:relative}
.spsheet .sp-c.on{outline:3px solid #ffd23f;outline-offset:1px}
.spsheet .sp-c small{font-size:11px}
.spsheet .sp-c small.nw{color:#ff3d8f}
.ov.gacha.spray .gc .c4-team.gsumt.god{background:linear-gradient(90deg,#ffd23f,#ff3d8f);color:#120a30}
.ssrsplash.god img{object-fit:contain;filter:drop-shadow(0 0 30px #ffd23f88)}
.ssrsplash.god .rar.SSR{background:linear-gradient(90deg,#ffd23f,#ff3d8f);color:#120a30}
@media (max-width:370px){.spsheet .sp-grid{grid-template-columns:repeat(4,1fr)}}
.skind.god{background:linear-gradient(90deg,#ffd23f,#ff3d8f);color:#120a30}
.spsheet .sp-h{margin:6px 0 6px;font:900 15px/1 var(--font-pop);color:var(--ink)}
.spsheet .sp-c b{color:var(--ink) !important;text-shadow:none !important;font-size:12px}
.spsheet .sp-c small{color:#6b5f8a}
.ssrsplash.god .rar.SSR{-webkit-text-stroke:0;text-shadow:none}
.spsheet .sh-foot{position:sticky;bottom:-17px;z-index:2;background:#fffdf7;padding:8px 0 18px;margin:4px -12px 0;padding-left:12px;padding-right:12px}

/* 11/08 审查修正：讨伐页说明、可点的素材、档位掉落文字、素材说明面板、出击准备胜率 */
.backbar{background:#1b0f3d !important;box-shadow:0 4px 0 #0b0620}
.rinv .rmat{font:inherit;cursor:pointer;text-align:left}
.rinv .rmat:active{transform:translate(2px,2px)}
.rguide{display:grid;gap:4px;margin:0 0 10px;padding:8px 10px;background:#fff8e6;border:2.5px solid var(--ink);box-shadow:3px 3px 0 #0008;color:var(--ink)}
.rguide span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;line-height:1.3}
.rguide i{flex:none;display:grid;place-items:center;width:20px;height:20px;font-style:normal;font:900 13px/1 var(--font-pop);background:#ff3d8f;color:#fff;border:2px solid var(--ink)}
.raid .rh .rcall{font:inherit;cursor:pointer}
.raid .rn[role=button]{cursor:pointer}
.raid .rt .rmt{grid-column:1/-1;font-size:11px;font-weight:800;opacity:.9;line-height:1.2}
.raid .rt.off{--bf:#6b6680;opacity:.85}
.msheet .ms-top{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:4px 0 10px}
.msheet .ms-top .uic,.msheet .ms-top .wi{width:64px;height:64px}
.msheet .ms-top p{margin:0;font-size:13px;font-weight:800;line-height:1.5;color:var(--ink)}
.msheet .ms-top p b{display:block;margin-top:4px;font:900 15px/1 var(--font-pop)}
.msheet .sh-foot.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prep-ch{margin:6px 0 0;font-size:13px;font-weight:900}
.prep-ch.c-hi{color:#1f9e5a}.prep-ch.c-mid{color:#d98a00}.prep-ch.c-lo{color:#e0284a}
.prep-why{margin:0 0 6px;font-size:12px;font-weight:800;color:#e0284a;line-height:1.4}
.prep-hq .prep-brk{grid-column:1/-1}
.rs-c.ref{background:#d9fbe6}
.rs-chest .ch-m.wep .wi{grid-row:1/3;width:40px;height:40px}
.rs-chest .ch-m.wep{grid-template-columns:44px auto}
.ov.loconf{position:fixed !important;inset:0;z-index:80 !important}
.raid .rh .rcall{min-height:44px;min-width:56px;justify-content:center}

/* 11/08 二期审查修正：神装立绘（大图、去黑底、停到点击）、壁画兽系别小章、天井面板、神装展示位 */
.ssrsplash.god{animation:splashIn .35s ease-out both}
@keyframes splashIn{from{opacity:0;transform:scale(1.08)}}
.ssrsplash.god img{left:50%;top:6%;bottom:auto;width:min(96vw,560px);height:auto;transform:translateX(-50%);mix-blend-mode:screen;filter:none}
.ssrsplash.god .ss-n{left:0;right:0;bottom:0;padding:14px 16px 22px;background:linear-gradient(0deg,#0b0620f2 70%,#0b062000);justify-items:center;text-align:center}
.ssrsplash.god .ss-n b{font-size:44px}
.ssrsplash .ss-tap{position:absolute;right:14px;bottom:10px;z-index:2;font-style:normal;font:900 13px/1 var(--font-pop);color:#fff;opacity:.85;animation:spGlow 1.2s ease-in-out infinite}
.ov.gacha:has(.ssrsplash:not(.wait)) .gcan{visibility:hidden}
.c4-team.skt{font-size:11px}
.c4-team.skt.k-raid{background:#1f9e6a}.c4-team.skt.k-gacha{background:#2f7ae0}.c4-team.skt.k-god{background:linear-gradient(90deg,#ffd23f,#ff3d8f);color:#120a30}
.spark .sp-sh{border:0;background:none;color:#fff;font:inherit;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:2px;cursor:pointer;min-height:44px}
.spark .sp-sh small{grid-column:1/-1;font-size:11px;font-weight:800;color:#cfc4ff;text-align:center}
.spsheet .sp-grid.g5{grid-template-columns:repeat(5,1fr)}
.spsheet .sp-c.dim{opacity:.6}
.spsheet .sp-c small.up{color:#ff3d8f;font-weight:900}
.spsheet .sp-c small.dim{color:#8a7fa8}
.spsheet .sh-foot .btn{width:100%}
.msheet .ms-img{display:block;width:64px;height:64px;background-size:cover;background-position:center 15%;border:2.5px solid var(--ink)}
.spdone .spd-img{width:min(70vw,260px);aspect-ratio:1;margin:4px auto 8px;background-size:cover;background-position:center 15%;border:3px solid var(--ink);box-shadow:4px 4px 0 #0008}
.spdone .spd-n{display:grid;justify-items:center;gap:4px;margin:0 0 10px;color:var(--ink)}
.spdone .spd-n b{font:900 22px/1 var(--font-pop)}
.spdone .spd-n small{font-size:12px;font-weight:900;color:#e0284a}
.godrow{margin:10px 0 4px;padding:8px;background:#1b1238;border:2.5px solid #ffd23f;box-shadow:3px 3px 0 #0008}
.godrow .gr-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.godrow .gr-t b{font:900 15px/1 var(--font-pop);color:#ffd23f}
.godrow .gr-t small{font-size:12px;font-weight:800;color:#cfc4ff}
.godrow .gr-l{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.godrow .gr-c{display:grid;gap:3px;justify-items:center;padding:0;border:0;background:none;color:#fff;cursor:pointer}
.godrow .gr-c span{display:block;width:100%;aspect-ratio:1;background-size:cover;background-position:center;border:2px solid var(--ink);box-shadow:2px 2px 0 #0008}
.godrow .gr-c small{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.banner .sub{font-size:12px !important}
@media (max-width:370px){.spsheet .sp-grid.g5{grid-template-columns:repeat(5,1fr);gap:4px}}
.ssrsplash.god{background:repeating-conic-gradient(from 0deg at 50% 38%,#ffffff14 0 7deg,#fff0 7deg 14deg),radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--e1) 55%,#0b0620) 0,#0b0620 62%)}
.ssrsplash.god img{top:13%}
/* 11/08 马格纳二阶「暴走」：素材背包 5 格、暴走档占一整行（暗红 + 霓虹描边）、暴走令计数、暴走名品一行、觉醒章、护盾说明 */
.rinv{grid-template-columns:repeat(5,1fr)}
.raid .rt.rx{grid-column:1/-1;--bf:#4a0718;box-shadow:inset 0 0 0 2px #ff3d5a,0 0 14px #ff3d5a66,3px 4px 0 var(--ink)}
.raid .rt.rx b{color:#ff8fa0;letter-spacing:.08em}
.raid .rt.rx.off{--bf:#3b2a33}
.raid .rh .rcall.x2{margin-left:6px;background:#2a0c14;border-color:#ff3d5a}
.raid .rh .rcall.x2 b{color:#ffb3bf}
.raid .rdrop.r2{grid-template-columns:repeat(3,1fr) 1fr;position:relative;padding:14px 4px 4px;border:2px dashed #ff3d5a88;border-radius:10px;background:#2a0c1455}
.raid .rdrop.r2 .r2t{position:absolute;left:8px;top:-9px;font-style:normal;font-size:11px;font-weight:900;color:#fff;background:#c4153a;border:2px solid var(--ink);padding:0 6px;transform:rotate(-2deg)}
.skind.aw{display:inline-flex;align-items:center;gap:2px;background:linear-gradient(90deg,#7a5cff,#ff3d8f);color:#fff}
.skind.aw .uic{width:16px;height:16px}
.prep-hq .prep-sh{color:#9fe3ff}
.raid .rt .rmt,.raid .rt .rhq{white-space:normal}
.raid .rt.rx{grid-template-columns:auto 1fr auto;column-gap:8px}

/* 11/08 二阶审查修正：结算素材格图标尺寸（P1-5）、出击准备暴走立绘、暴走解放卡、暴走档更亮（P1-3 / P2-9） */
.rs-c .uic{width:22px;height:22px;flex:none}

.prep-st.rx .prep-tt{min-height:96px;padding-right:128px;flex-wrap:wrap;align-content:flex-start;position:relative;z-index:1}
.prep-st.rx .prep-tt+.prep-row{padding-right:128px;position:relative;z-index:1}
.prep-st.rx .prep-hq{grid-template-columns:1fr}
.xu-card{padding-top:12px;background:linear-gradient(170deg,#2a0c14 0%,#5a1024 100%);border-color:#ff3d5a}
.xu-card .xu-art{display:block;height:200px;margin:0 auto 6px;filter:drop-shadow(4px 5px 0 #000a)}
.xu-card small{color:#ffd23f}.xu-card h3{color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 #000}.xu-card p{color:#ffd8de}
.raid .rt.rx{--bf:#7a0f2c;box-shadow:inset 0 0 0 3px #ff5a75,0 0 18px #ff3d5aaa,3px 4px 0 var(--ink)}
.raid .rt.rx .rxh{object-fit:cover;object-position:50% 20%}
.raid .rt.rx b{color:#fff;font-size:18px;text-shadow:2px 2px 0 #c4153a}
.raid .rt.rx.off{--bf:#4a2a36;box-shadow:inset 0 0 0 2px #ff5a7566,3px 4px 0 var(--ink)}
.raid .rt.rx.off .rxh{filter:grayscale(.6) brightness(.7)}
.raid .rt.rx .rfirst{top:auto;bottom:-10px}
/* 11/08 马格纳三阶「终焉」：黑金配色（暴走是暗红） */
.raid .rt.rx.fz{--bf:#1d1608;box-shadow:inset 0 0 0 3px #ffd23f,0 0 18px #ffd23faa,3px 4px 0 var(--ink)}

.raid .rt.rx.fz .rxh{border-color:#ffd23f}
.raid .rt.rx.fz.off{--bf:#3a3324;box-shadow:inset 0 0 0 2px #ffd23f66,3px 4px 0 var(--ink)}
.raid .rdrop.r2.named3{border-color:#ffd23f99;background:#2a220855}
.raid .rdrop.r2.named3 .r2t{background:#b88a00}
.prep-st.rx.fz{box-shadow:inset 0 0 0 3px #ffd23f}
.prep-st.rx.fz .prep-bh{border-color:#ffd23f}
.prep-hq .prep-dm{color:#ffd982}
.xunl.fz .xu-card{background:linear-gradient(170deg,#1d1608 0%,#4a3a10 100%);border-color:#ffd23f}

/* 11/08 三阶审查 P1-5：三张门票不再挤在队长名字旁边（以前名字被挤成竖排）→ 名字下面一排小芯片；素材背包 3 列 × 2 行 */
.raid .rtix{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px}

.rinv{grid-template-columns:repeat(3,1fr)}

.prep-hq .prep-dm,.prep-hq .prep-sh{color:#5a3a00;background:#fff1c4;padding:2px 6px;border-left:3px solid #ffb000}

.raid .rtix .rcall{display:flex;align-items:center;font:inherit;cursor:pointer;border:2.5px solid var(--ink);border-radius:10px;background:#fff8e6;box-shadow:0 2px 0 var(--ink)}
.raid .rtix .rcall .uic{width:26px;height:26px}
.raid .rtix .rcall b{font:900 16px/1 var(--font-pop);color:var(--ink);text-shadow:none}
.raid .rtix .rcall.x2{background:#2a0c14;border-color:#ff3d5a}.raid .rtix .rcall.x2 b{color:#ffb3bf}
.raid .rtix .rcall.fz{background:#1d1608;border-color:#ffd23f}.raid .rtix .rcall.fz b{color:#ffe58a}

/* 11/08 出击准备页排版：内容从上往下排（以前格子被拉高，行和行之间空出一大截、队伍框下面一大块白）；关卡卡片头放战场图 */
.prep .k-p2b{align-content:start}

.prep-ban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#120a3000 30%,#120a30cc 100%)}

.prep-ban .prep-no{background:#ffd23f;color:#120a30}
.prep-ban .prep-nm{font-size:24px;color:#fff;text-shadow:var(--ol-xs)}
.prep-st .row.foes small{font:800 13px/1.3 var(--font-pop);color:#120a30}
.prep-st .stars{margin-left:auto;font-size:17px}
.prep-st .stars .off{color:#fff;text-shadow:var(--ol-xs)}
.prep-ban{background-position:center 0;background-size:100% auto}
.prep-nf{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center}
.prep-nf+.prep-nf{margin-top:10px}
.prep-nf img{width:76px;height:76px;object-fit:contain;background:#ece4cf;border:3px solid #120a30}
.prep-nf b{display:flex;align-items:center;gap:4px;font:900 15px/1.2 var(--font-pop)}.prep-nf b .uic{width:22px;height:22px}
.prep-nf p{margin:4px 0 0;font:700 13px/1.5 var(--font-ui);color:#3a3060}

/* 散花一投 · 旧页面元素换成「街头贴纸」（11/07 UI 规范 v2 全局替换）
   app.css 里各页面原来的按钮、标签、弹窗、抽屉、卡片，统一在这里改成斜切角 + 硬投影 + 胶带；新写的页面直接用 kit.js 的组件，不要再往这里加 */

/* ── 按钮（.btn，旧写法）：和 k-btn 同一套样子 ── */
.btn{--cp:12px;--bf:#ff4d6a;--bo:var(--ink2);border:0 !important;border-radius:0 !important;background:none !important;box-shadow:none !important;isolation:isolate;
  color:#fff;text-shadow:var(--ol-xs);filter:drop-shadow(4px 4px 0 var(--ink2));min-height:var(--hit)}
.btn::before{content:"" !important;position:absolute;inset:0 !important;z-index:-1;border-radius:0 !important;opacity:1 !important;filter:none !important;-webkit-mask-image:none !important;mask-image:none !important;
  background:var(--bo) !important;clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.btn::after{content:"";position:absolute;inset:3px;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 0 12%,#ffffff40 12% 16%,transparent 16%),var(--bf);
  clip-path:polygon(0 0,calc(100% - var(--cp)) 0,100% var(--cp),100% 100%,var(--cp) 100%,0 calc(100% - var(--cp)))}
.btn.gold{--bf:#ffe066;color:var(--ink2);text-shadow:none}
.btn.blue{--bf:#5fd4ff;color:var(--ink2);text-shadow:none}
.btn.green{--bf:#7dffb0;color:var(--ink2);text-shadow:none}
.btn.ghost,.btn.dk{--bf:var(--ink2);--bo:#fff;color:#fff;text-shadow:none}
.btn.warn{--bf:#ff4d6a;color:#fff}
.btn.small{--cp:8px;filter:drop-shadow(3px 3px 0 var(--ink2))}
.btn small{text-shadow:none;color:inherit;opacity:.85;font-size:var(--fs-1)}
.btn.ghost small{color:#cfc4ff}
.btn:active{transform:translate(3px,3px) !important;filter:drop-shadow(1px 1px 0 var(--ink2))}
.btn[disabled],.btn:disabled{--bf:repeating-linear-gradient(-45deg,#8e88a8 0 6px,#a49fbb 6px 12px);color:#3b3654;text-shadow:none;opacity:1;filter:drop-shadow(4px 4px 0 var(--ink2)) grayscale(.2)}

/* ── 标签：.chip（可点）= 斜贴纸；.tag（只看）= 小黑条 ── */
.chip,.k-filt .k-chip{border:var(--bd-1) solid var(--ink2) !important;border-radius:0 !important;background:#fff;color:var(--ink2);box-shadow:2px 2px 0 var(--ink2) !important;transform:skewX(-10deg);min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-2)}
.chip>*,.k-filt .k-chip>*{transform:skewX(10deg)}
.chip[aria-pressed="true"],.k-chip[aria-pressed="true"]{background:#ffe066 !important;transform:skewX(-10deg) translateY(-1px)}
.k-chip{cursor:pointer}
.tag{border-radius:0;border:0;background:var(--ink2);color:#fff;font-size:var(--fs-1);padding:2px 8px;transform:skewX(-10deg)}
.tag.hot{background:#ffe066;color:var(--ink2)}.tag.good{background:#2fd47a;color:var(--ink2);text-shadow:none}.tag.bad{background:#ff4d6a}.tag.big{background:#ff3d8f}
.k-filt{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.k-fl{font:900 var(--fs-1)/1 var(--font-pop);color:#cfc4ff;margin-right:2px}
.k-filt .role-ic{width:22px;height:22px}
.filters{gap:var(--sp-2)}

/* ── 一级页里的旧分页 .seg（地图等）→ 胶带 ── */
.seg{gap:var(--sp-1);padding:var(--sp-2) var(--sp-1);background:var(--dots),var(--ink2)}
.seg-b{border:0 !important;border-radius:0 !important;box-shadow:none !important;background:#9d90c8 !important;color:var(--ink2) !important;text-shadow:none !important;opacity:.78;clip-path:var(--tape-cut);transform:rotate(1.2deg)}
.seg-b[aria-pressed="true"]{opacity:1;background:var(--tape-y) !important;transform:rotate(-3deg) scale(1.06);filter:drop-shadow(3px 3px 0 #ff3d8f)}

/* ── 二级页（详情 .sheet.dp）：黑色网点顶栏 + 方角数值牌 ── */
.sheet.dp{background:#1d1140}
.dp-top.k-p2h{height:64px}
.dp-top.k-p2h b{font-size:var(--fs-4)}
.dp-stats div{border-radius:0 !important;border:0 !important;background:var(--dots),var(--ink2) !important;box-shadow:3px 3px 0 #000 !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.dp-stats span{font-size:var(--fs-1) !important;color:#cfc4ff !important}
.dp-body{padding-top:var(--sp-4)}
.dp-body .k-sec,.dp-card{margin-top:var(--sp-5)}
.dp-card{border-radius:0 !important;border:var(--bd-2) solid var(--ink2) !important;background:#fffdf7 !important;box-shadow:5px 5px 0 var(--ink2) !important}
.k-tip{margin:0 0 var(--sp-3);font:700 var(--fs-2)/1.5 var(--font-pop);color:#4a3d8c}
.k-rows{display:grid;gap:var(--sp-1);margin:var(--sp-3) 0}
.k-sec .k-cost,.k-sec .k-lvbar{margin:var(--sp-3) 0}
.k-sec .k-btns{margin-top:var(--sp-4)}
.k-row.low b{color:#e0322a}
.dp-note{font-size:var(--fs-1) !important;line-height:1.5}
.dp-foot.k-foot{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row}
.dp-foot.k-foot .wide,.dp-foot.k-foot .dp-state{grid-column:1/-1}
.dp-state{border-radius:0 !important;transform:skewX(-8deg)}

/* ── 三级抽屉（旧的 .scrim > .sheet.pop）：方纸片 + 斜切 + 黄色斜纹标题 ── */
.scrim:not(.full)>.sheet{border-radius:0 !important;border:0 !important;border-top:var(--bd-3) solid var(--ink2) !important;background:#fffdf7 !important;color:var(--ink2);box-shadow:none !important;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
.scrim:not(.full)>.sheet .sh-title{margin:-16px -12px var(--sp-3);padding:var(--sp-3) 60px var(--sp-3) var(--sp-4);background:var(--tape-y);border-bottom:var(--bd-2) solid var(--ink2)}
.scrim:not(.full)>.sheet .sh-title b{color:var(--ink2);text-shadow:none;font-size:var(--fs-4)}
.scrim:not(.full)>.sheet .sh-title small{color:#5a4a00;font-size:var(--fs-1)}
.scrim:not(.full)>.sheet .sh-tip{color:#4a3d8c;font-size:var(--fs-2)}
.sheet .close{border-radius:0 !important;background:#fff !important;color:var(--ink2) !important;text-shadow:none !important;box-shadow:3px 3px 0 var(--ink2) !important;clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
.sheet .sh-foot{gap:var(--sp-3)}

/* ── 弹窗 .ov .pnl（设置、暂停、反馈、说明…）：方角 + 硬投影，标题已经是胶带 ── */
.pnl{border-radius:0 !important;border:var(--bd-3) solid var(--ink2) !important;box-shadow:7px 7px 0 var(--ink2) !important;background:var(--dots),#231748 !important}
.pnl .btn,.pnl-btns .btn{border-radius:0}
.pnl .setopt{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.pnl .setlbl{font-size:var(--fs-2) !important}

/* ── 物品卡在旧网格里 ── */
.mgrid{gap:var(--sp-3) var(--sp-2) !important}
.k-card.capped{margin-bottom:40px}
.k-cap{position:absolute;z-index:2;left:-2px;right:-2px;bottom:-38px;display:grid;justify-items:center;gap:1px;line-height:1.2;text-align:center;pointer-events:none}
.k-cap b{max-width:100%;font:900 var(--fs-1)/1.25 var(--font-pop);color:#fff;text-shadow:var(--ol-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-cap i{font:800 var(--fs-1)/1.25 var(--font-pop);font-style:normal;color:#cfc4ff;white-space:nowrap}
.k-cap em{margin-left:3px;font-style:normal;font-weight:900}.k-cap em.up{color:#7dffb0}.k-cap em.down{color:#ff7a7a}.k-cap em.eq{color:#cfc4ff}
.k-p3 .k-cap b,.scrim:not(.full) .k-cap b{color:var(--ink2);text-shadow:none}.k-p3 .k-cap i,.scrim:not(.full) .k-cap i{color:#4a3d8c}
.k-card .k-role{position:absolute;z-index:3;left:-2px;top:calc(var(--cp) * 1.6 + 2px);width:calc(var(--cp) * 1.5);min-width:18px;height:auto;filter:drop-shadow(1px 1px 0 var(--ink2))}
.k-card.locked .k-mat::after{filter:grayscale(1) brightness(.7)}
.k-empty{display:grid !important;place-items:center;background:var(--dots),#2b1c6c;border:var(--bd-2) dashed #8a7fb3 !important;color:#8a7fb3;font:900 var(--fs-4)/1 var(--font-pop);filter:none !important}
.k-empty span{font-size:var(--fs-2)}

/* ── 编成 · 装备盘页 ── */
.kw-sum{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:var(--sp-3) 0;padding:var(--sp-2) var(--sp-3);border:var(--bd-2) solid var(--ink2);background:#fffdf7;color:var(--ink2);box-shadow:5px 5px 0 var(--ink2)}
.kw-sum small{display:block;font:800 var(--fs-1)/1 var(--font-pop);color:#6a5ca8}.kw-sum b{font:400 var(--fs-5)/1.1 var(--font-num)}
.kw-how{display:flex;align-items:center;gap:var(--sp-1);font:800 var(--fs-1)/1.3 var(--font-pop);color:#6a5ca8;text-align:right}
.kw-tops{margin:0 0 var(--sp-3)}
.kw-grid{display:grid;grid-template-columns:1fr 1.55fr;gap:var(--sp-2);align-items:start}
.kw-main{display:grid;gap:var(--sp-1);justify-items:center}.kw-main small{font:900 var(--fs-1)/1 var(--font-pop);color:#fff59a}
.kw-btns{margin:var(--sp-4) 0 var(--sp-2)}
.kw-more{margin-top:var(--sp-5) !important}.kw-more summary{cursor:pointer;list-style:none}.kw-more summary::-webkit-details-marker{display:none}
.kw-p{margin:0 0 var(--sp-2);font:800 var(--fs-2)/1.5 var(--font-pop);color:#4a3d8c}
.kw-inv{margin-top:var(--sp-1)}

/* ── 主页 ── */
.sb .sbi{border-radius:0 !important;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:none !important}
.sb>span{border-radius:0;transform:skewX(-10deg);font-size:var(--fs-1)}
.goal{border-radius:0 !important;box-shadow:5px 5px 0 var(--ink2) !important}

/* ── 点击区补到 44：小按钮、可点的贴纸标签看起来 32～36 高，按得到的范围是 44 ── */
.k-btn.s{min-height:var(--hit)}
.k-btn.s::before{inset:4px 0}.k-btn.s::after{inset:7px 3px}
.chip,.k-filt .k-chip{position:relative;isolation:isolate;min-height:var(--hit);border:0 !important;background:none !important;box-shadow:none !important}
.chip::before,.k-filt .k-chip::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:6px;bottom:6px;border:var(--bd-1) solid var(--ink2);background:#fff;box-shadow:2px 2px 0 var(--ink2)}
.chip[aria-pressed="true"]::before,.k-filt .k-chip[aria-pressed="true"]::before{background:#ffe066}
.chip[aria-pressed="true"],.k-filt .k-chip[aria-pressed="true"]{background:none !important}

/* ── 功能开放卡、战力 UP：方纸片 + 硬投影 ── */
.unl-card{border-radius:0 !important;border:var(--bd-3) solid var(--ink2) !important;box-shadow:7px 7px 0 var(--ink2) !important}
.unl-new{border-radius:0 !important;background:var(--tape-y) !important;border:0 !important;clip-path:var(--tape-cut);box-shadow:none !important}
.unl-ic{border-radius:0 !important;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0 !important}
.unl-rew{border-radius:0 !important;transform:skewX(-10deg)}
.powpop{border-radius:0 !important;box-shadow:6px 6px 0 var(--ink2),0 0 30px #ffd23f88 !important;background:var(--dots),#231748 !important}

/* ── 11/07 碧蓝骨架：正式编成页 / 详情页 ── */
.kb{display:block}
.kb-heroBtn{position:absolute;inset:0;width:56%;padding:0;border:0;background:none;cursor:pointer}
.kb-hero.swapping{animation:wobble .6s ease-in-out infinite}.kb-hero.swapsel,.kb-cell.swapsel{outline:4px solid #ffe066;outline-offset:2px}
.kb-cell.swapping .k-card{animation:wobble .6s ease-in-out infinite}
.kb-sumline{width:100%;border:0;cursor:pointer;text-align:left}
.kb-go{margin-left:auto;font-style:normal;color:#ffe066;font-size:var(--fs-3)}
.kb-tip{margin:var(--sp-3) 0 0;font:700 var(--fs-1)/1.5 var(--font-pop);color:#cfc4ff}
.kb .swapbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:0 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);background:#ffe066;color:var(--ink2);font:900 var(--fs-2)/1.3 var(--font-pop)}
.kb-act .k-btn small{font-size:11px}
.kb .kw-more{margin-top:var(--sp-4) !important}
.kd-foot3{display:grid !important;grid-template-columns:none !important;grid-auto-flow:column !important;grid-auto-columns:1fr}
.kd-foot3 .k-btn{padding:0 var(--sp-1);font-size:var(--fs-2)}
.kd-foot3 .tag{display:grid;place-items:center;min-height:var(--btn-m);font-size:var(--fs-1);white-space:normal;text-align:center}
.sheet.dp .kd-banner,.sheet.dp .kd-art,.sheet.dp .kd-look{margin:var(--sp-3) var(--page-x) 0}
.sheet.dp .kd-look{margin-bottom:var(--sp-3)}
.kd-num{display:grid;gap:var(--sp-2)}
.kd-num .k-btn{min-height:40px;font-size:var(--fs-1);padding:0 var(--sp-2)}
.kd-mainNote{font:800 var(--fs-1)/1.4 var(--font-pop);color:#7dffb0}

  clip-path:polygon(2% 10%,6% 0,14% 7%,24% 0,36% 6%,50% 0,64% 6%,76% 0,88% 6%,96% 0,100% 12%,100% 90%,96% 100%,86% 94%,72% 100%,58% 94%,44% 100%,30% 94%,16% 100%,6% 95%,0 88%);transform:rotate(-2deg);text-shadow:none !important;font-size:15px !important}

.scrim{z-index:30}

#bPause::before{left:13px}#bPause::after{right:13px}
